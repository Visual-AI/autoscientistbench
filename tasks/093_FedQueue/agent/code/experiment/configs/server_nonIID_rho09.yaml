# FedQueue controlled experiment (paper Sec. 6.2 / Table 4 / Table 9):
# K=4 clients, non-IID MNIST (Dirichlet alpha=0.5), CNN, high queue variance
# (rho=0.9 mapped to the lognormal queue sigma of the released QueueScheduler).
#
# Run from the workspace root:
#   python experiment/run_server.py --config experiment/configs/server_nonIID_rho09.yaml
client_configs:
  train_configs:
    trainer: "VanillaTrainer"
    mode: "step"
    num_local_steps: 100          # warm-up budget; QueueScheduler overrides per round
    optim: "Adam"
    optim_args:
      lr: 0.003                   # Table 9: lr base 0.003 (also QueueScheduler lr_base)
    loss_fn_path: "./experiment/loss/celoss.py"
    loss_fn_name: "CELoss"
    do_validation: False
    do_pre_validation: False
    metric_path: "./experiment/metric/acc.py"
    metric_name: "accuracy"
    use_dp: False
    epsilon: 1
    clip_grad: False
    clip_value: 1
    clip_norm: 1
    send_gradient: False          # send model weights: FedQueueAggregator averages weights
    train_batch_size: 64
    val_batch_size: 64
    train_data_shuffle: True
    val_data_shuffle: False

  model_configs:
    model_path: "./experiment/model_cnn.py"
    model_name: "CNN"
    model_kwargs:
      num_channel: 1
      num_classes: 10
      num_pixel: 28

  comm_configs:
    compressor_configs:
      enable_compression: False

server_configs:
  num_clients: 4
  scheduler: "QueueScheduler"
  scheduler_kwargs:
    same_init_model: True
    t_sync: 10.0                  # Tsync (Table 9)
    lr_base: 0.003                # lr base (Table 9)
    warm_up_steps: 10             # warmup steps (Table 9)
    alpha_queue: 0.5              # EWMA rate alpha (Table 9)
    alpha_compute: 0.5
    safety_buffer: 2.0            # delta (Table 9)
    admission_tolerance: 0.2      # gamma (Table 9)
    simulate_queue: true
    q_init: 2.0                   # q init (Table 9)
    alpha_admission: 0.2
    beta_queue: 0.5
    theta: 2.0
    queue_mode: "lognormal"
    queue_means: "1.5,2.5,3.5,4.5"  # queue means (Table 9)
    queue_sigma: 0.9                # rho = 0.9 (Table 4, high queue variability)
    slowdown: "1.0,1.0,1.0,1.0"
    queue_seed: 42
    log_fedqueue_metrics: true
    fedqueue_log_dir: "./results/server_nonIID_rho09"
  aggregator: "FedQueueAggregator"
  aggregator_kwargs:
    staleness_fn: "harmonic"      # Table 9: staleness mode harmonic
    staleness_fn_kwargs:
      beta: 0.5                   # Table 9: staleness beta 0.5
  device: "cpu"
  num_global_epochs: 50           # 50 FL rounds (Table 9)
  logging_output_dirname: "./logs"
  logging_output_filename: "result"
  comm_configs:
    grpc_configs:
      server_uri: "localhost:50055"
      max_message_size: 10485760
      use_ssl: False
      trusted: True
