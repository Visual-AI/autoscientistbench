<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>CILR-TS — Conditionally Identifiable Dynamic Latent Factor Recovery</title>
  <desc>Each 200-by-20 noisy multivariate time series is unmixed using non-Gaussian Laplace innovation structure to recover five latent AR(1) dynamic factors scored by exact one-to-one bipartite Pearson matching MCC.</desc>
  <defs>
    <clipPath id="cilr-card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="cilr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FAFE"/>
      <stop offset="58%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cilr-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cilr-funnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="cilr-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0C4366" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <g clip-path="url(#cilr-card-clip)">
    <rect width="640" height="400" fill="url(#cilr-bg)"/>
    <rect x="28" y="60" width="584" height="294" fill="url(#cilr-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#cilr-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="37" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">CILR-TS</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Identifiable Dynamic Latent Factors</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Left Column: Observed 20-Channel Multivariate Time Series X (200x20) -->
  <text x="116" y="84" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A0E17">Observed X (200×20)</text>
  <rect x="34" y="94" width="164" height="226" rx="10" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1.3"/>

  <!-- 10 dense intertwined mixed observation traces -->
  <g fill="none" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="44,114 58,108 72,118 86,105 100,115 114,121 128,109 142,116 156,107 170,117 188,111" stroke="#0C4366"/>
    <polyline points="44,136 58,142 72,130 86,138 100,144 114,131 128,139 142,128 156,141 170,134 188,139" stroke="#0284C7"/>
    <polyline points="44,158 58,152 72,163 86,154 100,149 114,162 128,155 142,164 156,152 170,160 188,154" stroke="#475569"/>
    <polyline points="44,180 58,187 72,175 86,184 100,174 114,186 128,179 142,173 156,185 170,178 188,184" stroke="#06B6D4"/>
    <polyline points="44,202 58,195 72,208 86,198 100,206 114,196 128,207 142,199 156,205 170,194 188,203" stroke="#0C4366"/>
    <polyline points="44,224 58,231 72,218 86,229 100,219 114,228 128,220 142,232 156,221 170,229 188,222" stroke="#0284C7"/>
    <polyline points="44,246 58,240 72,251 86,242 100,253 114,241 128,250 142,243 156,252 170,242 188,248" stroke="#475569"/>
    <polyline points="44,268 58,274 72,262 86,271 100,261 114,273 128,266 142,275 156,264 170,271 188,265" stroke="#06B6D4"/>
    <polyline points="44,290 58,283 72,295 86,287 100,294 114,284 128,296 142,288 156,295 170,285 188,292" stroke="#0C4366"/>
    <polyline points="44,308 58,312 72,303 86,311 100,304 114,313 128,305 142,311 156,303 170,310 188,306" stroke="#0284C7" stroke-opacity="0.7"/>
  </g>
  <text x="116" y="340" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Mixed + AR(1) Noise</text>

  <!-- Center Funnel: Non-Gaussian Laplace Innovation Unmixing -->
  <polygon points="206,104 314,142 314,272 206,310" fill="url(#cilr-funnel)" stroke="#0284C7" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Sharp Laplace cusp density inset inside funnel -->
  <line x1="224" y1="242" x2="296" y2="242" stroke="#475569" stroke-width="1.4"/>
  <!-- Faint Gaussian reference bell -->
  <path d="M226 242 C240 240 248 206 260 206 C272 206 280 240 294 242" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 2.5"/>
  <!-- Sharp peaked Laplace density -->
  <path d="M226 242 C246 240 255 224 260 172 C265 224 274 240 294 242 Z" fill="#06B6D4" fill-opacity="0.28"/>
  <path d="M226 242 C246 240 255 224 260 172 C265 224 274 240 294 242" fill="none" stroke="#0284C7" stroke-width="2.6" stroke-linejoin="miter"/>

  <text x="260" y="162" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0284C7">Laplace εₜ</text>
  <text x="260" y="266" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0C4366">Unmix</text>

  <!-- Right-Center: 5 Recovered Latent AR(1) Dynamic Factors -->
  <text x="404" y="84" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0284C7">5 Latent Factors</text>

  <!-- Subtle baselines -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="326" y1="118" x2="482" y2="118"/>
    <line x1="326" y1="162" x2="482" y2="162"/>
    <line x1="326" y1="206" x2="482" y2="206"/>
    <line x1="326" y1="250" x2="482" y2="250"/>
    <line x1="326" y1="294" x2="482" y2="294"/>
  </g>

  <!-- Five separated smooth AR(1) trajectories (rho=0.7) -->
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M328 118 C346 100 364 102 384 126 C402 142 422 104 442 108 C458 112 470 124 480 116" stroke="#0284C7"/>
    <path d="M328 164 C348 178 368 148 390 150 C412 152 430 176 452 162 C464 154 472 156 480 162" stroke="#06B6D4"/>
    <path d="M328 206 C344 190 362 220 384 218 C406 216 420 190 444 196 C460 200 470 214 480 204" stroke="#0C4366"/>
    <path d="M328 252 C350 236 372 238 394 258 C414 270 434 240 456 242 C468 244 474 252 480 250" stroke="#059669"/>
    <path d="M328 294 C346 308 366 280 388 282 C410 284 428 310 450 298 C464 290 472 288 480 294" stroke="#0284C7"/>
  </g>
  <text x="404" y="340" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">AR(1) · ρ = 0.7</text>

  <!-- Far-Right: Exact 1-to-1 Optimal Bipartite Permutation Matching -->
  <text x="512" y="96" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0284C7">f̂</text>
  <text x="594" y="96" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#059669">f*</text>

  <!-- Faint non-selected correlation edges -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.65">
    <line x1="512" y1="118" x2="594" y2="118"/>
    <line x1="512" y1="162" x2="594" y2="162"/>
    <line x1="512" y1="162" x2="594" y2="206"/>
    <line x1="512" y1="206" x2="594" y2="250"/>
    <line x1="512" y1="250" x2="594" y2="250"/>
    <line x1="512" y1="294" x2="594" y2="294"/>
  </g>

  <!-- Optimal 1-to-1 Permutation Matching Edges (1->2, 2->1, 3->3, 4->5, 5->4) -->
  <g fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round">
    <path d="M512 118 C544 118 562 162 594 162"/>
    <path d="M512 162 C544 162 562 118 594 118"/>
    <path d="M512 206 L594 206"/>
    <path d="M512 250 C544 250 562 294 594 294"/>
    <path d="M512 294 C544 294 562 250 594 250"/>
  </g>

  <!-- Recovered factor nodes (left) -->
  <g fill="#0284C7" stroke="#FFFFFF" stroke-width="2">
    <circle cx="512" cy="118" r="6.5"/>
    <circle cx="512" cy="162" r="6.5"/>
    <circle cx="512" cy="206" r="6.5"/>
    <circle cx="512" cy="250" r="6.5"/>
    <circle cx="512" cy="294" r="6.5"/>
  </g>
  <!-- True factor nodes (right) -->
  <g fill="#059669" stroke="#FFFFFF" stroke-width="2">
    <circle cx="594" cy="118" r="6.5"/>
    <circle cx="594" cy="162" r="6.5"/>
    <circle cx="594" cy="206" r="6.5"/>
    <circle cx="594" cy="250" r="6.5"/>
    <circle cx="594" cy="294" r="6.5"/>
  </g>

  <text x="553" y="340" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">1-to-1 |r|</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">Per-Instance Recovery · Non-Gaussian DGP</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#0284C7">MCC ↑</tspan></text>
</svg>
