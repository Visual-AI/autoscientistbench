<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>SENDAI — Hierarchical Sparse NDVI Data Assimilation</title>
  <desc>Five lagged sparse sensor snapshots and a simulation prior feed a low-frequency DA-SHRED pathway and two high-frequency implicit neural representation layers that sum into a reconstructed Tarim Basin NDVI field.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <clipPath id="ndvi-map-clip">
      <rect x="460" y="106" width="148" height="148" rx="10"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBF6"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="ndvi-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4FBF6"/>
      <stop offset="35%" stop-color="#DCFCE7"/>
      <stop offset="70%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#124724"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#124724" opacity="0.15"/>
    </pattern>
    <marker id="arrow-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#15803D"/>
    </marker>
    <marker id="arrow-sec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#22C55E"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="0" y="54" width="640" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#top-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="36" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">SENDAI</text>
  <text x="612" y="35" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Hierarchical Sparse NDVI Assimilation</text>
  <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Zone 1: Simulation Prior + 5-Lag Sparse Sensor Stack -->
  <g id="sensor-input">
    <!-- Simulated-Season Prior pill -->
    <rect x="38" y="76" width="126" height="40" rx="9" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M 52 102 Q 62 88 72 96 T 90 92" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round"/>
    <text x="102" y="100" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#124724">Sim Prior</text>

    <!-- Prior flow line down to LF DA-SHRED -->
    <path d="M 164 96 C 184 96 180 274 208 274" fill="none" stroke="#15803D" stroke-width="1.8" stroke-dasharray="5 3" stroke-opacity="0.65" marker-end="url(#arrow-grn)"/>

    <!-- 5 Fanned Isometric Sensor Slices (t-4 .. t) -->
    <g stroke-linejoin="round">
      <!-- t-4 -->
      <polygon points="104,142 164,167 104,192 44,167" fill="#DCFCE7" fill-opacity="0.4" stroke="#CBD5E1" stroke-width="1.3"/>
      <!-- t-3 -->
      <polygon points="104,160 164,185 104,210 44,185" fill="#DCFCE7" fill-opacity="0.52" stroke="#CBD5E1" stroke-width="1.3"/>
      <!-- t-2 -->
      <polygon points="104,178 164,203 104,228 44,203" fill="#DCFCE7" fill-opacity="0.64" stroke="#22C55E" stroke-opacity="0.5" stroke-width="1.4"/>
      <!-- t-1 -->
      <polygon points="104,196 164,221 104,246 44,221" fill="#FFFFFF" fill-opacity="0.82" stroke="#22C55E" stroke-opacity="0.7" stroke-width="1.6"/>
      <!-- t (front active frame) -->
      <polygon points="104,214 164,239 104,264 44,239" fill="#FFFFFF" stroke="#15803D" stroke-width="2.3"/>
    </g>

    <!-- Coordinate grid inside front slice -->
    <g stroke="#CBD5E1" stroke-width="0.9" opacity="0.7">
      <line x1="74" y1="226.5" x2="134" y2="251.5"/>
      <line x1="89" y1="220.2" x2="149" y2="245.2"/>
      <line x1="74" y1="251.5" x2="134" y2="226.5"/>
      <line x1="89" y1="257.8" x2="149" y2="232.8"/>
    </g>

    <!-- Fixed sparse sensor pins on front slice -->
    <g fill="#15803D" stroke="#FFFFFF" stroke-width="1.3">
      <circle cx="88" cy="233" r="3.8"/><circle cx="106" cy="227" r="3.8"/><circle cx="122" cy="236" r="3.8"/>
      <circle cx="72" cy="240" r="3.5"/><circle cx="96" cy="245" r="4"/><circle cx="114" cy="249" r="3.8"/>
      <circle cx="136" cy="241" r="3.5"/><circle cx="104" cy="237" r="3.6"/><circle cx="84" cy="246" r="3.4"/>
    </g>

    <!-- Lag bracket label -->
    <text x="104" y="324" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#124724">Sparse Sensors</text>
    <text x="104" y="342" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">64 locs · 5 lags</text>
  </g>

  <!-- Routing Arrows: Sensors -> LF + Residual HF INR Layers -->
  <path d="M 168 239 C 190 239 190 268 208 268" fill="none" stroke="#15803D" stroke-width="2.4" marker-end="url(#arrow-grn)"/>
  <path d="M 168 239 C 190 239 190 194 208 194" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-sec)"/>
  <path d="M 168 239 C 194 212 190 116 208 116" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-sec)"/>

  <!-- Zone 2: Hierarchical 3-Plate Assimilation Stack -->
  <g id="hierarchical-stack">
    <!-- Plate 3 (Bottom): Low-Frequency DA-SHRED -->
    <polygon points="278,244 342,272 278,300 214,272" fill="#FFFFFF" stroke="#15803D" stroke-width="2.2" stroke-linejoin="round"/>
    <ellipse cx="278" cy="272" rx="34" ry="14" fill="#DCFCE7"/>
    <ellipse cx="282" cy="271" rx="20" ry="8" fill="#22C55E" fill-opacity="0.45"/>

    <!-- Plus badge 1 -->
    <circle cx="278" cy="233" r="9.5" fill="#FFFFFF" stroke="#15803D" stroke-width="1.8"/>
    <path d="M 274 233 H 282 M 278 229 V 237" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>

    <!-- Plate 2 (Middle): HF INR Layer 1 -->
    <polygon points="278,166 342,194 278,222 214,194" fill="#FFFFFF" stroke="#22C55E" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 242 194 Q 260 180 278 194 T 314 194" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 250 202 Q 268 188 286 200 T 312 190" fill="none" stroke="#15803D" stroke-width="1.6" stroke-opacity="0.7" stroke-linecap="round"/>

    <!-- Plus badge 2 -->
    <circle cx="278" cy="155" r="9.5" fill="#FFFFFF" stroke="#15803D" stroke-width="1.8"/>
    <path d="M 274 155 H 282 M 278 151 V 159" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>

    <!-- Plate 1 (Top): HF INR Layer 2 (Fine Detail) -->
    <polygon points="278,88 342,116 278,144 214,116" fill="#FFFFFF" stroke="#124724" stroke-width="2.2" stroke-linejoin="round"/>
    <g fill="none" stroke="#124724" stroke-width="1.6" stroke-linecap="round">
      <path d="M 246 116 L 260 109 L 272 119 L 286 107 L 300 118 L 312 112"/>
      <path d="M 256 124 L 270 116 L 284 126 L 298 118"/>
    </g>

    <!-- Layer labels to the right of stack -->
    <text x="348" y="120" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#124724">HF INR 2</text>
    <text x="348" y="198" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#15803D">HF INR 1</text>
    <text x="348" y="276" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#15803D">DA-SHRED</text>

    <text x="278" y="324" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#124724">Hierarchical Fusion</text>
    <text x="278" y="342" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">u(DA) + Σ u(HF)</text>
  </g>

  <!-- Merging Bracket & Output Arrow -->
  <path d="M 420 116 C 431 116 428 180 438 180 C 428 180 431 272 420 272" fill="none" stroke="#15803D" stroke-width="1.8" stroke-opacity="0.75"/>
  <line x1="438" y1="180" x2="452" y2="180" stroke="#15803D" stroke-width="2.6" marker-end="url(#arrow-grn)"/>

  <!-- Zone 3: Reconstructed 64x64 Tarim Basin NDVI Field -->
  <g id="ndvi-output">
    <rect x="460" y="106" width="148" height="148" rx="10" fill="#F4FBF6" stroke="#124724" stroke-width="2.2"/>
    <g clip-path="url(#ndvi-map-clip)">
      <!-- Broad Tarim Basin valley NDVI washes -->
      <path d="M 454 202 C 482 184 504 148 538 134 C 566 122 590 124 614 114 L 614 196 C 584 206 556 226 520 236 C 492 244 470 246 454 256 Z" fill="#DCFCE7"/>
      <!-- Mid vegetation belt -->
      <path d="M 462 212 C 492 192 512 162 544 148 C 570 136 592 138 612 128 L 612 178 C 582 186 558 206 524 218 C 498 226 480 232 462 238 Z" fill="#22C55E" fill-opacity="0.48"/>
      <!-- Lush oasis corridor -->
      <path d="M 476 214 C 504 196 524 170 554 156 C 576 146 594 146 608 140 L 608 164 C 582 172 560 190 532 204 C 508 214 492 220 476 224 Z" fill="#15803D" fill-opacity="0.72"/>
      <!-- Peak NDVI oasis cores -->
      <ellipse cx="556" cy="166" rx="22" ry="11" transform="rotate(-24 556 166)" fill="#124724" fill-opacity="0.78"/>
      <ellipse cx="512" cy="204" rx="18" ry="8" transform="rotate(-28 512 204)" fill="#124724" fill-opacity="0.72"/>
      <!-- Fine spatial contour lines -->
      <path d="M 468 158 Q 502 140 534 120" fill="none" stroke="#22C55E" stroke-width="1.3" stroke-opacity="0.6"/>
      <path d="M 548 238 Q 576 218 604 206" fill="none" stroke="#22C55E" stroke-width="1.3" stroke-opacity="0.6"/>
      <!-- Subtle coordinate hairline cross -->
      <line x1="460" y1="180" x2="608" y2="180" stroke="#124724" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="534" y1="106" x2="534" y2="254" stroke="#124724" stroke-opacity="0.12" stroke-width="1"/>
    </g>

    <!-- 7x7 SSIM inspection window highlight -->
    <rect x="545" y="156" width="20" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    <rect x="545" y="156" width="20" height="20" rx="2" fill="none" stroke="#0A0E17" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Sensor verification pins on reconstructed field -->
    <g fill="#FFFFFF" stroke="#124724" stroke-width="1.4">
      <circle cx="496" cy="212" r="3"/>
      <circle cx="524" cy="196" r="3"/>
      <circle cx="578" cy="154" r="3"/>
      <circle cx="510" cy="144" r="2.8"/>
      <circle cx="572" cy="218" r="2.8"/>
    </g>

    <!-- NDVI Colorbar -->
    <rect x="466" y="268" width="136" height="9" rx="4.5" fill="url(#ndvi-bar)" stroke="#CBD5E1" stroke-width="0.9"/>
    <text x="466" y="292" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">0</text>
    <text x="534" y="292" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#124724">NDVI</text>
    <text x="602" y="292" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">1</text>

    <text x="534" y="324" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#124724">64×64 NDVI Field</text>
    <text x="534" y="342" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#059669">RMSE ≤ 0.130</text>
  </g>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Tarim Basin 64×64 · 64 sparse sensors</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5"><tspan fill="#475569">Target: </tspan><tspan font-weight="700" fill="#15803D">ssim ↑</tspan></text>
</svg>
