<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>DOCKMIND — Bounded Six-Parameter Virtual-Screening Hit-Rate Model</title>
  <desc>A correlated bivariate-normal score-versus-affinity distribution combined with a score-independent docking artifact population reproduces the non-monotonic rise and top-rank turnover of virtual-screening hit-rate curves across AmpC, D4, and Sigma2.</desc>
  <defs>
    <clipPath id="dockmind-card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="dockmind-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6F8"/>
      <stop offset="58%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="dockmind-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <pattern id="dockmind-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6B1028" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <g clip-path="url(#dockmind-card-clip)">
    <rect width="640" height="400" fill="url(#dockmind-bg)"/>
    <rect x="28" y="60" width="584" height="294" fill="url(#dockmind-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#dockmind-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="37" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">DOCKMIND</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Virtual-Screening Hit-Rate Modeling</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Left Panel: Score vs Affinity (pKi) Joint Distribution + Artifact Lobe -->
  <text x="156" y="84" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Joint Score–Affinity Model</text>

  <!-- Active hit quadrant tint -->
  <rect x="184" y="100" width="68" height="74" fill="#059669" fill-opacity="0.10"/>

  <!-- Correlated Bivariate-Normal Population (rho > 0) -->
  <g transform="translate(142 204) rotate(-33)">
    <ellipse cx="0" cy="0" rx="74" ry="34" fill="#FFE4E6" fill-opacity="0.56" stroke="#F43F5E" stroke-width="1.6"/>
    <ellipse cx="0" cy="0" rx="48" ry="21" fill="#F43F5E" fill-opacity="0.22" stroke="#E11D48" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="23" ry="10" fill="#E11D48" fill-opacity="0.34" stroke="#E11D48" stroke-width="2"/>
  </g>

  <!-- Score-Independent Docking Artifact Population at high score, low affinity -->
  <ellipse cx="220" cy="248" rx="26" ry="18" fill="#6B1028" fill-opacity="0.16" stroke="#6B1028" stroke-width="1.8" stroke-dasharray="4 3"/>
  <ellipse cx="220" cy="248" rx="13" ry="9" fill="#6B1028" fill-opacity="0.32"/>

  <!-- Axes & Thresholds -->
  <line x1="62" y1="100" x2="62" y2="306" stroke="#475569" stroke-width="1.8"/>
  <line x1="62" y1="306" x2="254" y2="306" stroke="#475569" stroke-width="1.8"/>
  <line x1="62" y1="174" x2="252" y2="174" stroke="#059669" stroke-width="1.7" stroke-dasharray="5 3"/>
  <line x1="184" y1="100" x2="184" y2="306" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 4"/>

  <text x="70" y="166" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">pKi Cut</text>
  <text x="218" y="122" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Hits</text>
  <text x="106" y="276" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E11D48">ρ (True)</text>
  <text x="220" y="286" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#6B1028">Artifacts</text>

  <text x="44" y="204" text-anchor="middle" transform="rotate(-90 44 204)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Affinity (pKi)</text>
  <text x="158" y="329" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Docking Score →</text>

  <!-- Right Panel: Hooked Virtual-Screening Hit-Rate Curves -->
  <text x="462" y="84" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Hit-Rate Curves vs. pProp</text>

  <!-- Artifact turnover zone -->
  <rect x="526" y="100" width="76" height="206" fill="#FFE4E6" fill-opacity="0.38"/>
  <text x="564" y="116" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6B1028">Turnover</text>

  <!-- Guide hairlines & Axes -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.6">
    <line x1="322" y1="152" x2="602" y2="152"/>
    <line x1="322" y1="204" x2="602" y2="204"/>
    <line x1="322" y1="256" x2="602" y2="256"/>
  </g>
  <line x1="322" y1="100" x2="322" y2="306" stroke="#475569" stroke-width="1.8"/>
  <line x1="322" y1="306" x2="604" y2="306" stroke="#475569" stroke-width="1.8"/>

  <!-- Curve 1: AmpC (#E11D48) -->
  <path d="M332 294 C380 278 424 226 462 174 C492 134 516 126 534 140 C556 158 574 196 592 232" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
  <!-- AmpC observations + CI whiskers -->
  <g stroke="#E11D48" stroke-width="1.5">
    <line x1="364" y1="274" x2="364" y2="288"/><line x1="416" y1="226" x2="416" y2="246"/>
    <line x1="462" y1="162" x2="462" y2="188"/><line x1="506" y1="120" x2="506" y2="148"/>
    <line x1="548" y1="142" x2="548" y2="174"/><line x1="582" y1="196" x2="582" y2="230"/>
  </g>
  <g fill="#E11D48" stroke="#FFFFFF" stroke-width="1.4">
    <circle cx="364" cy="281" r="4.2"/><circle cx="416" cy="236" r="4.2"/>
    <circle cx="462" cy="175" r="4.4"/><circle cx="506" cy="134" r="4.4"/>
    <circle cx="548" cy="158" r="4.2"/><circle cx="582" cy="213" r="4.2"/>
  </g>
  <text x="460" y="128" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E11D48">AmpC</text>

  <!-- Curve 2: D4 (#6B1028) -->
  <path d="M332 299 C386 288 434 252 476 210 C504 182 526 178 544 192 C564 208 578 232 592 256" fill="none" stroke="#6B1028" stroke-width="2.6" stroke-linecap="round"/>
  <g stroke="#6B1028" stroke-width="1.4">
    <line x1="382" y1="280" x2="382" y2="294"/><line x1="436" y1="242" x2="436" y2="262"/>
    <line x1="484" y1="192" x2="484" y2="216"/><line x1="528" y1="172" x2="528" y2="198"/>
    <line x1="572" y1="212" x2="572" y2="240"/>
  </g>
  <g fill="#6B1028" stroke="#FFFFFF" stroke-width="1.3">
    <rect x="378" y="283" width="7.5" height="7.5" rx="1.5"/>
    <rect x="432" y="248" width="7.5" height="7.5" rx="1.5"/>
    <rect x="480" y="200" width="7.5" height="7.5" rx="1.5"/>
    <rect x="524" y="181" width="7.5" height="7.5" rx="1.5"/>
    <rect x="568" y="222" width="7.5" height="7.5" rx="1.5"/>
  </g>
  <text x="466" y="232" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#6B1028">D4</text>

  <!-- Curve 3: Sigma2 (#059669) -->
  <path d="M332 303 C392 298 446 276 488 250 C516 234 534 232 552 244 C568 254 580 268 592 282" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <g stroke="#059669" stroke-width="1.4">
    <line x1="398" y1="288" x2="398" y2="298"/><line x1="456" y1="260" x2="456" y2="278"/>
    <line x1="506" y1="232" x2="506" y2="252"/><line x1="556" y1="238" x2="556" y2="260"/>
  </g>
  <g fill="#059669" stroke="#FFFFFF" stroke-width="1.3">
    <circle cx="398" cy="293" r="4"/><circle cx="456" cy="269" r="4"/>
    <circle cx="506" cy="242" r="4.2"/><circle cx="556" cy="249" r="4"/>
  </g>
  <text x="518" y="286" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">Sigma2</text>

  <text x="302" y="204" text-anchor="middle" transform="rotate(-90 302 204)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Hit Rate</text>
  <text x="462" y="329" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">pProp = −log₁₀(fraction)</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">Bounded 6-Parameter Fit · 93 Observations</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#E11D48">MSE ↓</tspan></text>
</svg>
