<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>BFM-SWM: Budget-Feasible Clock Procurement for Submodular Welfare</title>
  <desc>A budget-feasible descending clock auction posts non-rising take-it-or-leave-it offers to suppliers with private costs in a social network, selecting a seed set whose overlapping coverage maximizes submodular welfare within budget B.</desc>
  <defs>
    <clipPath id="bfm-card-clip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bfm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FAFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bfm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bfm-step-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="bfm-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0C4366" opacity="0.16"/>
    </pattern>
  </defs>

  <g clip-path="url(#bfm-card-clip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bfm-bg)"/>
    <rect x="20" y="58" width="600" height="296" fill="url(#bfm-dots)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#bfm-accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="28" y="38" font-size="18" font-weight="700" fill="#0A0E17">BFM-SWM</text>
    <text x="612" y="37" text-anchor="end" font-size="12.5" fill="#475569">Budget-Feasible Clock Procurement</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="0.9" opacity="0.75"/>
  </g>

  <!-- Left Panel: Submodular Coverage Network -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="28" y="72" width="302" height="272" rx="12" fill="#FFFFFF" fill-opacity="0.86" stroke="#CBD5E1" stroke-width="1"/>
    <text x="179" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#0C4366">Coverage Valuation v(S) = |N(S)|</text>

    <!-- Overlapping Submodular Coverage Halos -->
    <circle cx="122" cy="174" r="56" fill="#06B6D4" fill-opacity="0.15" stroke="#0284C7" stroke-width="1.4" stroke-dasharray="4 3" stroke-opacity="0.55"/>
    <circle cx="204" cy="182" r="56" fill="#0284C7" fill-opacity="0.14" stroke="#0284C7" stroke-width="1.4" stroke-dasharray="4 3" stroke-opacity="0.55"/>
    <circle cx="158" cy="244" r="52" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.4" stroke-dasharray="4 3" stroke-opacity="0.65"/>

    <!-- Graph Edges -->
    <g stroke="#CBD5E1" stroke-width="1.5">
      <!-- Winner 1 edges -->
      <line x1="122" y1="174" x2="82" y2="146"/>
      <line x1="122" y1="174" x2="78" y2="196"/>
      <line x1="122" y1="174" x2="128" y2="128"/>
      <line x1="122" y1="174" x2="164" y2="162"/>
      <line x1="122" y1="174" x2="158" y2="204"/>
      <!-- Winner 2 edges -->
      <line x1="204" y1="182" x2="164" y2="162"/>
      <line x1="204" y1="182" x2="158" y2="204"/>
      <line x1="204" y1="182" x2="218" y2="136"/>
      <line x1="204" y1="182" x2="248" y2="178"/>
      <line x1="204" y1="182" x2="236" y2="220"/>
      <!-- Winner 3 edges -->
      <line x1="158" y1="244" x2="158" y2="204"/>
      <line x1="158" y1="244" x2="116" y2="254"/>
      <line x1="158" y1="244" x2="154" y2="286"/>
      <line x1="158" y1="244" x2="198" y2="268"/>
      <!-- Edges to rejected / outside suppliers -->
      <line x1="248" y1="178" x2="292" y2="144" stroke-dasharray="3 3"/>
      <line x1="116" y1="254" x2="62" y2="274" stroke-dasharray="3 3"/>
      <line x1="236" y1="220" x2="288" y2="262" stroke-dasharray="3 3"/>
    </g>

    <!-- Covered Neighbor Nodes N(S) -->
    <g fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.8">
      <circle cx="82" cy="146" r="6"/>
      <circle cx="78" cy="196" r="6"/>
      <circle cx="128" cy="128" r="6"/>
      <circle cx="164" cy="162" r="6.5" fill="#059669"/>
      <circle cx="158" cy="204" r="6.5" fill="#059669"/>
      <circle cx="218" cy="136" r="6"/>
      <circle cx="248" cy="178" r="6"/>
      <circle cx="236" cy="220" r="6"/>
      <circle cx="116" cy="254" r="6"/>
      <circle cx="154" cy="286" r="6"/>
      <circle cx="198" cy="268" r="6"/>
    </g>

    <!-- Rejected / Dropped High-Cost Suppliers -->
    <g>
      <circle cx="292" cy="144" r="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.8"/>
      <path d="M 289 141 L 295 147 M 295 141 L 289 147" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round"/>

      <circle cx="62" cy="274" r="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.8"/>
      <path d="M 59 271 L 65 277 M 65 271 L 59 277" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round"/>

      <circle cx="288" cy="262" r="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.8"/>
      <path d="M 285 259 L 291 265 M 291 259 L 285 265" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Selected Winner Nodes S -->
    <g>
      <circle cx="122" cy="174" r="12" fill="#0284C7" stroke="#FFFFFF" stroke-width="2.2"/>
      <text x="122" y="178.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">S</text>

      <circle cx="204" cy="182" r="12" fill="#0284C7" stroke="#FFFFFF" stroke-width="2.2"/>
      <text x="204" y="186.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">S</text>

      <circle cx="158" cy="244" r="12" fill="#0284C7" stroke="#FFFFFF" stroke-width="2.2"/>
      <text x="158" y="248.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">S</text>
    </g>

    <!-- Compact Legend -->
    <circle cx="52" cy="326" r="5" fill="#0284C7"/>
    <text x="63" y="330" font-size="11" fill="#0A0E17">Winners</text>

    <circle cx="136" cy="326" r="5" fill="#06B6D4"/>
    <text x="147" y="330" font-size="11" fill="#0A0E17">Covered</text>

    <circle cx="222" cy="326" r="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
    <text x="233" y="330" font-size="11" fill="#0A0E17">Rejected</text>
  </g>

  <!-- Right Panel: Descending Clock Staircase & Budget Cap -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="348" y="72" width="264" height="272" rx="12" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
    <text x="480" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#0C4366">Descending Clock Offers</text>

    <!-- Faint Plot Grid -->
    <g stroke="#CBD5E1" stroke-width="0.9" opacity="0.5">
      <line x1="388" y1="142" x2="596" y2="142"/>
      <line x1="388" y1="184" x2="596" y2="184"/>
      <line x1="388" y1="226" x2="596" y2="226"/>
    </g>

    <!-- Shaded area under staircase -->
    <path d="M 392 124 H 434 V 154 H 478 V 184 H 524 V 214 H 568 V 226 H 592 V 250 H 392 Z" fill="url(#bfm-step-fill)"/>

    <!-- Bold Monotone Non-Rising Price Staircase -->
    <path d="M 392 124 H 434 V 154 H 478 V 184 H 524 V 214 H 568 V 226 H 592" fill="none" stroke="#0284C7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rejected Exits (cost > posted price) -->
    <g>
      <circle cx="434" cy="142" r="5.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.8"/>
      <path d="M 431.5 139.5 L 436.5 144.5 M 436.5 139.5 L 431.5 144.5" stroke="#E11D48" stroke-width="1.6" stroke-linecap="round"/>

      <circle cx="478" cy="172" r="5.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.8"/>
      <path d="M 475.5 169.5 L 480.5 174.5 M 480.5 169.5 L 475.5 174.5" stroke="#E11D48" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Accepted Winners (cost <= posted price) -->
    <g fill="#059669" stroke="#FFFFFF" stroke-width="1.8">
      <circle cx="524" cy="214" r="5.5"/>
      <circle cx="568" cy="226" r="5.5"/>
    </g>

    <!-- Clear Right-Aligned Labels in Open Space Above Staircase -->
    <text x="592" y="125" text-anchor="end" font-size="11" font-weight="700" fill="#E11D48">Reject: c &gt; p</text>
    <text x="592" y="143" text-anchor="end" font-size="11" font-weight="700" fill="#059669">Accept: c ≤ p</text>
    <text x="404" y="238" font-size="11.5" font-weight="700" fill="#0284C7">p₁ ≥ p₂ ≥ …</text>

    <!-- Plot Axes -->
    <path d="M 388 108 V 250 H 598" fill="none" stroke="#0A0E17" stroke-width="1.8" stroke-linecap="round"/>
    <text x="368" y="180" transform="rotate(-90 368 180)" text-anchor="middle" font-size="11.5" fill="#475569">Offer price p</text>
    <text x="493" y="270" text-anchor="middle" font-size="11.5" fill="#475569">Clock rounds →</text>

    <!-- Budget Feasibility Bar -->
    <text x="370" y="299" font-size="11.5" font-weight="600" fill="#0C4366">Spend Σ pᵢ ≤ B</text>
    <text x="596" y="299" text-anchor="end" font-size="11.5" font-weight="700" fill="#059669">v(S) − c(S)</text>
    <rect x="370" y="309" width="226" height="16" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <rect x="371" y="310" width="172" height="14" rx="7" fill="url(#bfm-accent)"/>
    <line x1="596" y1="305" x2="596" y2="329" stroke="#0C4366" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Footer -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="0.9" opacity="0.75"/>
    <text x="28" y="380" font-size="12.5" fill="#475569">Target metric: <tspan font-weight="700" fill="#0284C7">welfare_ratio ↑</tspan></text>
    <text x="612" y="380" text-anchor="end" font-size="12" fill="#475569">Take-it-or-leave-it · Non-rising prices</text>
  </g>
</svg>
