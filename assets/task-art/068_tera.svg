<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>Tera-GP: Exact Gradient-Reduced Derivative Gaussian Processes</title>
  <desc>Molecular coordinates and atomic forces within a Vecchia conditioning neighborhood undergo exact gradient reduction from md coordinates to m-squared directional derivatives, pinning a scalable Gaussian process potential energy surface.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6E2707" fill-opacity="0.15"/>
    </pattern>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#EA580C"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#6E2707"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base Plate -->
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="24" y="58" width="592" height="296" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#accentBar)"/>

    <!-- Header Zone (y=18..54) -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17">Tera-GP</text>
    <text x="612" y="36" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Exact Gradient-Reduced Derivative GP</text>
    <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>

    <!-- LEFT: MD22 Molecular Structure + Force Vectors in Vecchia Neighborhood -->
    <g>
      <text x="122" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0E17">Atomic Coords &amp; Forces</text>

      <!-- Vecchia m-neighbor Conditioning Ball -->
      <circle cx="122" cy="204" r="84" fill="#FFEDD5" fill-opacity="0.35" stroke="#F97316" stroke-width="1.8" stroke-dasharray="6 4"/>
      <text x="122" y="310" text-anchor="middle" font-size="11.5" font-weight="600" fill="#EA580C">m-neighbor Vecchia</text>

      <!-- Bicyclic Aromatic Molecular Backbone -->
      <g stroke="#6E2707" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Left 6-ring -->
        <polygon points="86,184 110,170 134,184 134,214 110,228 86,214"/>
        <!-- Fused right 5-ring -->
        <polyline points="134,184 162,175 178,199 162,223 134,214"/>
        <!-- Substituent branches -->
        <line x1="110" y1="170" x2="110" y2="146"/>
        <line x1="86" y1="214" x2="66" y2="228"/>
        <line x1="162" y1="223" x2="174" y2="244"/>
      </g>
      <!-- Inner Aromatic Double-Bond Hints -->
      <g stroke="#F97316" stroke-width="1.6" stroke-opacity="0.85">
        <line x1="92" y1="188" x2="92" y2="210"/>
        <line x1="110" y1="177" x2="128" y2="188"/>
        <line x1="110" y1="221" x2="128" y2="210"/>
      </g>

      <!-- Force Vectors F = -∇E Radiating from Atoms -->
      <g stroke="#EA580C" stroke-width="2.4" marker-end="url(#arrOrange)">
        <line x1="110" y1="142" x2="132" y2="124"/>
        <line x1="181" y1="199" x2="205" y2="192"/>
        <line x1="63" y1="230" x2="43" y2="246"/>
        <line x1="176" y1="248" x2="190" y2="270"/>
        <line x1="83" y1="182" x2="61" y2="168"/>
      </g>
      <text x="162" y="112" font-size="11.5" font-weight="700" fill="#EA580C">F = -∇E</text>

      <!-- Atom Nodes -->
      <g stroke="#FFFFFF" stroke-width="1.6">
        <circle cx="86" cy="184" r="5.5" fill="#0A0E17"/>
        <circle cx="110" cy="170" r="5.5" fill="#0A0E17"/>
        <circle cx="134" cy="184" r="5.5" fill="#0A0E17"/>
        <circle cx="134" cy="214" r="5.5" fill="#0A0E17"/>
        <circle cx="110" cy="228" r="5.5" fill="#0A0E17"/>
        <circle cx="86" cy="214" r="5.5" fill="#0A0E17"/>
        <circle cx="162" cy="175" r="6" fill="#EA580C"/>
        <circle cx="178" cy="199" r="5.5" fill="#0A0E17"/>
        <circle cx="162" cy="223" r="6" fill="#EA580C"/>
        <circle cx="110" cy="146" r="5" fill="#F97316"/>
        <circle cx="66" cy="228" r="4.5" fill="#F97316"/>
        <circle cx="174" cy="244" r="4.5" fill="#F97316"/>
      </g>
    </g>

    <!-- CENTER HERO: Exact Gradient Reduction (m·d -> m²) -->
    <g>
      <text x="326" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0E17">Exact Gradient Reduction</text>

      <!-- High-Dim Full Gradient Block (m·d) -->
      <rect x="234" y="116" width="38" height="174" rx="5" fill="#FFFFFF" stroke="#6E2707" stroke-width="2"/>
      <!-- Striped gradient coordinate slices -->
      <g fill="#FFEDD5" stroke="#F97316" stroke-width="0.8" stroke-opacity="0.7">
        <rect x="238" y="122" width="30" height="12" rx="1.5"/>
        <rect x="238" y="138" width="30" height="12" rx="1.5"/>
        <rect x="238" y="154" width="30" height="12" rx="1.5"/>
        <rect x="238" y="170" width="30" height="12" rx="1.5"/>
        <rect x="238" y="186" width="30" height="12" rx="1.5"/>
        <rect x="238" y="202" width="30" height="12" rx="1.5"/>
        <rect x="238" y="218" width="30" height="12" rx="1.5"/>
        <rect x="238" y="234" width="30" height="12" rx="1.5"/>
        <rect x="238" y="250" width="30" height="12" rx="1.5"/>
        <rect x="238" y="266" width="30" height="18" rx="1.5"/>
      </g>
      <text x="253" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#6E2707">m · d</text>
      <text x="253" y="310" text-anchor="middle" font-size="11.5" fill="#475569">Full ∇E</text>

      <!-- Optical Compression Funnel -->
      <polygon points="274,118 346,168 346,238 274,288" fill="url(#beamGrad)"/>
      <g stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrOrange)">
        <line x1="278" y1="142" x2="342" y2="184"/>
        <line x1="278" y1="203" x2="342" y2="203"/>
        <line x1="278" y1="264" x2="342" y2="222"/>
      </g>

      <!-- Compact Exact m² Directional Derivative Kernel Block -->
      <g transform="translate(348, 168)">
        <rect x="0" y="0" width="66" height="66" rx="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.6"/>
        <!-- 4x4 directional derivative structure -->
        <rect x="4" y="4" width="13" height="13" rx="2" fill="#EA580C"/>
        <rect x="19" y="4" width="13" height="13" rx="2" fill="#F97316" fill-opacity="0.55"/>
        <rect x="34" y="4" width="13" height="13" rx="2" fill="#FFEDD5"/>
        <rect x="49" y="4" width="13" height="13" rx="2" fill="#FFEDD5"/>

        <rect x="4" y="19" width="13" height="13" rx="2" fill="#F97316" fill-opacity="0.55"/>
        <rect x="19" y="19" width="13" height="13" rx="2" fill="#EA580C"/>
        <rect x="34" y="19" width="13" height="13" rx="2" fill="#F97316" fill-opacity="0.55"/>
        <rect x="49" y="19" width="13" height="13" rx="2" fill="#FFEDD5"/>

        <rect x="4" y="34" width="13" height="13" rx="2" fill="#FFEDD5"/>
        <rect x="19" y="34" width="13" height="13" rx="2" fill="#F97316" fill-opacity="0.55"/>
        <rect x="34" y="34" width="13" height="13" rx="2" fill="#EA580C"/>
        <rect x="49" y="34" width="13" height="13" rx="2" fill="#F97316" fill-opacity="0.55"/>

        <rect x="4" y="49" width="13" height="13" rx="2" fill="#FFEDD5"/>
        <rect x="19" y="49" width="13" height="13" rx="2" fill="#FFEDD5"/>
        <rect x="34" y="49" width="13" height="13" rx="2" fill="#F97316" fill-opacity="0.55"/>
        <rect x="49" y="49" width="13" height="13" rx="2" fill="#EA580C"/>
      </g>
      <text x="381" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#EA580C">m²</text>
      <text x="381" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6E2707">O(dm² + m⁶)</text>
    </g>

    <!-- Arrow into GP Surface -->
    <line x1="418" y1="201" x2="434" y2="201" stroke="#6E2707" stroke-width="2" marker-end="url(#arrDark)"/>

    <!-- RIGHT: Derivative-Conditioned GP Energy Surface -->
    <g>
      <rect x="438" y="88" width="174" height="246" rx="12" fill="#FFFFFF" fill-opacity="0.94" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="525" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0E17">GP Energy E(R)</text>

      <!-- Clean Plot Axes -->
      <line x1="454" y1="296" x2="598" y2="296" stroke="#CBD5E1" stroke-width="1.4"/>
      <line x1="454" y1="126" x2="454" y2="296" stroke="#CBD5E1" stroke-width="1.4"/>

      <!-- Posterior ±2σ Uncertainty Band Pinching at Observed (E, -F) Points -->
      <path d="M456 232 C464 218 470 215 478 216 C492 218 500 144 514 146 C526 148 532 184 540 188 C554 194 566 150 578 156 C586 160 592 178 598 188
               L598 228 C590 210 584 176 578 164 C568 178 556 226 540 194 C532 190 524 190 514 188 C500 186 492 230 478 222 C470 225 464 246 456 266 Z"
            fill="#FFEDD5" fill-opacity="0.9"/>

      <!-- GP Posterior Mean Energy Curve -->
      <path d="M456 248 C464 232 471 220 478 219 C494 217 502 164 514 166 C526 168 532 187 540 191 C556 198 567 160 578 160 C586 160 592 194 598 208"
            fill="none" stroke="#EA580C" stroke-width="2.8" stroke-linecap="round"/>

      <!-- Observed Points + Force Tangent Bars (-F) -->
      <!-- Point 1 (478, 219) -->
      <line x1="466" y1="227" x2="490" y2="211" stroke="#6E2707" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="478" cy="219" r="4.5" fill="#6E2707" stroke="#FFFFFF" stroke-width="1.6"/>
      <!-- Point 2 (540, 191) -->
      <line x1="528" y1="184" x2="552" y2="198" stroke="#6E2707" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="540" cy="191" r="4.5" fill="#6E2707" stroke="#FFFFFF" stroke-width="1.6"/>
      <!-- Point 3 (578, 160) -->
      <line x1="566" y1="166" x2="590" y2="154" stroke="#6E2707" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="578" cy="160" r="4.5" fill="#6E2707" stroke="#FFFFFF" stroke-width="1.6"/>

      <!-- Held-Out Target Prediction Ê -->
      <line x1="514" y1="166" x2="514" y2="296" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3"/>
      <polygon points="514,159 520,166 514,173 508,166" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="514" y="137" text-anchor="middle" font-size="11.5" font-weight="700" fill="#059669">Ê</text>

      <!-- Minimal Legend inside Card -->
      <line x1="464" y1="274" x2="482" y2="266" stroke="#6E2707" stroke-width="2.4" stroke-linecap="round"/>
      <text x="488" y="274" font-size="11" font-weight="600" fill="#6E2707">Tangent -F</text>
      <text x="526" y="318" text-anchor="middle" font-size="11.5" fill="#475569">Conformation R</text>
    </g>

    <!-- Footer Bar (y=378) -->
    <line x1="28" y1="357" x2="612" y2="357" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>
    <text x="28" y="378" font-size="12.5" fill="#475569">6 MD22 trajectories · m = 20 · d ≤ 1110</text>
    <text x="612" y="378" text-anchor="end" font-size="12.5" fill="#475569">Metric <tspan font-weight="700" fill="#EA580C">energy_rmse_sum ↓</tspan></text>
  </g>

  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-opacity="0.75"/>
</svg>
