<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>FedQueue — Queue-Aware Asynchronous Federated Learning</title>
  <desc>Four non-IID HPC clients experience stochastic lognormal queue delays and execute budgeted local steps against a synchronization deadline while a global server down-weights stale updates.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="decay-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0A1E5E" opacity="0.15"/>
    </pattern>
    <marker id="arrow-pri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0052FF"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="0" y="54" width="640" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#top-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="36" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">FedQueue</text>
  <text x="612" y="35" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Queue-Aware Asynchronous Federation</text>
  <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Column headers -->
  <text x="76" y="76" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Non-IID Clients</text>
  <text x="242" y="76" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Queue Wait + Budgeted Eₖ</text>
  <text x="384" y="76" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Sync T</text>

  <!-- Zone 1: Four Non-IID Client Cards with Dirichlet Class Bars -->
  <g id="client-nodes">
    <!-- C1 -->
    <rect x="32" y="94" width="88" height="40" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="42" y="118" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">C₁</text>
    <rect x="64" y="106" width="32" height="16" rx="3" fill="#0052FF"/>
    <rect x="98" y="106" width="9" height="16" rx="2" fill="#0EA5E9"/>
    <rect x="109" y="106" width="5" height="16" rx="1.5" fill="#DBEAFE"/>

    <!-- C2 -->
    <rect x="32" y="154" width="88" height="40" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="42" y="178" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">C₂</text>
    <rect x="64" y="166" width="8" height="16" rx="2" fill="#0A1E5E"/>
    <rect x="74" y="166" width="31" height="16" rx="3" fill="#0EA5E9"/>
    <rect x="107" y="166" width="7" height="16" rx="2" fill="#0052FF"/>

    <!-- C3 -->
    <rect x="32" y="214" width="88" height="40" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="42" y="238" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">C₃</text>
    <rect x="64" y="226" width="28" height="16" rx="3" fill="#0A1E5E"/>
    <rect x="94" y="226" width="12" height="16" rx="2" fill="#0052FF"/>
    <rect x="108" y="226" width="6" height="16" rx="1.5" fill="#0EA5E9"/>

    <!-- C4 -->
    <rect x="32" y="274" width="88" height="40" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="42" y="298" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#E11D48">C₄</text>
    <rect x="64" y="286" width="14" height="16" rx="2" fill="#0EA5E9"/>
    <rect x="80" y="286" width="27" height="16" rx="3" fill="#0052FF"/>
    <rect x="109" y="286" width="5" height="16" rx="1.5" fill="#0A1E5E"/>
  </g>

  <!-- Zone 2: 4-Lane Asynchronous Queue & Compute Gantt Swimlanes -->
  <g id="gantt-lanes">
    <rect x="130" y="84" width="312" height="240" rx="10" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Horizontal swimlane separators -->
    <line x1="130" y1="144" x2="442" y2="144" stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="1"/>
    <line x1="130" y1="204" x2="442" y2="204" stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="1"/>
    <line x1="130" y1="264" x2="442" y2="264" stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="1"/>

    <!-- Admission tolerance band (+0.2) -->
    <rect x="376" y="84" width="24" height="240" fill="#059669" fill-opacity="0.10"/>
    <line x1="400" y1="84" x2="400" y2="324" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3" stroke-opacity="0.7"/>
    <!-- Primary Sync Deadline Wall -->
    <line x1="376" y1="84" x2="376" y2="324" stroke="#059669" stroke-width="2.6"/>

    <!-- Lane 1 (C1: short queue, high local steps E1) -->
    <rect x="140" y="101" width="48" height="26" rx="5" fill="#DBEAFE" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="192" y="101" width="166" height="26" rx="6" fill="#0052FF"/>
    <text x="275" y="118" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">E₁ steps</text>
    <line x1="358" y1="114" x2="376" y2="114" stroke="#059669" stroke-width="2.2"/>
    <circle cx="376" cy="114" r="4.8" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>

    <!-- Lane 2 (C2: medium queue, medium local steps E2) -->
    <rect x="140" y="161" width="86" height="26" rx="5" fill="#DBEAFE" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="230" y="161" width="140" height="26" rx="6" fill="#0052FF"/>
    <text x="300" y="178" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">E₂ steps</text>
    <circle cx="376" cy="174" r="4.8" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>

    <!-- Lane 3 (C3: longer queue, smaller budget landing inside tolerance) -->
    <rect x="140" y="221" width="136" height="26" rx="5" fill="#DBEAFE" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="280" y="221" width="112" height="26" rx="6" fill="#0EA5E9"/>
    <text x="336" y="238" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">E₃ steps</text>
    <circle cx="392" cy="234" r="4.8" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>

    <!-- Lane 4 (C4: heavy lognormal queue tail -> stale straggler past deadline) -->
    <rect x="140" y="281" width="194" height="26" rx="5" fill="#DBEAFE" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="237" y="298" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0A1E5E">Lognormal queue</text>
    <rect x="338" y="281" width="96" height="26" rx="6" fill="#E11D48" fill-opacity="0.96"/>
    <text x="408" y="298" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">Stale</text>
  </g>

  <!-- Weighted Update Conduits into Global Server -->
  <path d="M 381 114 C 446 114 446 132 470 132" fill="none" stroke="#0052FF" stroke-width="2.6" marker-end="url(#arrow-pri)"/>
  <path d="M 381 174 C 444 174 446 150 470 150" fill="none" stroke="#0052FF" stroke-width="2.4" marker-end="url(#arrow-pri)"/>
  <path d="M 397 234 C 452 234 452 168 470 168" fill="none" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrow-pri)"/>
  <path d="M 434 294 C 460 294 456 184 470 184" fill="none" stroke="#E11D48" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>

  <!-- Zone 3: Global Server Aggregator + Staleness Decay Curve -->
  <g id="server-panel">
    <!-- Server Aggregator Card -->
    <rect x="476" y="84" width="134" height="122" rx="12" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
    <!-- Global CNN Hub Icon -->
    <circle cx="543" cy="128" r="24" fill="#DBEAFE" stroke="#0052FF" stroke-width="2.2"/>
    <g fill="#0052FF">
      <rect x="530" y="118" width="5" height="20" rx="2"/>
      <rect x="538" y="114" width="6" height="28" rx="2" fill="#0A1E5E"/>
      <rect x="547" y="118" width="5" height="20" rx="2" fill="#0EA5E9"/>
      <rect x="554" y="122" width="4" height="12" rx="1.5" fill="#059669"/>
    </g>
    <text x="543" y="172" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">Global CNN</text>
    <text x="543" y="191" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">EWMA + Budget</text>

    <!-- Staleness Weight Decay Plot Card -->
    <rect x="476" y="220" width="134" height="104" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <line x1="490" y1="298" x2="598" y2="298" stroke="#475569" stroke-width="1.3"/>
    <line x1="490" y1="242" x2="490" y2="298" stroke="#475569" stroke-width="1.3"/>

    <!-- Harmonic decay area + curve: (1 + tau)^(-beta) -->
    <path d="M 490 246 C 514 268 548 282 596 290 L 596 298 L 490 298 Z" fill="url(#decay-fill)"/>
    <path d="M 490 246 C 514 268 548 282 596 290" fill="none" stroke="#0052FF" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Fresh vs Stale points -->
    <circle cx="497" cy="252" r="4.5" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="574" cy="286" r="4.5" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.5"/>

    <text x="596" y="238" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0A1E5E">Weight w(τ)</text>
    <text x="544" y="315" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">Staleness τ</text>
  </g>

  <!-- Bottom Legend Strip -->
  <rect x="132" y="335" width="12" height="9" rx="2" fill="#DBEAFE" stroke="#0EA5E9" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="150" y="344" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Queue wait</text>
  <rect x="236" y="335" width="12" height="9" rx="2" fill="#0052FF"/>
  <text x="254" y="344" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Local work Eₖ</text>
  <rect x="352" y="335" width="12" height="9" rx="2" fill="#E11D48"/>
  <text x="370" y="344" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Delayed stale</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">4 HPC clients · Dirichlet α=0.1 · 50 rounds</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5"><tspan fill="#475569">Target: </tspan><tspan font-weight="700" fill="#0052FF">accuracy ↑</tspan></text>
</svg>
