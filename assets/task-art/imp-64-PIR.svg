<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>PIR: Instance-Aware Post-Hoc Forecast Revision</title>
  <desc>An uncertainty gate balances local cross-channel attention and top-K cosine-retrieved training windows to add post-hoc revision vectors that correct a frozen PatchTST forecast trajectory.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="60%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#475569" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrowBlueSm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0052FF"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="0" y="52" width="640" height="306" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#topBar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17">PIR</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Instance-Aware Post-Hoc Revision</text>
  </g>
  <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Top-Left Card: Frozen PatchTST & Uncertainty Gate -->
  <rect x="28" y="72" width="194" height="114" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <!-- Minimal Vector Lock Icon -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M 43 90 V 86 A 4 4 0 0 1 51 86 V 90"/>
    <rect x="41" y="90" width="12" height="9" rx="2" fill="#DBEAFE"/>
  </g>
  <text x="60" y="96" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">Frozen PatchTST</text>

  <!-- Mini Backbone Forecast Preview -->
  <rect x="40" y="106" width="170" height="34" rx="6" fill="#F7FAFF" stroke="#CBD5E1" stroke-width="0.9"/>
  <line x1="112" y1="108" x2="112" y2="138" stroke="#CBD5E1" stroke-dasharray="3 2" stroke-width="1"/>
  <path d="M 48 126 C 64 114, 80 132, 96 122 L 112 120" fill="none" stroke="#0A1E5E" stroke-width="2" stroke-linecap="round"/>
  <path d="M 112 120 C 132 132, 158 134, 200 114" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Uncertainty Gate Bar -->
  <rect x="42" y="150" width="166" height="8" rx="4" fill="url(#gateGrad)"/>
  <circle cx="152" cy="154" r="5.5" fill="#FFFFFF" stroke="#0A1E5E" stroke-width="2"/>
  <text x="125" y="176" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Uncertainty (α, β)</text>

  <!-- Bottom-Left Card: Training History Retrieval Bank -->
  <rect x="28" y="200" width="194" height="142" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity="0.6" stroke-width="1.4"/>
  <text x="42" y="221" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">Train Bank (Top-K)</text>

  <!-- Retrieved Window 1 -->
  <rect x="40" y="232" width="170" height="28" rx="7" fill="#DBEAFE" fill-opacity="0.7" stroke="#0052FF" stroke-width="1.5"/>
  <path d="M 50 250 C 68 238, 86 254, 108 242 C 124 236, 138 248, 156 240" fill="none" stroke="#0052FF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="202" y="250" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">0.94</text>

  <!-- Retrieved Window 2 -->
  <rect x="40" y="268" width="170" height="28" rx="7" fill="#DBEAFE" fill-opacity="0.4" stroke="#0EA5E9" stroke-width="1.3"/>
  <path d="M 50 286 C 70 274, 88 290, 110 278 C 126 272, 140 286, 156 276" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  <text x="202" y="286" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0EA5E9">0.88</text>

  <!-- Retrieved Window 3 -->
  <rect x="40" y="304" width="170" height="26" rx="7" fill="#F7FAFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <path d="M 50 321 C 70 310, 90 324, 112 314 C 128 310, 142 320, 156 314" fill="none" stroke="#475569" stroke-width="1.7" stroke-opacity="0.65" stroke-linecap="round"/>
  <text x="202" y="321" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">0.71</text>

  <!-- Center Revision Operators -->
  <line x1="222" y1="138" x2="238" y2="138" stroke="#0052FF" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="242" y="110" width="80" height="56" rx="10" fill="#DBEAFE" stroke="#0052FF" stroke-width="1.8"/>
  <text x="282" y="132" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#0A1E5E">α·y<tspan dy="2.5" font-size="11.5">loc</tspan></text>
  <text x="282" y="156" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0052FF">Ch. Attn</text>

  <line x1="222" y1="270" x2="238" y2="270" stroke="#0EA5E9" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <rect x="242" y="242" width="80" height="56" rx="10" fill="#0EA5E9" fill-opacity="0.14" stroke="#0EA5E9" stroke-width="1.8"/>
  <text x="282" y="264" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#0A1E5E">β·y<tspan dy="2.5" font-size="11.5">glob</tspan></text>
  <text x="282" y="288" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0EA5E9">Cos Sim</text>

  <!-- Arrows Merging into Hero Trajectory Plot -->
  <path d="M 322 138 C 334 138, 332 182, 342 182" fill="none" stroke="#0052FF" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <path d="M 322 270 C 334 270, 332 224, 342 224" fill="none" stroke="#0EA5E9" stroke-width="2.2" marker-end="url(#arrowCyan)"/>

  <!-- Right Hero Plot: Before / After Trajectory Revision -->
  <rect x="346" y="72" width="266" height="270" rx="12" fill="#FFFFFF" stroke="#0052FF" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Formula Banner inside Hero Plot -->
  <rect x="360" y="82" width="238" height="28" rx="8" fill="#F7FAFF" stroke="#DBEAFE" stroke-width="1.2"/>
  <text x="479" y="99" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0A1E5E">y = ȳ + α·y<tspan dy="2.5" font-size="11.5">loc</tspan><tspan dy="-2.5"> + β·y</tspan><tspan dy="2.5" font-size="11.5">glob</tspan></text>

  <!-- Plot Area Background (Forecast Zone Highlight) -->
  <rect x="424" y="122" width="174" height="178" rx="4" fill="#F7FAFF" fill-opacity="0.8"/>
  <line x1="424" y1="122" x2="424" y2="300" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3" stroke-opacity="0.65"/>
  <line x1="360" y1="300" x2="598" y2="300" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="392" y="138" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">History</text>
  <text x="512" y="138" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0052FF">Post-Hoc Horizon</text>

  <!-- Observed History Curve -->
  <path d="M 362 232 C 378 206, 392 246, 408 214 L 424 220" fill="none" stroke="#0A1E5E" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Translucent Revision Band between Initial y_bar and Revised y -->
  <path d="M 424 220 C 454 252, 484 274, 520 264 C 554 254, 576 236, 594 244 L 594 176 C 570 166, 548 206, 518 192 C 484 176, 456 206, 424 220 Z" fill="#0052FF" fill-opacity="0.1"/>

  <!-- Drifted Frozen Backbone Forecast y_bar -->
  <path d="M 424 220 C 454 252, 484 274, 520 264 C 554 254, 576 236, 594 244" fill="none" stroke="#E11D48" stroke-width="2.4" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- Vertical Blue Correction Vectors lifting y_bar -> y -->
  <g stroke="#0052FF" stroke-width="2" marker-end="url(#arrowBlueSm)">
    <line x1="462" y1="252" x2="462" y2="206"/>
    <line x1="500" y1="266" x2="500" y2="195"/>
    <line x1="540" y1="255" x2="540" y2="199"/>
    <line x1="578" y1="241" x2="578" y2="181"/>
  </g>

  <!-- Revised Accurate Trajectory y -->
  <path d="M 424 220 C 456 206, 484 176, 518 192 C 548 206, 570 166, 594 176" fill="none" stroke="#059669" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="594" cy="176" r="4.5" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Bottom Legend inside Plot -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">
    <line x1="362" y1="322" x2="380" y2="322" stroke="#E11D48" stroke-width="2.4" stroke-dasharray="4 3"/>
    <text x="386" y="326">Initial ȳ</text>

    <line x1="448" y1="327" x2="448" y2="316" stroke="#0052FF" stroke-width="2" marker-end="url(#arrowBlueSm)"/>
    <text x="458" y="326">Revise</text>

    <line x1="514" y1="322" x2="532" y2="322" stroke="#059669" stroke-width="3"/>
    <text x="538" y="326" font-weight="700" fill="#059669">Revised y</text>
  </g>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
    <text x="28" y="379" fill="#475569">ETTh1 · Frozen PatchTST · 4 Horizons</text>
    <text x="612" y="379" text-anchor="end" fill="#475569">Metric: <tspan font-weight="700" fill="#0052FF">Mean MSE ↓</tspan></text>
  </g>
</svg>
