<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>SVGD-EM: Momentum Particle Maximum Marginal Likelihood Estimation</title>
  <desc>Ten interacting particles glide with momentum across a non-convex Bayesian neural network posterior coupled with hyperparameter M-steps to accelerate MNIST 4 versus 9 test error descent.</desc>
  <defs>
    <clipPath id="plateClip">
      <rect x="0" y="0" width="640" height="400" rx="14"/>
    </clipPath>
    <clipPath id="landscapeClip">
      <rect x="46" y="102" width="306" height="212" rx="7"/>
    </clipPath>
    <linearGradient id="plateBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#F7F6FF"/>
      <stop offset="55%" stop-color="#F7F6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#261E6B"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="speedupGap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="coordDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#4F46E5" opacity="0.15"/>
    </pattern>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.8" markerHeight="5.8" orient="auto-start-reverse">
      <path d="M0 1.2 L8.8 5 L0 8.8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1.4 L8.6 5 L0 8.6 Z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
    <rect x="0" y="0" width="640" height="400" fill="url(#plateBg)"/>
    <rect x="20" y="58" width="600" height="296" fill="url(#coordDots)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#topAccent)"/>

    <!-- Header -->
    <text x="28" y="38" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">SVGD-EM</text>
    <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Momentum Particle Marginal Likelihood</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>

    <!-- Left-Center Hero: Non-Convex Posterior Landscape with Momentum-SVGD Particle Cloud -->
    <g>
      <rect x="34" y="70" width="330" height="270" rx="11" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="48" y="91" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Momentum SVGD Cloud</text>
      <text x="350" y="91" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">N = 10 Particles</text>

      <!-- Non-convex landscape viewport -->
      <rect x="46" y="102" width="306" height="212" rx="7" fill="#F7F6FF" stroke="#CBD5E1" stroke-width="1.2"/>

      <g clip-path="url(#landscapeClip)">
        <!-- Broad outer bimodal contour envelope -->
        <path d="M62 204 C62 146, 118 118, 174 134 C202 142, 224 148, 258 140 C306 130, 344 166, 338 220 C332 276, 286 302, 234 290 C206 284, 184 274, 152 282 C100 294, 62 256, 62 204 Z" fill="#E0E7FF" fill-opacity="0.65" stroke="#8B5CF6" stroke-width="1.3" stroke-opacity="0.45"/>

        <!-- Left posterior mode contours centered (136, 198) -->
        <g transform="translate(136, 198) rotate(-22)">
          <ellipse cx="0" cy="0" rx="64" ry="46" fill="#4F46E5" fill-opacity="0.09" stroke="#4F46E5" stroke-width="1.4" stroke-opacity="0.45"/>
          <ellipse cx="0" cy="0" rx="44" ry="30" fill="#4F46E5" fill-opacity="0.13" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.55"/>
          <ellipse cx="0" cy="0" rx="23" ry="15" fill="#4F46E5" fill-opacity="0.20" stroke="#261E6B" stroke-width="1.4" stroke-opacity="0.6"/>
        </g>

        <!-- Right posterior mode contours centered (266, 222) -->
        <g transform="translate(266, 222) rotate(18)">
          <ellipse cx="0" cy="0" rx="60" ry="44" fill="#8B5CF6" fill-opacity="0.10" stroke="#8B5CF6" stroke-width="1.4" stroke-opacity="0.45"/>
          <ellipse cx="0" cy="0" rx="40" ry="28" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.55"/>
          <ellipse cx="0" cy="0" rx="20" ry="14" fill="#4F46E5" fill-opacity="0.20" stroke="#261E6B" stroke-width="1.4" stroke-opacity="0.6"/>
        </g>

        <!-- Repulsive SVGD kernel interaction links between nearby particles -->
        <g stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="3 2.5" stroke-opacity="0.8">
          <line x1="116" y1="188" x2="136" y2="174"/>
          <line x1="136" y1="174" x2="158" y2="194"/>
          <line x1="116" y1="188" x2="138" y2="218"/>
          <line x1="158" y1="194" x2="138" y2="218"/>
          <line x1="246" y1="212" x2="266" y2="198"/>
          <line x1="266" y1="198" x2="290" y2="218"/>
          <line x1="246" y1="212" x2="270" y2="244"/>
          <line x1="290" y1="218" x2="270" y2="244"/>
        </g>

        <!-- Curved momentum trajectories sweeping into modes -->
        <g fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round">
          <!-- Left mode 5 particle momentum trails -->
          <path d="M62 148 C76 165, 94 176, 111 185" marker-end="url(#arrowIndigo)"/>
          <path d="M164 126 C154 142, 145 155, 139 168" marker-end="url(#arrowIndigo)"/>
          <path d="M202 150 C184 158, 170 174, 161 189" marker-end="url(#arrowIndigo)"/>
          <path d="M84 268 C100 250, 118 236, 133 222" marker-end="url(#arrowIndigo)"/>
          <path d="M68 228 C82 224, 96 220, 111 214" marker-end="url(#arrowIndigo)"/>
          <!-- Right mode 5 particle momentum trails -->
          <path d="M222 146 C228 172, 236 192, 243 206" marker-end="url(#arrowIndigo)"/>
          <path d="M294 134 C284 154, 276 174, 269 192" marker-end="url(#arrowIndigo)"/>
          <path d="M338 182 C322 192, 308 204, 295 214" marker-end="url(#arrowIndigo)"/>
          <path d="M326 286 C306 276, 288 262, 274 249" marker-end="url(#arrowIndigo)"/>
          <path d="M214 282 C228 268, 240 254, 251 241" marker-end="url(#arrowIndigo)"/>
        </g>

        <!-- 10 Particle Cloud Dots -->
        <g stroke="#FFFFFF" stroke-width="1.6">
          <!-- Left mode particles -->
          <circle cx="116" cy="188" r="5.4" fill="#4F46E5"/>
          <circle cx="136" cy="174" r="5.4" fill="#261E6B"/>
          <circle cx="158" cy="194" r="5.4" fill="#4F46E5"/>
          <circle cx="138" cy="218" r="5.4" fill="#261E6B"/>
          <circle cx="116" cy="212" r="5.2" fill="#8B5CF6"/>
          <!-- Right mode particles -->
          <circle cx="246" cy="212" r="5.4" fill="#4F46E5"/>
          <circle cx="266" cy="198" r="5.4" fill="#261E6B"/>
          <circle cx="290" cy="218" r="5.4" fill="#4F46E5"/>
          <circle cx="270" cy="244" r="5.4" fill="#261E6B"/>
          <circle cx="254" cy="236" r="5.2" fill="#8B5CF6"/>
        </g>

        <!-- Clean in-panel callouts in open corners -->
        <text x="56" y="121" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#8B5CF6">Kernel k(x, x')</text>
        <text x="56" y="303" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#261E6B">Momentum Flow</text>
      </g>

      <text x="199" y="331" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">BNN Posterior · v · tanh(w · z)</text>
    </g>

    <!-- Right Column: E/M Cycle + Test Error Convergence -->
    <g>
      <!-- Top Card: Coupled E-step / M-step Loop -->
      <rect x="380" y="70" width="232" height="108" rx="11" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>

      <!-- E-step node -->
      <rect x="394" y="102" width="82" height="44" rx="9" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.8"/>
      <text x="435" y="120" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">E-step</text>
      <text x="435" y="136" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#4F46E5">Cloud (w, v)</text>

      <!-- M-step node -->
      <rect x="516" y="102" width="82" height="44" rx="9" fill="#F7F6FF" stroke="#8B5CF6" stroke-width="1.8"/>
      <text x="557" y="120" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">M-step</text>
      <text x="557" y="136" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">θ = (α, β)</text>

      <!-- Top & Bottom Loop Arrows -->
      <path d="M454 98 C478 78, 514 78, 538 97" fill="none" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrowIndigo)"/>
      <path d="M538 150 C514 170, 478 170, 454 151" fill="none" stroke="#8B5CF6" stroke-width="2.2" marker-end="url(#arrowViolet)"/>

      <!-- Bottom Card: Accelerated Test Error Descent -->
      <rect x="380" y="188" width="232" height="152" rx="11" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="496" y="208" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A0E17">MNIST 4 vs 9 Test Error</text>

      <!-- Axes -->
      <path d="M412 220 V308 H598" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="412" y1="264" x2="598" y2="264" stroke="#CBD5E1" stroke-width="0.9" stroke-dasharray="3 3" stroke-opacity="0.7"/>

      <!-- Shaded speedup gap between SVGD-EM and M-SVGD-EM -->
      <path d="M414 226 C446 240, 490 256, 540 263 C564 266, 582 267, 594 268 L594 298 C572 298, 542 297, 506 293 C466 286, 434 264, 414 226 Z" fill="url(#speedupGap)"/>

      <!-- Baseline SVGD-EM curve (dashed slate) -->
      <path d="M414 226 C446 240, 490 256, 540 263 C564 266, 582 267, 594 268" fill="none" stroke="#475569" stroke-width="2.1" stroke-dasharray="5 3.5" stroke-linecap="round"/>

      <!-- Accelerated M-SVGD-EM curve (bold indigo) -->
      <path d="M414 226 C434 264, 466 286, 506 293 C542 297, 572 298, 594 298" fill="none" stroke="#4F46E5" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="594" cy="298" r="4" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.4"/>

      <!-- Curve labels cleanly separated -->
      <text x="594" y="255" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">SVGD-EM</text>
      <text x="594" y="289" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">M-SVGD-EM</text>

      <!-- X ticks -->
      <text x="414" y="325" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">0</text>
      <text x="596" y="325" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">500 iter</text>
    </g>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
    <text x="28" y="381" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#4F46E5">test_error ↓</tspan></text>
    <text x="612" y="381" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">10-Particle BNN · Fixed Oracle Budget</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>
</svg>
