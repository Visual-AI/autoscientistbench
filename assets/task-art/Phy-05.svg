<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>AlphaEPO — Dual-Layer q-Voter Opinion Dynamics</title>
  <desc>Watts-Strogatz small-world voter ring with private core and expressed shell opinions beside the stationary expressed-opinion concentration curve comparing analytic ODE closure with Monte Carlo means.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ode-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="640" height="400" rx="14"/>
    </clipPath>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6E3A05" fill-opacity="0.16"/>
    </pattern>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base canvas & grid -->
    <rect x="0" y="0" width="640" height="400" fill="url(#card-bg)"/>
    <rect x="16" y="54" width="608" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#accent-bar)"/>

    <!-- Header (y=18..54) -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.3">AlphaEPO</text>
    <text x="612" y="36" font-size="12.5" font-weight="500" fill="#475569" text-anchor="end">Dual-Layer q-Voter Opinion Dynamics</text>
    <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>

    <!-- LEFT PANEL: Watts-Strogatz Dual-Layer Ring -->
    <text x="164" y="80" font-size="12.5" font-weight="600" fill="#6E3A05" text-anchor="middle">q = 3 Panel Influence</text>

    <!-- Small-world ring lattice & rewired shortcuts -->
    <g fill="none">
      <!-- Ring polygon (nearest neighbors) -->
      <polygon points="164,106 210,118.3 243.7,152 256,198 243.7,244 210,277.7 164,290 118,277.7 84.3,244 72,198 84.3,152 118,118.3" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Next-nearest ring chords -->
      <path d="M 164 106 L 243.7 152 M 210 118.3 L 256 198 M 243.7 152 L 243.7 244 M 256 198 L 210 277.7 M 243.7 244 L 164 290 M 210 277.7 L 118 277.7 M 164 290 L 84.3 244 M 118 277.7 L 72 198 M 84.3 244 L 84.3 152 M 72 198 L 118 118.3 M 84.3 152 L 164 106 M 118 118.3 L 210 118.3" stroke="#CBD5E1" stroke-width="1.1" stroke-opacity="0.7"/>
      <!-- Watts-Strogatz long-range shortcuts -->
      <path d="M 118 118.3 Q 178 164 243.7 244" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="4 3"/>
      <path d="M 210 118.3 Q 158 176 84.3 244" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="4 3"/>
      <path d="M 72 198 Q 164 146 256 198" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.38" stroke-dasharray="4 3"/>
    </g>

    <!-- 3 Unanimous panel influence arrows to focal voter -->
    <g fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow-amber)">
      <path d="M 97 159 Q 118 171 136 182"/>
      <path d="M 231 159 Q 210 171 192 182"/>
      <path d="M 164 274 L 164 231"/>
    </g>

    <!-- 9 Non-panel dual-layer voters (outer = expressed, inner = private) -->
    <g>
      <circle cx="164" cy="106" r="10.5" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
      <circle cx="164" cy="106" r="4.5" fill="#059669"/>

      <circle cx="210" cy="118.3" r="10.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
      <circle cx="210" cy="118.3" r="4.5" fill="#D97706"/>

      <circle cx="256" cy="198" r="10.5" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
      <circle cx="256" cy="198" r="4.5" fill="#059669"/>

      <circle cx="243.7" cy="244" r="10.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
      <circle cx="243.7" cy="244" r="4.5" fill="#059669"/>

      <circle cx="210" cy="277.7" r="10.5" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
      <circle cx="210" cy="277.7" r="4.5" fill="#E11D48"/>

      <circle cx="118" cy="277.7" r="10.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
      <circle cx="118" cy="277.7" r="4.5" fill="#059669"/>

      <circle cx="84.3" cy="244" r="10.5" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
      <circle cx="84.3" cy="244" r="4.5" fill="#E11D48"/>

      <circle cx="72" cy="198" r="10.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
      <circle cx="72" cy="198" r="4.5" fill="#059669"/>

      <circle cx="118" cy="118.3" r="10.5" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
      <circle cx="118" cy="118.3" r="4.5" fill="#D97706"/>
    </g>

    <!-- 3 Highlighted q-panel neighbors -->
    <g>
      <circle cx="84.3" cy="152" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2.6"/>
      <circle cx="84.3" cy="152" r="5.5" fill="#D97706"/>

      <circle cx="243.7" cy="152" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2.6"/>
      <circle cx="243.7" cy="152" r="5.5" fill="#D97706"/>

      <circle cx="164" cy="290" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2.6"/>
      <circle cx="164" cy="290" r="5.5" fill="#D97706"/>
    </g>

    <!-- Focal central dual-layer voter (private core vs expressed outer shell) -->
    <circle cx="164" cy="198" r="28" fill="#FEF3C7" fill-opacity="0.78"/>
    <circle cx="164" cy="198" r="22" fill="#FFFFFF" stroke="#0A0E17" stroke-width="3"/>
    <circle cx="164" cy="198" r="17" fill="none" stroke="#D97706" stroke-width="2.2" stroke-dasharray="5 3"/>
    <circle cx="164" cy="198" r="9.5" fill="#059669"/>

    <!-- Compact dual-layer key below ring -->
    <circle cx="62" cy="332" r="7.5" fill="#FFFFFF" stroke="#0A0E17" stroke-width="2"/>
    <circle cx="62" cy="332" r="3.4" fill="#059669"/>
    <text x="76" y="336" font-size="11.5" fill="#475569">Core: private (α) · Ring: expressed</text>

    <!-- Vertical section divider -->
    <line x1="312" y1="70" x2="312" y2="346" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 5"/>

    <!-- RIGHT PANEL: Stationary Concentration c_S(p) vs p -->
    <!-- Axes -->
    <line x1="360" y1="96" x2="360" y2="296" stroke="#475569" stroke-width="1.8"/>
    <line x1="360" y1="296" x2="598" y2="296" stroke="#475569" stroke-width="1.8"/>
    <!-- Equilibrium 0.5 dashed guide -->
    <line x1="360" y1="261" x2="596" y2="261" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4 4"/>
    <!-- Subtle top 1.0 tick -->
    <line x1="356" y1="108" x2="360" y2="108" stroke="#475569" stroke-width="1.5"/>
    <line x1="356" y1="261" x2="360" y2="261" stroke="#475569" stroke-width="1.5"/>
    <!-- X ticks -->
    <line x1="368" y1="296" x2="368" y2="301" stroke="#475569" stroke-width="1.5"/>
    <line x1="480" y1="296" x2="480" y2="301" stroke="#475569" stroke-width="1.5"/>
    <line x1="592" y1="296" x2="592" y2="301" stroke="#475569" stroke-width="1.5"/>

    <!-- Area wash under ODE curve down to c_S = 0.5 -->
    <path d="M 368 108 C 415 110 442 126 466 168 C 488 208 506 254 540 260 L 592 261 L 368 261 Z" fill="url(#ode-fill)"/>

    <!-- Crimson vertical MAE discrepancy segments between ODE and MC -->
    <g stroke="#E11D48" stroke-width="2.2" stroke-linecap="round">
      <line x1="440" y1="135" x2="440" y2="159"/>
      <line x1="464" y1="165" x2="464" y2="200"/>
      <line x1="488" y1="208" x2="488" y2="237"/>
      <line x1="512" y1="242" x2="512" y2="256"/>
    </g>

    <!-- Smooth deterministic ODE Pair Approximation curve -->
    <path d="M 368 108 C 415 110 442 126 466 168 C 488 208 506 254 540 260 L 592 261" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round"/>

    <!-- WS Monte Carlo ensemble curve & markers -->
    <polyline points="368,109 392,114 416,129 440,159 464,200 488,237 512,256 540,260 566,261 592,261" fill="none" stroke="#6E3A05" stroke-width="1.8" stroke-opacity="0.65" stroke-linejoin="round"/>
    <g fill="#FFFFFF" stroke="#0A0E17" stroke-width="2">
      <circle cx="368" cy="109" r="3.6"/>
      <circle cx="392" cy="114" r="3.6"/>
      <circle cx="416" cy="129" r="3.6"/>
      <circle cx="440" cy="159" r="3.6"/>
      <circle cx="464" cy="200" r="3.6"/>
      <circle cx="488" cy="237" r="3.6"/>
      <circle cx="512" cy="256" r="3.6"/>
      <circle cx="540" cy="260" r="3.6"/>
      <circle cx="566" cy="261" r="3.6"/>
      <circle cx="592" cy="261" r="3.6"/>
    </g>

    <!-- MAE residual callout cleanly positioned in open space left of transition -->
    <line x1="424" y1="207" x2="458" y2="185" stroke="#E11D48" stroke-width="1.5"/>
    <text x="418" y="218" font-size="11.5" font-weight="700" fill="#E11D48" text-anchor="end">MAE gap</text>

    <!-- Plot Legend (top-right open air) -->
    <line x1="480" y1="98" x2="502" y2="98" stroke="#D97706" stroke-width="3.2" stroke-linecap="round"/>
    <text x="509" y="102" font-size="11.5" font-weight="600" fill="#0A0E17">ODE closure</text>
    <line x1="480" y1="118" x2="502" y2="118" stroke="#6E3A05" stroke-width="1.8"/>
    <circle cx="491" cy="118" r="3.4" fill="#FFFFFF" stroke="#0A0E17" stroke-width="1.8"/>
    <text x="509" y="122" font-size="11.5" font-weight="500" fill="#475569">WS Monte Carlo</text>

    <!-- Axis Labels -->
    <text x="360" y="84" font-size="13.5" font-weight="600" fill="#0A0E17" text-anchor="middle">c<tspan font-size="11.5" dy="3">S</tspan><tspan font-size="13.5" dy="-3">(p)</tspan></text>
    <text x="350" y="112" font-size="11.5" fill="#475569" text-anchor="end">1.0</text>
    <text x="350" y="265" font-size="11.5" fill="#475569" text-anchor="end">0.5</text>
    <text x="368" y="315" font-size="11.5" fill="#475569" text-anchor="middle">0</text>
    <text x="480" y="315" font-size="11.5" fill="#475569" text-anchor="middle">0.25</text>
    <text x="592" y="315" font-size="11.5" fill="#475569" text-anchor="middle">0.5</text>
    <text x="480" y="336" font-size="12" font-weight="600" fill="#0A0E17" text-anchor="middle">Independence p</text>

    <!-- Footer (y=378) -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
    <text x="28" y="378" font-size="12.5" fill="#475569">Watts-Strogatz · α = 0.1 · q = 3</text>
    <text x="612" y="378" font-size="12.5" fill="#475569" text-anchor="end">Metric: <tspan font-weight="700" fill="#D97706">mae ↓</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>
</svg>
