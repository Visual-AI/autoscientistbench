<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>RobustDueling — Linear Dueling Bandits With Delays &amp; Corruptions</title>
  <desc>Pre- and post-serving sinusoidal contexts select a pair of UCB arms whose Bradley-Terry preference passes through unknown Gaussian delays and immediate adversarial flips before updating a robust confidence ellipsoid.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0A1E5E" opacity="0.15"/>
    </pattern>
    <marker id="arrow-pri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0052FF"/>
    </marker>
    <marker id="arrow-sec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrow-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="0" y="54" width="640" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#top-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="36" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">RobustDueling</text>
  <text x="612" y="35" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Delayed &amp; Corrupted Dueling Bandits</text>
  <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Card 1 (Top-Left): Contextual Arm UCB Arena -->
  <g id="arm-arena">
    <rect x="32" y="72" width="184" height="122" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <!-- Pre -> Post context header pill -->
    <rect x="44" y="81" width="160" height="22" rx="6" fill="#DBEAFE" fill-opacity="0.55"/>
    <text x="124" y="96" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0A1E5E">y = [cos x, sin x]</text>

    <!-- K=10 Arms UCB bars -->
    <line x1="44" y1="173" x2="204" y2="173" stroke="#CBD5E1" stroke-width="1.2"/>
    <!-- Non-selected background arms -->
    <g fill="#DBEAFE" stroke="#0EA5E9" stroke-width="1">
      <rect x="48" y="148" width="11" height="25" rx="2.5"/>
      <rect x="64" y="142" width="11" height="31" rx="2.5"/>
      <rect x="96" y="151" width="11" height="22" rx="2.5"/>
      <rect x="112" y="140" width="11" height="33" rx="2.5"/>
      <rect x="128" y="146" width="11" height="27" rx="2.5"/>
      <rect x="160" y="153" width="11" height="20" rx="2.5"/>
      <rect x="176" y="144" width="11" height="29" rx="2.5"/>
      <rect x="192" y="155" width="11" height="18" rx="2.5"/>
    </g>
    <!-- Selected Dueling Arm a -->
    <rect x="80" y="124" width="12" height="49" rx="3" fill="#0052FF"/>
    <line x1="86" y1="115" x2="86" y2="124" stroke="#0A1E5E" stroke-width="1.8"/>
    <line x1="82" y1="115" x2="90" y2="115" stroke="#0A1E5E" stroke-width="1.8"/>
    <!-- Selected Dueling Arm b -->
    <rect x="144" y="129" width="12" height="44" rx="3" fill="#059669"/>
    <line x1="150" y1="119" x2="150" y2="129" stroke="#059669" stroke-width="1.8"/>
    <line x1="146" y1="119" x2="154" y2="119" stroke="#059669" stroke-width="1.8"/>

    <!-- Duel bracket connecting Arm a vs Arm b -->
    <path d="M 86 112 V 107 H 150 V 116" fill="none" stroke="#0A1E5E" stroke-width="1.5"/>
    <text x="118" y="123" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0A1E5E">a vs b</text>
    <text x="124" y="188" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">K = 10 Arms UCB</text>
  </g>

  <!-- Arrow: Arm Arena -> Sigmoid Duel -->
  <line x1="216" y1="133" x2="233" y2="133" stroke="#0052FF" stroke-width="2.2" marker-end="url(#arrow-pri)"/>

  <!-- Card 2 (Top-Center): Bradley-Terry Sigmoid & Adversarial Flip -->
  <g id="duel-sigmoid">
    <rect x="237" y="72" width="192" height="122" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Sigmoid axes -->
    <line x1="252" y1="169" x2="414" y2="169" stroke="#CBD5E1" stroke-width="1.2"/>
    <line x1="252" y1="98" x2="414" y2="98" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="333" y1="94" x2="333" y2="173" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Sigmoid curve sigma(u_a - u_b) -->
    <path d="M 254 167 C 296 167 314 150 333 133 C 352 116 370 100 412 100" fill="none" stroke="#0052FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Clean outcome + Adversarial Corruption Flip -->
    <circle cx="394" cy="101" r="5" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>
    <line x1="394" y1="108" x2="394" y2="158" stroke="#E11D48" stroke-width="2.4" stroke-dasharray="4 2" marker-end="url(#arrow-red)"/>
    <circle cx="394" cy="167" r="5" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.6"/>

    <text x="250" y="91" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">σ(u(a) − u(b))</text>
    <text x="386" y="156" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">Flip C=25</text>
    <text x="333" y="188" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Corrupted Duel</text>
  </g>

  <!-- Card 3 (Top-Right): Robust Confidence Ellipsoid -->
  <g id="robust-estimator">
    <rect x="449" y="72" width="161" height="122" rx="11" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.8"/>
    <text x="529" y="91" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">Robust (θ̂, ζ̂)</text>

    <!-- Crosshair -->
    <line x1="468" y1="138" x2="590" y2="138" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="529" y1="102" x2="529" y2="174" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Wide corrupted outer ellipsoid vs tight robust inner ellipsoid -->
    <g transform="translate(529 138) rotate(-18)">
      <ellipse cx="0" cy="0" rx="50" ry="27" fill="#E11D48" fill-opacity="0.06" stroke="#E11D48" stroke-width="1.6" stroke-dasharray="4 3"/>
      <ellipse cx="0" cy="0" rx="28" ry="15" fill="#DBEAFE" fill-opacity="0.72" stroke="#0052FF" stroke-width="2.4"/>
    </g>
    <!-- True (theta*, zeta*) parameter -->
    <circle cx="534" cy="136" r="4.8" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>
    <text x="529" y="186" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Confidence Set</text>
  </g>

  <!-- Vertical Causal Flow Connectors between Top Cards & Bottom Delayed Channel -->
  <line x1="333" y1="194" x2="333" y2="211" stroke="#0052FF" stroke-width="2.2" marker-end="url(#arrow-pri)"/>
  <line x1="556" y1="296" x2="556" y2="198" stroke="#059669" stroke-width="2.4" marker-end="url(#arrow-grn)"/>

  <!-- Zone 2 (Bottom Full Width): Delayed & Corrupted Feedback Channel -->
  <g id="delay-channel">
    <rect x="32" y="214" width="578" height="114" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Top clear header strip inside channel -->
    <text x="48" y="234" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">Unknown Delay  τ ~ N(100, 100²)</text>
    <text x="534" y="234" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">Corruptions: τ = 0</text>

    <!-- Causal round timeline -->
    <line x1="54" y1="298" x2="588" y2="298" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Sweeping clean Gaussian delay arcs (all peaks <= y=250, well below y=234 labels) -->
    <path d="M 84 294 Q 194 210 304 294" fill="none" stroke="#0052FF" stroke-width="2.6" marker-end="url(#arrow-pri)"/>
    <path d="M 164 294 Q 290 202 416 294" fill="none" stroke="#0EA5E9" stroke-width="2.6" marker-end="url(#arrow-sec)"/>
    <path d="M 244 294 Q 388 216 532 294" fill="none" stroke="#0052FF" stroke-width="2.6" marker-end="url(#arrow-pri)"/>

    <!-- Immediate adversarial corruption drops (tau = 0) -->
    <line x1="126" y1="258" x2="126" y2="290" stroke="#E11D48" stroke-width="2.4" marker-end="url(#arrow-red)"/>
    <line x1="358" y1="258" x2="358" y2="290" stroke="#E11D48" stroke-width="2.4" marker-end="url(#arrow-red)"/>

    <!-- Timeline round nodes -->
    <g stroke="#FFFFFF" stroke-width="1.6">
      <circle cx="84" cy="298" r="4.8" fill="#0052FF"/>
      <circle cx="126" cy="298" r="5" fill="#E11D48"/>
      <circle cx="164" cy="298" r="4.8" fill="#0EA5E9"/>
      <circle cx="244" cy="298" r="4.8" fill="#0052FF"/>
      <circle cx="304" cy="298" r="5" fill="#059669"/>
      <circle cx="358" cy="298" r="5" fill="#E11D48"/>
      <circle cx="416" cy="298" r="5" fill="#059669"/>
      <circle cx="532" cy="298" r="5" fill="#059669"/>
      <circle cx="556" cy="298" r="4.8" fill="#059669"/>
    </g>

    <!-- Round tick labels -->
    <g text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">
      <text x="84" y="318">t</text>
      <text x="164" y="318">t+1</text>
      <text x="304" y="318">t+τ₁</text>
      <text x="416" y="318">t+τ₂</text>
      <text x="532" y="318">t+τ₃</text>
    </g>
    <text x="566" y="256" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Due</text>
  </g>

  <!-- Channel bottom protocol subtitle -->
  <text x="320" y="347" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Causal Order: get_context → serve(a,b) → advance()</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">T=2000 rounds · d=10, e=20 · C=25 flips</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5"><tspan fill="#475569">Target: </tspan><tspan font-weight="700" fill="#0052FF">cumulative_regret ↓</tspan></text>
</svg>
