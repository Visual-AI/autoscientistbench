<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>CertUnlearn: PABI Certified Neural Network Unlearning</title>
  <desc>Noisy clipped-SGD iterations contract a pretrained TinyNet toward an idealized retrain distribution on retain data until certified under epsilon and delta, enabling clean fine-tuning to reach 50% CIFAR-10 accuracy far earlier than retraining from scratch.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="funnelFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#475569" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="0" y="52" width="640" height="306" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#topBar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17">CertUnlearn</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">PABI Certified Neural Unlearning</text>
  </g>
  <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Left Panel: Phase 1 PABI Contraction in Parameter Space -->
  <rect x="28" y="72" width="264" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="44" y="94" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">Phase 1 · PABI Contraction</text>

  <!-- Retain / Forget Dataset Split Strip -->
  <rect x="44" y="106" width="144" height="26" rx="6" fill="#DBEAFE" stroke="#0052FF" stroke-width="1.3"/>
  <text x="116" y="123" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">90% Retain</text>

  <rect x="194" y="106" width="82" height="26" rx="6" fill="#E11D48" fill-opacity="0.12" stroke="#E11D48" stroke-width="1.3" stroke-dasharray="3 2.5"/>
  <text x="235" y="123" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">10% Forget</text>

  <!-- Exponential Contraction Funnel Polygon -->
  <path d="M 70 176 C 122 178, 168 202, 234 218 L 234 234 C 168 250, 122 274, 70 276 Z" fill="url(#funnelFill)"/>

  <!-- Gaussian Noise Halos along Noisy Clipped-SGD Steps -->
  <circle cx="132" cy="226" r="28" fill="#0EA5E9" fill-opacity="0.12" stroke="#0EA5E9" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="176" cy="226" r="24" fill="#0EA5E9" fill-opacity="0.16" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Converging Parameter Trajectories -->
  <path d="M 70 176 C 122 178, 168 202, 214 219" fill="none" stroke="#0052FF" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 70 276 C 122 274, 168 250, 214 233" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="5 3.5" stroke-linecap="round"/>

  <!-- Starting Parameter States -->
  <circle cx="70" cy="176" r="17" fill="#DBEAFE" stroke="#0052FF" stroke-width="2"/>
  <text x="70" y="180" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#0A1E5E">θ<tspan dy="2.5" font-size="11.5">0</tspan></text>

  <circle cx="70" cy="276" r="17" fill="#F7FAFF" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 2.5"/>
  <text x="70" y="281" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#475569">θ*</text>

  <!-- Step Noise Label -->
  <text x="154" y="168" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0EA5E9">+<tspan font-style="italic">N</tspan>(0, σ²I)</text>

  <!-- Certified Indistinguishability Ball -->
  <circle cx="240" cy="226" r="34" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="2.4"/>
  <circle cx="240" cy="226" r="24" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <text x="240" y="222" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Certified</text>
  <text x="240" y="237" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0A1E5E">(ε, δ)</text>

  <!-- Contraction Law Caption -->
  <text x="160" y="326" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Contraction ρ = 1 − ηλ · T Steps</text>

  <!-- Connecting Transition Arrow -->
  <line x1="292" y1="207" x2="314" y2="207" stroke="#0052FF" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Right Panel: Phase 2 Utility Recovery Curve -->
  <rect x="318" y="72" width="294" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="334" y="94" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">Phase 2 · Retain Recovery</text>

  <!-- Shaded Phase 1 Noisy Region inside Recovery Plot -->
  <rect x="360" y="114" width="22" height="190" fill="#E11D48" fill-opacity="0.09"/>

  <!-- Coordinate Axes -->
  <line x1="360" y1="114" x2="360" y2="304" stroke="#475569" stroke-width="1.4" stroke-opacity="0.7"/>
  <line x1="360" y1="304" x2="594" y2="304" stroke="#475569" stroke-width="1.4" stroke-opacity="0.7"/>

  <!-- 50% Target Accuracy Line -->
  <line x1="360" y1="186" x2="594" y2="186" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="354" y="190" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">50%</text>

  <!-- Vertical Drop Lines at 50% Crossings -->
  <line x1="442" y1="186" x2="442" y2="304" stroke="#059669" stroke-width="1.4" stroke-dasharray="3.5 3"/>
  <line x1="532" y1="186" x2="532" y2="304" stroke="#475569" stroke-width="1.3" stroke-opacity="0.5" stroke-dasharray="3.5 3"/>

  <!-- Retrain-from-Scratch Baseline Curve -->
  <path d="M 360 296 C 402 288, 444 264, 488 228 C 512 208, 524 194, 532 186 C 554 166, 574 156, 592 150" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <circle cx="532" cy="186" r="4" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>

  <!-- Certified Unlearning Recovery Curve (Noisy Dip + Fast Retain Climb) -->
  <path d="M 360 218 L 380 248" fill="none" stroke="#E11D48" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 380 248 C 400 226, 420 202, 442 186 C 478 160, 528 140, 592 128" fill="none" stroke="#0052FF" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="442" cy="186" r="5.5" fill="#059669" stroke="#FFFFFF" stroke-width="1.8"/>

  <!-- Speedup Arrow between Crossings -->
  <line x1="526" y1="278" x2="450" y2="278" stroke="#059669" stroke-width="2.4" marker-end="url(#arrowGreen)"/>
  <text x="488" y="269" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Faster ↓</text>

  <!-- Curve Labels (Zero Overlap) -->
  <text x="505" y="132" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0052FF">Unlearned</text>
  <text x="562" y="218" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Retrain</text>

  <!-- X-Axis Labels -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">
    <text x="360" y="324" text-anchor="middle">0</text>
    <text x="477" y="324" text-anchor="middle">Retain Epochs</text>
    <text x="592" y="324" text-anchor="middle">50</text>
  </g>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
    <text x="28" y="379" fill="#475569">CIFAR-10 · TinyNet · ε ≤ 1.004, δ ≤ 1e-5</text>
    <text x="612" y="379" text-anchor="end" fill="#475569">Metric: <tspan font-weight="700" fill="#0052FF">Epochs to 50% ↓</tspan></text>
  </g>
</svg>
