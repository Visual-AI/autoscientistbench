<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>AnisoBivFunc: Anisotropy Direction Estimation for Bivariate Functional Data</title>
  <desc>A noisy anisotropic bivariate fractional Brownian surface rotated by angle alpha alongside its polar directional increment rose and orthogonal smooth-versus-rough slices.</desc>
  <defs>
    <clipPath id="plateClip">
      <rect x="0" y="0" width="640" height="400" rx="14"/>
    </clipPath>
    <clipPath id="surfaceClip">
      <rect x="48" y="92" width="302" height="222" rx="7"/>
    </clipPath>
    <linearGradient id="plateBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#F4FBF6"/>
      <stop offset="55%" stop-color="#F4FBF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#124724"/>
      <stop offset="45%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="coordDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#15803D" opacity="0.16"/>
    </pattern>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.2 L8.8 5 L0 8.8 Z" fill="#124724"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1.5 L8.5 5 L0 8.5 Z" fill="#E11D48"/>
    </marker>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
    <rect x="0" y="0" width="640" height="400" fill="url(#plateBg)"/>
    <rect x="20" y="58" width="600" height="296" fill="url(#coordDots)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#topAccent)"/>

    <!-- Header -->
    <text x="28" y="38" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">AnisoBivFunc</text>
    <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Anisotropic Bivariate Functional Surfaces</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>

    <!-- Left-Center Hero: Noisy Anisotropic 2D Surface & Rotated Axes -->
    <g>
      <rect x="34" y="70" width="330" height="270" rx="11" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.2"/>
      <!-- Surface viewport -->
      <rect x="48" y="92" width="302" height="222" rx="7" fill="#F4FBF6" stroke="#CBD5E1" stroke-width="1.2"/>

      <g clip-path="url(#surfaceClip)">
        <!-- Subtle surface grid -->
        <g stroke="#CBD5E1" stroke-width="0.9" stroke-opacity="0.55">
          <line x1="98" y1="92" x2="98" y2="314"/>
          <line x1="148" y1="92" x2="148" y2="314"/>
          <line x1="199" y1="92" x2="199" y2="314"/>
          <line x1="250" y1="92" x2="250" y2="314"/>
          <line x1="300" y1="92" x2="300" y2="314"/>
          <line x1="48" y1="136" x2="350" y2="136"/>
          <line x1="48" y1="180" x2="350" y2="180"/>
          <line x1="48" y1="224" x2="350" y2="224"/>
          <line x1="48" y1="268" x2="350" y2="268"/>
        </g>

        <!-- Rotated Anisotropic Topographic Contours (alpha = 32 deg) -->
        <g transform="translate(199, 204) rotate(-32)">
          <ellipse cx="0" cy="0" rx="132" ry="56" fill="#DCFCE7" fill-opacity="0.65" stroke="#22C55E" stroke-width="1.6"/>
          <ellipse cx="0" cy="0" rx="102" ry="42" fill="#22C55E" fill-opacity="0.22" stroke="#15803D" stroke-width="1.8"/>
          <ellipse cx="0" cy="0" rx="74" ry="28" fill="#15803D" fill-opacity="0.20" stroke="#15803D" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="46" ry="17" fill="#15803D" fill-opacity="0.26" stroke="#124724" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="20" ry="7" fill="#124724" fill-opacity="0.32"/>
        </g>

        <!-- Additive observation noise speckles -->
        <g fill="#475569" opacity="0.42">
          <circle cx="72" cy="144" r="1.9"/><circle cx="110" cy="128" r="1.8"/><circle cx="136" cy="276" r="1.9"/>
          <circle cx="268" cy="264" r="1.8"/><circle cx="312" cy="242" r="1.9"/><circle cx="294" cy="120" r="1.8"/>
          <circle cx="88" cy="248" r="1.9"/><circle cx="164" cy="154" r="1.8"/><circle cx="232" cy="248" r="1.9"/>
          <circle cx="326" cy="168" r="1.8"/><circle cx="122" cy="222" r="1.8"/><circle cx="262" cy="148" r="1.8"/>
        </g>
        <g fill="#E11D48" opacity="0.45">
          <circle cx="82" cy="186" r="1.8"/><circle cx="152" cy="290" r="1.8"/><circle cx="222" cy="134" r="1.8"/>
          <circle cx="288" cy="284" r="1.8"/><circle cx="318" cy="126" r="1.8"/><circle cx="176" cy="242" r="1.8"/>
        </g>
      </g>

      <!-- Horizontal reference axis e_1 -->
      <line x1="62" y1="204" x2="338" y2="204" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4"/>

      <!-- Angle wedge alpha (from 0 deg to -32 deg, radius 58 around 199,204) -->
      <!-- cos(32)=0.8480, sin(32)=0.5299 => dx=49.2, dy=-30.7 => end=(248.2, 173.3) -->
      <path d="M199 204 L257 204 A58 58 0 0 0 248.2 173.3 Z" fill="#22C55E" fill-opacity="0.34"/>
      <path d="M257 204 A58 58 0 0 0 248.2 173.3" fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>

      <!-- Orthogonal rough axis (alpha + 90 deg) -->
      <line x1="199" y1="204" x2="156" y2="135" stroke="#E11D48" stroke-width="2.4" stroke-dasharray="5 3" marker-end="url(#arrowRose)"/>

      <!-- Smooth anisotropy axis (alpha = 32 deg) -->
      <line x1="104" y1="263" x2="306" y2="137" stroke="#124724" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrowDark)"/>

      <!-- Right-angle square marker at center -->
      <path d="M191.5 192 L203.5 184.5 L211 196.5" fill="none" stroke="#124724" stroke-width="1.5"/>
      <circle cx="199" cy="204" r="3.8" fill="#124724"/>

      <!-- Clean labels inside clear corners -->
      <text x="275" y="193" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#124724">α</text>
      <text x="58" y="111" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">Rough H₂</text>
      <text x="340" y="111" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#124724">Smooth H₁</text>
      <text x="199" y="331" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Noisy Bivariate fBm Surface</text>
    </g>

    <!-- Right Column: Polar Increment Rose + 1D Regularity Slices -->
    <g>
      <!-- Top Card: Polar Directional Increment Rose -->
      <rect x="380" y="70" width="232" height="168" rx="11" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="496" y="91" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A0E17">Directional Increment Rose</text>

      <!-- Polar grid centered at (496, 166) -->
      <g stroke="#CBD5E1" stroke-width="1" fill="none">
        <circle cx="496" cy="166" r="20" stroke-opacity="0.7"/>
        <circle cx="496" cy="166" r="40" stroke-opacity="0.75"/>
        <circle cx="496" cy="166" r="58" stroke-opacity="0.8"/>
        <line x1="432" y1="166" x2="560" y2="166" stroke-dasharray="3 3"/>
        <line x1="496" y1="104" x2="496" y2="228" stroke-dasharray="3 3"/>
      </g>

      <!-- Peanut / figure-8 directional variance curve pinched along alpha (-32 deg) -->
      <g transform="translate(496, 166) rotate(-32)">
        <path d="M16 0 C18 -26, 26 -54, 0 -56 C-26 -54, -18 -26, -16 0 C-18 26, -26 54, 0 56 C26 54, 18 26, 16 0 Z" fill="#DCFCE7" fill-opacity="0.78" stroke="#15803D" stroke-width="2.8" stroke-linejoin="round"/>
        <!-- Estimated smooth axis ray through the narrow waist -->
        <line x1="-64" y1="0" x2="64" y2="0" stroke="#124724" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="16" cy="0" r="3.6" fill="#124724" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="-16" cy="0" r="3.6" fill="#124724" stroke="#FFFFFF" stroke-width="1.2"/>
      </g>
      <text x="568" y="132" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#124724">α̂</text>
      <text x="392" y="122" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">max var</text>

      <!-- Bottom Card: Smooth vs Rough 1D Cross-Section Slices -->
      <rect x="380" y="248" width="232" height="92" rx="11" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.2"/>
      <!-- Smooth fBm trace along alpha -->
      <text x="394" y="279" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#15803D">α (H₁)</text>
      <path d="M448 278 C464 266, 482 262, 502 272 C520 282, 540 284, 560 270 C574 262, 588 264, 598 272" fill="none" stroke="#15803D" stroke-width="2.8" stroke-linecap="round"/>

      <line x1="394" y1="295" x2="598" y2="295" stroke="#CBD5E1" stroke-width="0.9" stroke-opacity="0.7"/>

      <!-- Rough fBm trace along alpha perpendicular -->
      <text x="394" y="321" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">α⊥ (H₂)</text>
      <path d="M448 318 L456 306 L463 326 L471 308 L479 324 L487 304 L495 328 L503 310 L511 325 L519 305 L527 327 L535 308 L543 324 L551 304 L559 326 L567 309 L575 325 L583 307 L591 323 L598 313" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
    <text x="28" y="381" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#15803D">mean_median_angle_risk ↓</tspan></text>
    <text x="612" y="381" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">Orthogonal fBm · α ∈ [0, π]</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>
</svg>
