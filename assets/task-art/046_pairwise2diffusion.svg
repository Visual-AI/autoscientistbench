<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>PairwiseScore — Score-Based Density from Pairwise Comparisons</title>
  <desc>Noisy Bradley-Terry pairwise winner-loser comparisons mapped via a position-dependent tempering field tau(x) into a tempered 2D score vector field whose annealed Langevin trajectories sample an interlocking two-moons belief density.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="tau-glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tau-glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.16"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0052FF"/>
    </marker>
    <marker id="quiver-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto">
      <path d="M 1 2 L 8.5 5 L 1 8 z" fill="#0052FF"/>
    </marker>
    <marker id="quiver-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto">
      <path d="M 1 2 L 8.5 5 L 1 8 z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base luminous plate -->
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="24" y="60" width="592" height="292" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accent-bar)"/>

    <!-- Header -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.3">PairwiseScore</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Score Density from Comparisons</text>
    <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

    <!-- LEFT PANEL: Noisy Pairwise Bradley-Terry Comparisons -->
    <rect x="34" y="70" width="182" height="278" rx="10" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
    <text x="125" y="92" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0A1E5E">Pairwise x_w ≻ x_l</text>

    <!-- 4 Paired Comparison Duel Rows -->
    <!-- Row 1 -->
    <rect x="48" y="106" width="154" height="28" rx="14" fill="#F7FAFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="72" cy="120" r="6" fill="#0052FF" stroke="#FFFFFF" stroke-width="1.6"/>
    <text x="94" y="124" font-size="11" font-weight="600" fill="#0052FF">x_w</text>
    <text x="128" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#0A1E5E">≻</text>
    <text x="150" y="124" font-size="11" font-weight="500" fill="#475569">x_l</text>
    <circle cx="182" cy="120" r="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>

    <!-- Row 2 -->
    <rect x="48" y="142" width="154" height="28" rx="14" fill="#F7FAFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="72" cy="156" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>
    <line x1="86" y1="156" x2="108" y2="156" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#0A1E5E">≻</text>
    <line x1="146" y1="156" x2="162" y2="156" stroke="#475569" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="182" cy="156" r="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>

    <!-- Row 3 -->
    <rect x="48" y="178" width="154" height="28" rx="14" fill="#F7FAFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="72" cy="192" r="6" fill="#0052FF" stroke="#FFFFFF" stroke-width="1.6"/>
    <line x1="86" y1="192" x2="112" y2="192" stroke="#0052FF" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#0A1E5E">≻</text>
    <line x1="146" y1="192" x2="158" y2="192" stroke="#475569" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="182" cy="192" r="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>

    <!-- Row 4 -->
    <rect x="48" y="214" width="154" height="28" rx="14" fill="#F7FAFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="72" cy="228" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.6"/>
    <line x1="86" y1="228" x2="104" y2="228" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="233" text-anchor="middle" font-size="14" font-weight="700" fill="#0A1E5E">≻</text>
    <line x1="146" y1="228" x2="166" y2="228" stroke="#475569" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="182" cy="228" r="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>

    <text x="125" y="268" text-anchor="middle" font-size="11.5" font-weight="500" fill="#475569">Bradley-Terry + Gumbel</text>

    <!-- Tempered Score Theorem Pill -->
    <rect x="46" y="284" width="158" height="48" rx="9" fill="#DBEAFE" stroke="#0052FF" stroke-opacity="0.35" stroke-width="1"/>
    <text x="125" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#0A1E5E">∇log p(x) =</text>
    <text x="125" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#0052FF">τ(x) · ∇log p_w(x)</text>

    <!-- Connector Arrow -->
    <line x1="218" y1="208" x2="244" y2="208" stroke="#0052FF" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

    <!-- RIGHT MAIN STAGE: Tempered Score Vector Field & Two-Moons Belief Density -->
    <rect x="248" y="70" width="364" height="278" rx="10" fill="#FFFFFF" fill-opacity="0.86" stroke="#CBD5E1" stroke-width="1"/>
    <text x="264" y="92" font-size="12.5" font-weight="600" fill="#0A1E5E">Tempered Score Field τ(x)</text>
    <text x="596" y="92" text-anchor="end" font-size="11.5" font-weight="600" fill="#059669">Annealed Langevin</text>

    <!-- Position-dependent tempering field tau(x) soft halos -->
    <ellipse cx="386" cy="182" rx="98" ry="64" fill="url(#tau-glow-1)"/>
    <ellipse cx="476" cy="246" rx="98" ry="64" fill="url(#tau-glow-2)"/>
    <ellipse cx="430" cy="212" rx="146" ry="92" fill="none" stroke="#0EA5E9" stroke-opacity="0.26" stroke-width="1.3" stroke-dasharray="5,4"/>

    <!-- 2D Quiver Score Vector Field pointing smoothly into the two crescents -->
    <!-- Outer sky arrows -->
    <g stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" marker-end="url(#quiver-sky)">
      <line x1="276" y1="126" x2="294" y2="140"/>
      <line x1="336" y1="112" x2="346" y2="132"/>
      <line x1="402" y1="108" x2="400" y2="128"/>
      <line x1="468" y1="116" x2="454" y2="136"/>
      <line x1="532" y1="128" x2="516" y2="150"/>
      <line x1="582" y1="156" x2="562" y2="174"/>
      <line x1="274" y1="188" x2="296" y2="188"/>
      <line x1="278" y1="252" x2="300" y2="236"/>
      <line x1="328" y1="294" x2="342" y2="274"/>
      <line x1="396" y1="306" x2="404" y2="286"/>
      <line x1="468" y1="308" x2="466" y2="288"/>
      <line x1="536" y1="302" x2="522" y2="284"/>
      <line x1="584" y1="264" x2="564" y2="250"/>
    </g>
    <!-- Stronger high-tau cobalt inner arrows -->
    <g stroke="#0052FF" stroke-width="1.8" stroke-linecap="round" marker-end="url(#quiver-blue)">
      <line x1="358" y1="218" x2="366" y2="194"/>
      <line x1="408" y1="208" x2="410" y2="186"/>
      <line x1="452" y1="216" x2="450" y2="238"/>
      <line x1="504" y1="206" x2="496" y2="228"/>
      <line x1="566" y1="212" x2="550" y2="214"/>
    </g>

    <!-- Upper Crescent Moon (Twomoons belief density lobe 1) -->
    <path d="M 308 214 C 314 134, 434 128, 464 198 C 434 166, 344 168, 308 214 Z"
          fill="#0052FF" fill-opacity="0.24" stroke="#0052FF" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Lower Crescent Moon (Twomoons belief density lobe 2) -->
    <path d="M 396 222 C 426 254, 516 252, 552 206 C 546 286, 426 292, 396 222 Z"
          fill="#0EA5E9" fill-opacity="0.28" stroke="#0A1E5E" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Sampled particles from recovered belief density p(x) -->
    <g fill="#0A1E5E" fill-opacity="0.82">
      <!-- Upper moon particles -->
      <circle cx="326" cy="188" r="2.6"/>
      <circle cx="344" cy="166" r="2.6"/>
      <circle cx="364" cy="156" r="2.6"/>
      <circle cx="386" cy="152" r="2.6"/>
      <circle cx="408" cy="154" r="2.6"/>
      <circle cx="428" cy="162" r="2.6"/>
      <circle cx="446" cy="176" r="2.6"/>
      <circle cx="374" cy="162" r="2.4" fill="#0052FF"/>
      <circle cx="418" cy="164" r="2.4" fill="#0052FF"/>
      <!-- Lower moon particles -->
      <circle cx="416" cy="244" r="2.6"/>
      <circle cx="436" cy="260" r="2.6"/>
      <circle cx="458" cy="268" r="2.6"/>
      <circle cx="482" cy="268" r="2.6"/>
      <circle cx="504" cy="260" r="2.6"/>
      <circle cx="524" cy="246" r="2.6"/>
      <circle cx="538" cy="228" r="2.6"/>
      <circle cx="470" cy="260" r="2.4" fill="#0052FF"/>
      <circle cx="514" cy="248" r="2.4" fill="#0052FF"/>
    </g>

    <!-- Annealed Langevin sampling paths curving from noise into high-density crescents -->
    <path d="M 578 118 C 546 122, 510 144, 488 188 C 478 208, 476 232, 474 252"
          fill="none" stroke="#059669" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <circle cx="578" cy="118" r="3.6" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.3"/>

    <path d="M 284 298 C 306 286, 320 258, 326 226 C 330 206, 338 188, 350 172"
          fill="none" stroke="#059669" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <circle cx="284" cy="298" r="3.6" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.3"/>

    <!-- Bottom labels inside right panel -->
    <text x="264" y="336" font-size="12" font-weight="700" fill="#0052FF">Recovered p(x)</text>
    <text x="596" y="336" text-anchor="end" font-size="11.5" font-weight="500" fill="#475569">Multimodal Target Density</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
    <text x="28" y="381" font-size="12" font-weight="500" fill="#475569">8 benchmark densities · D = 2..16</text>
    <text x="612" y="381" text-anchor="end" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#0052FF">mmtv ↓</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>
</svg>
