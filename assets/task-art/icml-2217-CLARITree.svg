<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>CLARITree — Piecewise-Linear Regression Trees</title>
  <desc>Depth-four piecewise-linear regression trees combine twenty-quantile lookahead split search with rank-one Cholesky updates of the ridge-regularized Gram matrix to fit interpretable linear leaf models.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#0A1E5E" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Base Card -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="20" y="60" width="600" height="294" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accentGrad)"/>
  </g>
  <rect x="0.75" y="0.75" width="638.5" height="398.5" rx="15.25" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Top Header -->
  <text x="28" y="38" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.2">CLARITree</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Piecewise-Linear Regression Trees</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

  <!-- LEFT-CENTER: Depth-4 Lookahead Piecewise-Linear Tree -->
  <rect x="30" y="72" width="352" height="274" rx="12" fill="#FFFFFF" fill-opacity="0.84" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="44" y="94" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0A1E5E">Lookahead Tree Search</text>
  <text x="368" y="94" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">20-quantile splits</text>

  <!-- Lookahead Subtree Highlight Envelope -->
  <rect x="44" y="152" width="174" height="96" rx="10" fill="#DBEAFE" fill-opacity="0.42" stroke="#0052FF" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="52" y="145" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">Lookahead</text>

  <!-- Tree Edges -->
  <!-- Active Lookahead Left Path -->
  <g stroke="#0052FF" stroke-width="2.6" stroke-linecap="round">
    <line x1="206" y1="134" x2="130" y2="168"/>
    <line x1="130" y1="186" x2="86" y2="218"/>
    <line x1="130" y1="186" x2="174" y2="218"/>
  </g>
  <!-- Right Path -->
  <g stroke="#0EA5E9" stroke-width="2.2" stroke-linecap="round">
    <line x1="206" y1="134" x2="294" y2="168"/>
    <line x1="294" y1="186" x2="254" y2="218"/>
    <line x1="294" y1="186" x2="334" y2="218"/>
  </g>
  <!-- Edges to Linear Leaves -->
  <g stroke="#475569" stroke-width="1.8" stroke-linecap="round">
    <line x1="86" y1="234" x2="72" y2="270"/>
    <line x1="174" y1="234" x2="138" y2="270"/>
    <line x1="174" y1="234" x2="204" y2="270"/>
    <line x1="254" y1="234" x2="270" y2="270"/>
    <line x1="334" y1="234" x2="336" y2="270"/>
  </g>

  <!-- Depth 0 Root Split Node -->
  <rect x="166" y="110" width="80" height="24" rx="12" fill="#0052FF"/>
  <text x="206" y="126" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">xⱼ ≤ qₖ</text>

  <!-- Depth 1 Internal Nodes -->
  <rect x="102" y="164" width="56" height="22" rx="11" fill="#FFFFFF" stroke="#0052FF" stroke-width="2.2"/>
  <text x="130" y="179" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0052FF">x₂ ≤ q</text>

  <rect x="266" y="164" width="56" height="22" rx="11" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="294" y="179" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0A1E5E">x₅ ≤ q</text>

  <!-- Depth 2 Internal Nodes -->
  <circle cx="86" cy="224" r="10" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
  <circle cx="174" cy="224" r="10" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
  <circle cx="254" cy="224" r="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <circle cx="334" cy="224" r="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>

  <!-- Depth 3-4 Linear Regression Leaf Glyphs -->
  <!-- Leaf 1 -->
  <rect x="44" y="270" width="56" height="42" rx="7" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.8"/>
  <line x1="52" y1="302" x2="92" y2="280" stroke="#0052FF" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#0EA5E9"><circle cx="56" cy="298" r="2"/><circle cx="70" cy="293" r="2"/><circle cx="86" cy="282" r="2"/></g>

  <!-- Leaf 2 -->
  <rect x="110" y="270" width="56" height="42" rx="7" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.8"/>
  <line x1="118" y1="282" x2="158" y2="302" stroke="#0052FF" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#0EA5E9"><circle cx="122" cy="285" r="2"/><circle cx="138" cy="291" r="2"/><circle cx="152" cy="300" r="2"/></g>

  <!-- Leaf 3 -->
  <rect x="176" y="270" width="56" height="42" rx="7" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <line x1="184" y1="300" x2="224" y2="278" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#059669"><circle cx="188" cy="297" r="2"/><circle cx="204" cy="289" r="2"/><circle cx="220" cy="280" r="2"/></g>

  <!-- Leaf 4 -->
  <rect x="242" y="270" width="56" height="42" rx="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.8"/>
  <line x1="250" y1="294" x2="290" y2="286" stroke="#0EA5E9" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#0052FF"><circle cx="254" cy="295" r="2"/><circle cx="270" cy="290" r="2"/><circle cx="286" cy="286" r="2"/></g>

  <!-- Leaf 5 -->
  <rect x="308" y="270" width="56" height="42" rx="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.8"/>
  <line x1="316" y1="304" x2="356" y2="278" stroke="#0EA5E9" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#0052FF"><circle cx="320" cy="300" r="2"/><circle cx="336" cy="291" r="2"/><circle cx="352" cy="281" r="2"/></g>

  <text x="206" y="334" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Linear Ridge Leaves (β₀ + βᵀx)</text>

  <!-- RIGHT TOP: Rank-1 Cholesky Upper-Triangular Update -->
  <rect x="396" y="72" width="214" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="410" y="94" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0A1E5E">Rank-1 Cholesky Factor R</text>

  <!-- 5x5 Upper-Triangular Matrix Grid -->
  <g transform="translate(412, 106)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="14" height="12" rx="2.5" fill="#0052FF"/>
    <rect x="17" y="0" width="14" height="12" rx="2.5" fill="#0EA5E9" fill-opacity="0.72"/>
    <rect x="34" y="0" width="14" height="12" rx="2.5" fill="#0EA5E9" fill-opacity="0.45"/>
    <rect x="51" y="0" width="14" height="12" rx="2.5" fill="#DBEAFE"/>
    <rect x="68" y="0" width="14" height="12" rx="2.5" fill="#DBEAFE"/>
    <!-- Row 2 -->
    <rect x="0" y="15" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="17" y="15" width="14" height="12" rx="2.5" fill="#0052FF"/>
    <rect x="34" y="15" width="14" height="12" rx="2.5" fill="#0EA5E9" fill-opacity="0.72"/>
    <rect x="51" y="15" width="14" height="12" rx="2.5" fill="#0EA5E9" fill-opacity="0.45"/>
    <rect x="68" y="15" width="14" height="12" rx="2.5" fill="#DBEAFE"/>
    <!-- Row 3 -->
    <rect x="0" y="30" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="17" y="30" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="34" y="30" width="14" height="12" rx="2.5" fill="#0052FF"/>
    <rect x="51" y="30" width="14" height="12" rx="2.5" fill="#0EA5E9" fill-opacity="0.72"/>
    <rect x="68" y="30" width="14" height="12" rx="2.5" fill="#0EA5E9" fill-opacity="0.45"/>
    <!-- Row 4 -->
    <rect x="0" y="45" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="17" y="45" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="34" y="45" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="51" y="45" width="14" height="12" rx="2.5" fill="#0052FF"/>
    <rect x="68" y="45" width="14" height="12" rx="2.5" fill="#0EA5E9" fill-opacity="0.72"/>
    <!-- Row 5 -->
    <rect x="0" y="60" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="17" y="60" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="34" y="60" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="51" y="60" width="14" height="12" rx="2.5" fill="#CBD5E1" fill-opacity="0.22"/>
    <rect x="68" y="60" width="14" height="12" rx="2.5" fill="#0052FF"/>
  </g>

  <!-- Cholesky Update Math Annotations -->
  <text x="510" y="128" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0052FF">RᵀR + κI</text>
  <rect x="510" y="138" width="76" height="22" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.45"/>
  <text x="548" y="153" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">+ u uᵀ</text>
  <text x="510" y="177" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">Stable O(p²)</text>

  <!-- RIGHT BOTTOM: Segmented Piecewise-Linear Response Plot -->
  <rect x="396" y="204" width="214" height="142" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="410" y="224" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0A1E5E">Piecewise-Linear Fit</text>

  <!-- Axes & Quantile Split Partitions -->
  <line x1="416" y1="322" x2="594" y2="322" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="416" y1="322" x2="416" y2="236" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="474" y1="238" x2="474" y2="322" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="534" y1="238" x2="534" y2="322" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Scatter Points -->
  <g fill="#475569" fill-opacity="0.45">
    <circle cx="426" cy="312" r="2.6"/><circle cx="440" cy="300" r="2.6"/><circle cx="454" cy="296" r="2.6"/><circle cx="466" cy="284" r="2.6"/>
    <circle cx="484" cy="274" r="2.6"/><circle cx="498" cy="262" r="2.6"/><circle cx="512" cy="256" r="2.6"/><circle cx="526" cy="244" r="2.6"/>
    <circle cx="546" cy="258" r="2.6"/><circle cx="560" cy="264" r="2.6"/><circle cx="574" cy="262" r="2.6"/><circle cx="586" cy="272" r="2.6"/>
  </g>

  <!-- Three Disjoint Linear Segments -->
  <line x1="420" y1="312" x2="472" y2="284" stroke="#0052FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="476" y1="276" x2="532" y2="244" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
  <line x1="536" y1="256" x2="590" y2="270" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

  <text x="474" y="337" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">q₁</text>
  <text x="534" y="337" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">q₂</text>

  <!-- Bottom Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
  <text x="28" y="378" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Depth ≤ 4 · 5-fold CV · κ ridge + λ leaf penalty</text>
  <text x="612" y="378" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
    <tspan fill="#475569" font-weight="500">Target </tspan>
    <tspan fill="#0052FF" font-weight="700">mean_test_r2 ↑</tspan>
  </text>
</svg>
