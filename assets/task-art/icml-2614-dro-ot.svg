<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>OT-DRO — Loss-Aware Wasserstein Geometry</title>
  <desc>Learning a lower-triangular transport factor L reshapes the conservative isotropic type-1 Wasserstein ball into a loss-aligned ellipse covering the true law while shrinking out-of-sample absolute regression error.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ellipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#261E6B" opacity="0.16"/>
    </pattern>
    <marker id="arrInd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 L3,5 Z" fill="#4F46E5"/>
    </marker>
  </defs>

  <!-- Base Card -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="20" y="60" width="600" height="294" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accentGrad)"/>
  </g>
  <rect x="0.75" y="0.75" width="638.5" height="398.5" rx="15.25" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Top Header -->
  <text x="28" y="38" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.2">OT-DRO</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Loss-Aware Wasserstein Geometry</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

  <!-- LEFT PANEL: Isotropic vs Learned Anisotropic Wasserstein Ball -->
  <rect x="30" y="72" width="280" height="274" rx="12" fill="#FFFFFF" fill-opacity="0.84" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="170" y="94" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#261E6B">Ambiguity Set Geometry</text>

  <!-- Subtle Centered Axes -->
  <line x1="56" y1="214" x2="284" y2="214" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="170" y1="112" x2="170" y2="314" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Conservative Isotropic Ball (L = I) -->
  <circle cx="170" cy="214" r="84" fill="#E11D48" fill-opacity="0.06" stroke="#E11D48" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="252" y="120" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">Isotropic (L=I)</text>

  <!-- Learned Loss-Aware Anisotropic Ellipse (Mahalanobis L) -->
  <g transform="rotate(-32 170 214)">
    <ellipse cx="170" cy="214" rx="92" ry="37" fill="url(#ellipGrad)" stroke="#4F46E5" stroke-width="3"/>
    <line x1="88" y1="214" x2="252" y2="214" stroke="#4F46E5" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="3 3"/>
  </g>

  <!-- Squeeze Arrows (Circle -> Learned Ellipse) -->
  <line x1="128" y1="146" x2="144" y2="172" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrInd)"/>
  <line x1="212" y1="282" x2="196" y2="256" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrInd)"/>

  <!-- Bootstrap Resample Points (mostly covered, few outside) -->
  <g fill="#8B5CF6" fill-opacity="0.72">
    <circle cx="122" cy="234" r="3.2"/><circle cx="144" cy="228" r="3.2"/><circle cx="152" cy="204" r="3.2"/>
    <circle cx="188" cy="222" r="3.2"/><circle cx="196" cy="196" r="3.2"/><circle cx="222" cy="180" r="3.2"/>
    <circle cx="132" cy="250" r="3.2"/><circle cx="176" cy="194" r="3.2"/><circle cx="206" cy="206" r="3.2"/>
    <circle cx="110" cy="252" r="3.2"/>
  </g>
  <!-- Exceedance points outside ellipse -->
  <circle cx="104" cy="176" r="3" fill="#E11D48" fill-opacity="0.65"/>
  <circle cx="238" cy="248" r="3" fill="#E11D48" fill-opacity="0.65"/>

  <!-- Empirical Center P_hat & Covered True Law P* -->
  <circle cx="170" cy="214" r="5" fill="#261E6B" stroke="#FFFFFF" stroke-width="1.6"/>
  <polygon points="214,180 220,188 214,196 208,188" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="226" y="191" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">P*</text>

  <text x="170" y="335" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">Learned Ball  ‖LᵀΔξ‖ ≤ ε</text>

  <!-- RIGHT PANEL: Scalar Linear DRO Regression & Lower-Triangular L -->
  <rect x="326" y="72" width="284" height="274" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="468" y="94" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#261E6B">Loss-Aware Linear DRO</text>

  <!-- Coordinate Axes through Origin (468, 214) -->
  <line x1="348" y1="214" x2="588" y2="214" stroke="#CBD5E1" stroke-width="1.4"/>
  <line x1="468" y1="112" x2="468" y2="314" stroke="#CBD5E1" stroke-width="1.4"/>

  <!-- Lower-Triangular Matrix L Glyph (Top-Left Quadrant) -->
  <rect x="344" y="108" width="84" height="54" rx="8" fill="#F7F6FF" stroke="#4F46E5" stroke-opacity="0.45" stroke-width="1.3"/>
  <path d="M354,116 L349,116 L349,154 L354,154 M418,116 L423,116 L423,154 L418,154" fill="none" stroke="#261E6B" stroke-width="1.5"/>
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="369" y="131" fill="#4F46E5">L₁₁</text>
    <text x="403" y="131" fill="#CBD5E1">0</text>
    <text x="369" y="150" fill="#8B5CF6">L₂₁</text>
    <text x="403" y="150" fill="#4F46E5">L₂₂</text>
  </g>

  <!-- Dual-Norm Uncertainty Wedge around Optimal Line -->
  <polygon points="468,214 576,128 576,158" fill="#E0E7FF" fill-opacity="0.55"/>
  <polygon points="468,214 360,300 360,270" fill="#E0E7FF" fill-opacity="0.55"/>

  <!-- Conservative Isotropic Slope (L=I, over-shrunk) -->
  <line x1="356" y1="248" x2="580" y2="180" stroke="#E11D48" stroke-width="2.1" stroke-dasharray="5 3.5"/>
  <!-- True Slope w_m * x -->
  <line x1="364" y1="296" x2="572" y2="132" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 3"/>
  <!-- Learned DRO-Optimal Slope y_hat = w* x -->
  <line x1="360" y1="288" x2="576" y2="140" stroke="#4F46E5" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Absolute Residual Stems |y_j - w* x_j| -->
  <g stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="2.5 2">
    <line x1="392" y1="242" x2="392" y2="266"/>
    <line x1="518" y1="158" x2="518" y2="180"/>
    <line x1="552" y1="184" x2="552" y2="156"/>
  </g>

  <!-- J = 10 Observed Data Points -->
  <g fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="372" cy="284" r="4"/>
    <circle cx="392" cy="242" r="4"/>
    <circle cx="412" cy="256" r="4"/>
    <circle cx="430" cy="234" r="4"/>
    <circle cx="448" cy="236" r="4"/>
    <circle cx="486" cy="202" r="4"/>
    <circle cx="504" cy="186" r="4"/>
    <circle cx="518" cy="158" r="4"/>
    <circle cx="538" cy="166" r="4"/>
    <circle cx="552" cy="184" r="4"/>
  </g>

  <!-- Slope Labels (zero overlap) -->
  <text x="546" y="122" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">True wₘx</text>
  <text x="580" y="148" text-anchor="start" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#4F46E5">w*</text>
  <text x="572" y="198" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">L=I</text>

  <!-- Objective Formula Footer Inside Right Panel -->
  <text x="468" y="335" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">|y − wx| + ε‖L⁻¹[−w, 1]‖</text>

  <!-- Bottom Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
  <text x="28" y="378" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Type-1 Wasserstein · J = 10 obs · 20 resamples</text>
  <text x="612" y="378" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
    <tspan fill="#475569" font-weight="500">Target </tspan>
    <tspan fill="#4F46E5" font-weight="700">e_oos ↓</tspan>
  </text>
</svg>
