<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>Axion-FOPT — Axion Misalignment Across First-Order Phase Transitions</title>
  <desc>Nucleating and colliding true-vacuum bubbles during a first-order phase transition beside the log-log axion abundance enhancement curve showing minus-half power-law scaling and seven-parameter model agreement with lattice data.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="bubble-grad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="#FEF3C7" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="xi-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="640" height="400" rx="14"/>
    </clipPath>
    <clipPath id="bubble-viewport">
      <rect x="42" y="94" width="244" height="222" rx="12"/>
    </clipPath>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6E3A05" fill-opacity="0.16"/>
    </pattern>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6E3A05"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base canvas & grid -->
    <rect x="0" y="0" width="640" height="400" fill="url(#card-bg)"/>
    <rect x="16" y="54" width="608" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#accent-bar)"/>

    <!-- Header (y=18..54) -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.3">Axion-FOPT</text>
    <text x="612" y="36" font-size="12.5" font-weight="500" fill="#475569" text-anchor="end">First-Order Phase Transition Axion Enhancement</text>
    <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>

    <!-- LEFT PANEL: Cosmological Bubble Nucleation & Wall Collision Slice -->
    <text x="164" y="81" font-size="12.5" font-weight="600" fill="#0A0E17" text-anchor="middle">True-Vacuum Bubble Percolation</text>

    <!-- Clipped false-vacuum simulation slice -->
    <rect x="42" y="94" width="244" height="222" rx="12" fill="#FEF3C7" fill-opacity="0.34"/>
    <g clip-path="url(#bubble-viewport)">
      <!-- Subtle lattice mesh -->
      <g stroke="#D97706" stroke-width="0.8" stroke-opacity="0.14">
        <line x1="72" y1="94" x2="72" y2="316"/><line x1="102" y1="94" x2="102" y2="316"/>
        <line x1="132" y1="94" x2="132" y2="316"/><line x1="162" y1="94" x2="162" y2="316"/>
        <line x1="192" y1="94" x2="192" y2="316"/><line x1="222" y1="94" x2="222" y2="316"/>
        <line x1="252" y1="94" x2="252" y2="316"/>
        <line x1="42" y1="126" x2="286" y2="126"/><line x1="42" y1="158" x2="286" y2="158"/>
        <line x1="42" y1="190" x2="286" y2="190"/><line x1="42" y1="222" x2="286" y2="222"/>
        <line x1="42" y1="254" x2="286" y2="254"/><line x1="42" y1="286" x2="286" y2="286"/>
      </g>

      <!-- Expanding true-vacuum bubbles -->
      <circle cx="118" cy="184" r="54" fill="url(#bubble-grad)" stroke="#D97706" stroke-width="2.8"/>
      <circle cx="118" cy="184" r="44" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="5 4"/>

      <circle cx="204" cy="204" r="48" fill="url(#bubble-grad)" stroke="#D97706" stroke-width="2.8"/>
      <circle cx="204" cy="204" r="38" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="5 4"/>

      <circle cx="188" cy="126" r="24" fill="url(#bubble-grad)" stroke="#D97706" stroke-width="2.2"/>
      <circle cx="84" cy="272" r="23" fill="url(#bubble-grad)" stroke="#D97706" stroke-width="2.2"/>
      <circle cx="246" cy="284" r="32" fill="url(#bubble-grad)" stroke="#D97706" stroke-width="2.4"/>

      <!-- Highlighted bubble-wall collision arc (gradient kick g_bm) -->
      <path d="M 164 172 Q 170 194 162 216" fill="none" stroke="#E11D48" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 157 178 Q 162 194 156 210" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-opacity="0.5" stroke-dasharray="3 3"/>
      <path d="M 171 178 Q 176 194 169 210" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-opacity="0.5" stroke-dasharray="3 3"/>

      <!-- Outward wall velocity arrows (v_w) -->
      <line x1="88" y1="148" x2="68" y2="128" stroke="#6E3A05" stroke-width="2.2" marker-end="url(#arrow-dark)"/>
      <line x1="242" y1="194" x2="270" y2="184" stroke="#6E3A05" stroke-width="2.2" marker-end="url(#arrow-dark)"/>

      <!-- Collision radius R_c indicator inside Bubble 1 -->
      <circle cx="118" cy="184" r="3" fill="#6E3A05"/>
      <line x1="118" y1="184" x2="118" y2="234" stroke="#6E3A05" stroke-width="1.6" stroke-dasharray="3 2"/>
      <text x="125" y="212" font-size="13" font-weight="700" fill="#6E3A05">R<tspan font-size="11.5" dy="2.5">c</tspan></text>
      <text x="72" y="118" font-size="13" font-weight="700" fill="#6E3A05">v<tspan font-size="11.5" dy="2.5">w</tspan></text>
    </g>
    <rect x="42" y="94" width="244" height="222" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

    <text x="164" y="336" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">Delayed &amp; Bubble Misalignment</text>

    <!-- Vertical section divider -->
    <line x1="308" y1="70" x2="308" y2="346" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 5"/>

    <!-- RIGHT PANEL: Log-Log Enhancement Curve xi vs H*/M_phi -->
    <!-- Axes -->
    <line x1="364" y1="96" x2="364" y2="298" stroke="#475569" stroke-width="1.8"/>
    <line x1="364" y1="298" x2="598" y2="298" stroke="#475569" stroke-width="1.8"/>

    <!-- Log decade faint guides -->
    <line x1="364" y1="162" x2="596" y2="162" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="3 4"/>
    <line x1="364" y1="222" x2="596" y2="222" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="3 4"/>
    <!-- Asymptote xi = 1 line -->
    <line x1="364" y1="282" x2="596" y2="282" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 3"/>

    <!-- Area wash under analytic xi curve down to xi = 1 -->
    <path d="M 364 123 L 430 183 C 463 213 496 244 529 266 C 548 276 568 280 592 281 L 592 282 L 364 282 Z" fill="url(#xi-area)"/>

    <!-- Slope -0.5 asymptote triangle cleanly above low-H curve -->
    <path d="M 382 132 H 426 V 172" fill="none" stroke="#6E3A05" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="414" y="124" font-size="11.5" font-weight="700" fill="#6E3A05" text-anchor="middle">slope −0.5</text>

    <!-- 7-Parameter analytic enhancement curve -->
    <path d="M 364 123 L 430 183 C 463 213 496 244 529 266 C 548 276 568 280 592 281" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Lattice simulation target points on physical slices -->
    <g fill="#FFFFFF" stroke="#0A0E17" stroke-width="2">
      <circle cx="463" cy="211" r="3.8"/>
      <circle cx="480" cy="229" r="3.8"/>
      <circle cx="496" cy="246" r="3.8"/>
      <circle cx="513" cy="258" r="3.8"/>
      <circle cx="529" cy="267" r="3.8"/>
      <circle cx="546" cy="274" r="3.8"/>
      <circle cx="562" cy="278" r="3.8"/>
      <circle cx="585" cy="280" r="3.8"/>
    </g>

    <!-- Top-right legend in open air -->
    <line x1="490" y1="104" x2="512" y2="104" stroke="#D97706" stroke-width="3.2" stroke-linecap="round"/>
    <text x="519" y="108" font-size="11.5" font-weight="600" fill="#0A0E17">7-param fit</text>
    <circle cx="501" cy="124" r="3.8" fill="#FFFFFF" stroke="#0A0E17" stroke-width="2"/>
    <text x="519" y="128" font-size="11.5" font-weight="500" fill="#475569">Lattice slices</text>

    <!-- Axis Ticks & Labels -->
    <text x="358" y="82" font-size="13" font-weight="600" fill="#0A0E17">ξ = ρ<tspan font-size="11.5" dy="2.5">PT</tspan><tspan dy="-2.5"> / ρ</tspan><tspan font-size="11.5" dy="2.5">noPT</tspan></text>
    <text x="356" y="166" font-size="11.5" fill="#475569" text-anchor="end">100</text>
    <text x="356" y="226" font-size="11.5" fill="#475569" text-anchor="end">10</text>
    <text x="356" y="286" font-size="11.5" fill="#475569" text-anchor="end">1</text>

    <line x1="364" y1="298" x2="364" y2="303" stroke="#475569" stroke-width="1.5"/>
    <line x1="463" y1="298" x2="463" y2="303" stroke="#475569" stroke-width="1.5"/>
    <line x1="562" y1="298" x2="562" y2="303" stroke="#475569" stroke-width="1.5"/>
    <text x="364" y="318" font-size="11.5" fill="#475569" text-anchor="middle">1e−6</text>
    <text x="463" y="318" font-size="11.5" fill="#475569" text-anchor="middle">1e−3</text>
    <text x="562" y="318" font-size="11.5" fill="#475569" text-anchor="middle">1</text>
    <text x="480" y="340" font-size="13" font-weight="600" fill="#0A0E17" text-anchor="middle">H* / M<tspan font-size="11.5" dy="2.5">φ</tspan></text>

    <!-- Footer (y=378) -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
    <text x="28" y="378" font-size="12.5" fill="#475569">≤7 Global Constants · (H*/M<tspan font-size="11.5" dy="2">φ</tspan><tspan dy="-2">, v</tspan><tspan font-size="11.5" dy="2">w</tspan><tspan dy="-2">, β/H*, θ</tspan><tspan font-size="11.5" dy="2">0</tspan><tspan dy="-2">)</tspan></text>
    <text x="612" y="378" font-size="12.5" fill="#475569" text-anchor="end">Metric: <tspan font-weight="700" fill="#D97706">log_rmse ↓</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>
</svg>
