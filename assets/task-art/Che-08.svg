<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>ChemSpaceViz — Cluster-Local Chemical Space Visualization</title>
  <desc>Fixed BitBIRCH clusters of 1024-bit ECFP4 molecular fingerprints are embedded into 2D layouts that preserve local Tanimoto neighborhoods, maximizing the co-ranking QNN neighborhood-preservation AUC over PCA.</desc>
  <defs>
    <clipPath id="chemspace-card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="chemspace-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="58%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="chemspace-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="chemspace-cluster-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#FFEDD5" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="chemspace-auc-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="chemspace-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6E2707" fill-opacity="0.15"/>
    </pattern>
    <marker id="chemspace-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1 1.5L9 5L1 8.5Z" fill="#059669"/>
    </marker>
  </defs>

  <g clip-path="url(#chemspace-card-clip)">
    <rect width="640" height="400" fill="url(#chemspace-bg)"/>
    <rect x="28" y="60" width="584" height="294" fill="url(#chemspace-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#chemspace-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="37" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">ChemSpaceViz</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Cluster-Local Chemical Space Layout</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top-left ECFP4 1024-bit Fingerprint Strip -->
  <rect x="36" y="72" width="106" height="22" rx="5" fill="#FFFFFF" stroke="#6E2707" stroke-width="1.5"/>
  <g>
    <rect x="42" y="76" width="5" height="14" rx="1" fill="#EA580C"/>
    <rect x="50" y="76" width="3" height="14" rx="1" fill="#6E2707"/>
    <rect x="58" y="76" width="6" height="14" rx="1" fill="#EA580C"/>
    <rect x="69" y="76" width="4" height="14" rx="1" fill="#F97316"/>
    <rect x="77" y="76" width="3" height="14" rx="1" fill="#6E2707"/>
    <rect x="84" y="76" width="6" height="14" rx="1" fill="#EA580C"/>
    <rect x="95" y="76" width="4" height="14" rx="1" fill="#6E2707"/>
    <rect x="103" y="76" width="5" height="14" rx="1" fill="#F97316"/>
    <rect x="113" y="76" width="3" height="14" rx="1" fill="#6E2707"/>
    <rect x="120" y="76" width="6" height="14" rx="1" fill="#EA580C"/>
    <rect x="131" y="76" width="5" height="14" rx="1" fill="#6E2707"/>
  </g>
  <text x="150" y="87" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#6E2707">ECFP4 · 1024-bit</text>
  <path d="M90 95 C92 118 122 128 144 150" fill="none" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- Left/Center Hero: 2D Fixed BitBIRCH Chemical Space Constellation -->
  <!-- Cluster 4: Small Far-Left Satellite -->
  <path d="M44 268 C54 248 84 252 90 272 C95 292 78 312 58 308 C40 304 36 284 44 268 Z" fill="#FFEDD5" fill-opacity="0.58" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g stroke="#FFFFFF" stroke-width="1.2">
    <circle cx="58" cy="272" r="3.8" fill="#6E2707"/>
    <circle cx="74" cy="268" r="3.8" fill="#EA580C"/>
    <circle cx="78" cy="286" r="3.8" fill="#F97316"/>
    <circle cx="62" cy="294" r="3.8" fill="#EA580C"/>
    <circle cx="50" cy="284" r="3.5" fill="#6E2707"/>
  </g>

  <!-- Cluster 1: Focal Hero Cluster with Local k-NN Star & Rank Rings -->
  <path d="M108 168 C134 126 218 126 244 170 C266 208 248 276 196 292 C142 308 88 266 94 214 C96 192 100 180 108 168 Z" fill="url(#chemspace-cluster-glow)" stroke="#EA580C" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Concentric Euclidean neighborhood rank circles -->
  <circle cx="174" cy="216" r="34" fill="none" stroke="#EA580C" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="174" cy="216" r="60" fill="none" stroke="#F97316" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="3 4"/>
  <!-- Preserved local Tanimoto k-NN edges -->
  <g stroke="#EA580C" stroke-width="2.2" stroke-linecap="round">
    <line x1="174" y1="216" x2="148" y2="196"/>
    <line x1="174" y1="216" x2="198" y2="192"/>
    <line x1="174" y1="216" x2="206" y2="220"/>
    <line x1="174" y1="216" x2="184" y2="248"/>
    <line x1="174" y1="216" x2="146" y2="236"/>
    <line x1="174" y1="216" x2="170" y2="183"/>
  </g>
  <!-- Secondary cluster links -->
  <g stroke="#F97316" stroke-opacity="0.42" stroke-width="1.3">
    <line x1="148" y1="196" x2="122" y2="176"/>
    <line x1="198" y1="192" x2="224" y2="172"/>
    <line x1="206" y1="220" x2="232" y2="240"/>
    <line x1="184" y1="248" x2="196" y2="274"/>
    <line x1="146" y1="236" x2="118" y2="254"/>
    <line x1="170" y1="183" x2="160" y2="152"/>
  </g>
  <!-- Outer cluster nodes -->
  <g stroke="#FFFFFF" stroke-width="1.4">
    <circle cx="122" cy="176" r="4.2" fill="#6E2707"/>
    <circle cx="160" cy="152" r="4.2" fill="#F97316"/>
    <circle cx="224" cy="172" r="4.2" fill="#6E2707"/>
    <circle cx="232" cy="240" r="4.2" fill="#F97316"/>
    <circle cx="196" cy="274" r="4.2" fill="#6E2707"/>
    <circle cx="118" cy="254" r="4.2" fill="#F97316"/>
    <circle cx="114" cy="214" r="3.8" fill="#6E2707"/>
    <circle cx="234" cy="204" r="3.8" fill="#6E2707"/>
  </g>
  <!-- Top-k neighbor nodes -->
  <g stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="148" cy="196" r="5" fill="#EA580C"/>
    <circle cx="198" cy="192" r="5" fill="#EA580C"/>
    <circle cx="206" cy="220" r="5" fill="#EA580C"/>
    <circle cx="184" cy="248" r="5" fill="#EA580C"/>
    <circle cx="146" cy="236" r="5" fill="#EA580C"/>
    <circle cx="170" cy="183" r="5" fill="#EA580C"/>
  </g>
  <!-- Focal molecule -->
  <circle cx="174" cy="216" r="11" fill="#EA580C" fill-opacity="0.22"/>
  <circle cx="174" cy="216" r="6.5" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
  <text x="174" y="318" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#EA580C">Tanimoto k-NN</text>

  <!-- Cluster 2: Upper-Right Cluster -->
  <path d="M276 126 C294 98 354 98 370 128 C384 156 364 190 326 192 C286 194 260 156 276 126 Z" fill="#FFEDD5" fill-opacity="0.62" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5 3"/>
  <g stroke="#F97316" stroke-opacity="0.45" stroke-width="1.4">
    <line x1="296" y1="142" x2="322" y2="128"/>
    <line x1="322" y1="128" x2="348" y2="140"/>
    <line x1="322" y1="128" x2="318" y2="162"/>
    <line x1="348" y1="140" x2="342" y2="168"/>
    <line x1="296" y1="142" x2="318" y2="162"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.4">
    <circle cx="296" cy="142" r="4.5" fill="#EA580C"/>
    <circle cx="322" cy="128" r="4.8" fill="#6E2707"/>
    <circle cx="348" cy="140" r="4.5" fill="#EA580C"/>
    <circle cx="318" cy="162" r="4.5" fill="#F97316"/>
    <circle cx="342" cy="168" r="4.2" fill="#6E2707"/>
    <circle cx="332" cy="114" r="3.8" fill="#F97316"/>
    <circle cx="290" cy="164" r="3.8" fill="#6E2707"/>
  </g>
  <text x="324" y="88" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#6E2707">BitBIRCH Clusters</text>

  <!-- Cluster 3: Lower-Right Cluster -->
  <path d="M276 254 C294 222 358 220 376 254 C390 284 366 324 324 326 C282 328 258 286 276 254 Z" fill="#FFEDD5" fill-opacity="0.62" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5 3"/>
  <g stroke="#F97316" stroke-opacity="0.45" stroke-width="1.4">
    <line x1="296" y1="272" x2="326" y2="256"/>
    <line x1="326" y1="256" x2="354" y2="274"/>
    <line x1="326" y1="256" x2="322" y2="294"/>
    <line x1="354" y1="274" x2="346" y2="304"/>
    <line x1="296" y1="272" x2="322" y2="294"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.4">
    <circle cx="296" cy="272" r="4.5" fill="#6E2707"/>
    <circle cx="326" cy="256" r="4.8" fill="#EA580C"/>
    <circle cx="354" cy="274" r="4.5" fill="#F97316"/>
    <circle cx="322" cy="294" r="4.5" fill="#EA580C"/>
    <circle cx="346" cy="304" r="4.2" fill="#6E2707"/>
    <circle cx="302" cy="304" r="3.8" fill="#F97316"/>
    <circle cx="350" cy="248" r="3.8" fill="#6E2707"/>
  </g>

  <!-- Right Panel: Co-Ranking QNN(k) Neighborhood-Preservation AUC -->
  <text x="444" y="88" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">QNN(k)</text>
  <text x="598" y="88" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">1.0</text>

  <!-- Shaded AUC under optimized layout curve -->
  <path d="M444 304 L444 282 C456 202 476 146 510 124 C542 106 572 104 598 102 L598 304 Z" fill="url(#chemspace-auc-fill)"/>

  <!-- Axes -->
  <line x1="444" y1="100" x2="444" y2="304" stroke="#475569" stroke-width="1.8"/>
  <line x1="444" y1="304" x2="600" y2="304" stroke="#475569" stroke-width="1.8"/>
  <line x1="444" y1="102" x2="598" y2="102" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Random baseline diagonal -->
  <line x1="444" y1="304" x2="598" y2="102" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- Baseline PCA curve -->
  <path d="M444 294 C466 244 494 188 532 150 C556 126 578 112 598 102" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="530" y="175" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">PCA</text>

  <!-- Optimized Layout curve -->
  <path d="M444 282 C456 202 476 146 510 124 C542 106 572 104 598 102" fill="none" stroke="#EA580C" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Improvement gain arrow -->
  <line x1="494" y1="192" x2="494" y2="144" stroke="#059669" stroke-width="2.4" marker-end="url(#chemspace-arrow-green)"/>

  <text x="526" y="252" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#6E2707">AUC</text>
  <text x="521" y="328" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Rank k (1 → n−1)</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">Fixed BitBIRCH Partition · Co-Ranking</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#EA580C">auc_mean ↑</tspan></text>
</svg>
