<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>CLASP — Online Convex Learning With Squared Constraint Penalties</title>
  <desc>An online iterate inside the unit hypercube descends quadratic loss contours and projects orthogonally onto a moving linear constraint half-space to minimize squared cumulative constraint violation.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <clipPath id="box-clip">
      <rect x="44" y="84" width="354" height="240" rx="9"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="quad-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#261E6B" opacity="0.15"/>
    </pattern>
    <marker id="arrow-ind" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#059669"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="0" y="54" width="640" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#top-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="36" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">CLASP</text>
  <text x="612" y="35" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Online Convex Learning &amp; Squared Penalties</text>
  <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Zone 1: Convex Unit Hypercube [0,1]^10 Geometry -->
  <g id="convex-box">
    <rect x="44" y="84" width="354" height="240" rx="9" fill="#FFFFFF" stroke="#261E6B" stroke-width="2.2"/>

    <g clip-path="url(#box-clip)">
      <!-- Feasible vs Infeasible half-spaces split along active line (150,84) -> (360,324) -->
      <polygon points="44,84 150,84 360,324 44,324" fill="#059669" fill-opacity="0.06"/>
      <polygon points="150,84 398,84 398,324 360,324" fill="#E11D48" fill-opacity="0.09"/>

      <!-- Quadratic loss level-set ellipses centered at x*_t (342, 168) -->
      <g transform="translate(342 168) rotate(-20)">
        <ellipse cx="0" cy="0" rx="176" ry="112" fill="#E0E7FF" fill-opacity="0.28" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.55"/>
        <ellipse cx="0" cy="0" rx="128" ry="80" fill="#E0E7FF" fill-opacity="0.34" stroke="#8B5CF6" stroke-width="1.4" stroke-opacity="0.7"/>
        <ellipse cx="0" cy="0" rx="82" ry="50" fill="#4F46E5" fill-opacity="0.09" stroke="#4F46E5" stroke-width="1.6" stroke-opacity="0.82"/>
        <ellipse cx="0" cy="0" rx="38" ry="23" fill="#4F46E5" fill-opacity="0.16" stroke="#4F46E5" stroke-width="1.8"/>
      </g>

      <!-- Previous round constraint hyperplane (dashed) -->
      <line x1="110" y1="84" x2="310" y2="324" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="5 4" stroke-opacity="0.6"/>

      <!-- Active round-t linear constraint hyperplane A_t x = b_t -->
      <line x1="150" y1="84" x2="360" y2="324" stroke="#E11D48" stroke-width="2.8"/>

      <!-- Orthogonal projection right-angle square at x_{t+1} = (257.6, 207.9) -->
      <polyline points="264.4,201.9 270.3,208.7 263.6,214.6" fill="none" stroke="#059669" stroke-width="1.7"/>

      <!-- Historical online trajectory x_0 -> x_1 -> x_2 -> x_t -->
      <polyline points="82,286 124,258 170,238 214,218 258,180" fill="none" stroke="#261E6B" stroke-width="2.2" stroke-dasharray="4 3" stroke-opacity="0.75"/>
      <g fill="#261E6B">
        <circle cx="82" cy="286" r="4"/>
        <circle cx="124" cy="258" r="3.8"/>
        <circle cx="170" cy="238" r="3.8"/>
        <circle cx="214" cy="218" r="3.8"/>
      </g>

      <!-- Current violation distance segment v_t from x_t(258,180) to foot(243.9,192.4) -->
      <line x1="258" y1="180" x2="243.9" y2="192.4" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round"/>

      <!-- Gradient descent step: x_t(258,180) -> z_t(296,174) -->
      <line x1="258" y1="180" x2="292" y2="174.6" stroke="#4F46E5" stroke-width="2.8" marker-end="url(#arrow-ind)"/>

      <!-- Orthogonal Euclidean projection: z_t(296,174) -> x_{t+1}(257.6,207.9) -->
      <line x1="296" y1="174" x2="262" y2="204" stroke="#059669" stroke-width="2.8" marker-end="url(#arrow-grn)"/>

      <!-- Key points -->
      <circle cx="342" cy="168" r="5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="258" cy="180" r="6" fill="#261E6B" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="296" cy="174" r="4.8" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.6"/>
      <circle cx="257.6" cy="207.9" r="6.2" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Non-overlapping geometric labels -->
    <text x="58" y="106" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">[0, 1]¹⁰</text>
    <text x="386" y="106" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">Infeasible Aₜx &gt; bₜ</text>
    <text x="122" y="310" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Feasible Aₜx ≤ bₜ</text>

    <text x="252" y="164" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">xₜ</text>
    <text x="298" y="156" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">−η∇fₜ</text>
    <text x="355" y="172" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#4F46E5">x*</text>
    <text x="295" y="206" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">Π</text>
    <text x="242" y="226" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">xₜ₊₁</text>
    <text x="228" y="185" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">vₜ</text>

    <text x="221" y="344" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">Gradient Descent + Half-Space Projection</text>
  </g>

  <!-- Zone 2: Squared Violation Penalty (CCV2) + Safety Guards -->
  <g id="penalty-panel">
    <!-- Squared vs Linear Penalty Card -->
    <rect x="418" y="84" width="194" height="168" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <!-- Axes -->
    <line x1="440" y1="222" x2="594" y2="222" stroke="#475569" stroke-width="1.4"/>
    <line x1="440" y1="102" x2="440" y2="222" stroke="#475569" stroke-width="1.4"/>

    <!-- Linear CCV1 reference line -->
    <line x1="440" y1="222" x2="590" y2="162" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- Quadratic CCV2 area & parabola -->
    <path d="M 440 222 Q 526 220 578 106 L 578 222 Z" fill="url(#quad-fill)"/>
    <path d="M 440 222 Q 526 220 578 106" fill="none" stroke="#4F46E5" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Large violation spike vs suppressed point -->
    <circle cx="561" cy="136" r="5" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="488" cy="212" r="5" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>
    <path d="M 552 142 Q 520 162 496 203" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-grn)"/>

    <text x="452" y="122" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">vₜ² (CCV2)</text>
    <text x="594" y="196" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#8B5CF6">vₜ (CCV1)</text>
    <text x="517" y="242" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Constraint Violation vₜ</text>

    <!-- Two Compact Guard Badges -->
    <rect x="418" y="264" width="194" height="26" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <rect x="418" y="264" width="5" height="26" rx="2.5" fill="#059669"/>
    <text x="434" y="281" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#261E6B">Loss Guard ≤ 1.01×</text>

    <rect x="418" y="298" width="194" height="26" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <rect x="418" y="298" width="5" height="26" rx="2.5" fill="#4F46E5"/>
    <text x="434" y="315" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#261E6B">CCV1 Guard ≤ 1.05×</text>

    <text x="515" y="344" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">Squared Penalty Focus</text>
  </g>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Online convex box [0,1]¹⁰ · k=4 constraints · T=100</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5"><tspan fill="#475569">Target: </tspan><tspan font-weight="700" fill="#4F46E5">ccv2 ↓</tspan></text>
</svg>
