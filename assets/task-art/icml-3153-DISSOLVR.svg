<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>DISSOLVR: Interpretable Explicit Descriptors for Aqueous Solubility</title>
  <desc>An organic molecule in aqueous solution is mapped to four explicit physical descriptor groups and five independent gradient-boosted tree regressors predicting logS along a parity plot with experimental noise floor.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="water-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#EA580C" opacity="0.16"/>
    </pattern>
    <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0.5 0.5 L6.5 3.5 L0.5 6.5 Z" fill="#EA580C"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Plate Background -->
    <rect width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="0" y="54" width="640" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="#EA580C"/>

    <!-- Header -->
    <text x="28" y="36" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">DISSOLVR</text>
    <text x="612" y="36" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Interpretable Molecular Solubility Regression</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Left Panel: Molecular Structure & Aqueous Phase -->
    <rect x="28" y="70" width="186" height="276" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1"/>
    <text x="42" y="90" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Molecular SMILES</text>

    <!-- 2D Kekule Aromatic Molecule -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Benzene Ring -->
      <polygon points="108,148 136,164 136,196 108,212 80,196 80,164" fill="#FFF8F3" stroke="#0A0E17" stroke-width="2.8"/>
      <!-- Aromatic Inner Double Bonds -->
      <line x1="108" y1="156" x2="129" y2="168" stroke="#6E2707" stroke-width="2"/>
      <line x1="129" y1="192" x2="108" y2="204" stroke="#6E2707" stroke-width="2"/>
      <line x1="87" y1="192" x2="87" y2="168" stroke="#6E2707" stroke-width="2"/>

      <!-- Carboxylic / Hydroxyl Branch -->
      <line x1="136" y1="164" x2="162" y2="149" stroke="#0A0E17" stroke-width="2.6"/>
      <line x1="159" y1="149" x2="159" y2="122" stroke="#EA580C" stroke-width="2.2"/>
      <line x1="165" y1="149" x2="165" y2="122" stroke="#EA580C" stroke-width="2.2"/>
      <line x1="162" y1="149" x2="184" y2="162" stroke="#0A0E17" stroke-width="2.6"/>

      <!-- Amino Branch -->
      <line x1="80" y1="196" x2="56" y2="210" stroke="#0A0E17" stroke-width="2.6"/>
      <!-- Methyl Branch -->
      <line x1="80" y1="164" x2="62" y2="153" stroke="#0A0E17" stroke-width="2.4"/>
    </g>

    <!-- Heteroatom Halos -->
    <circle cx="162" cy="116" r="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
    <text x="162" y="121" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#EA580C">O</text>

    <rect x="174" y="154" width="32" height="22" rx="11" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
    <text x="190" y="169" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#EA580C">OH</text>

    <rect x="35" y="202" width="36" height="22" rx="11" fill="#6E2707" fill-opacity="0.10" stroke="#6E2707" stroke-width="1.4"/>
    <text x="53" y="217" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#6E2707">NH₂</text>

    <text x="46" y="148" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">CH₃</text>

    <!-- Aqueous Solvent Wave Zone -->
    <path d="M 38 256 C 64 246 88 266 118 256 C 148 246 174 264 204 256 L 204 298 C 204 302 200 306 196 306 L 46 306 C 42 306 38 302 38 298 Z" fill="url(#water-grad)"/>
    <path d="M 38 256 C 64 246 88 266 118 256 C 148 246 174 264 204 256" fill="none" stroke="#EA580C" stroke-width="2"/>
    <circle cx="72" cy="276" r="3.2" fill="#F97316" opacity="0.6"/>
    <circle cx="152" cy="274" r="3.8" fill="#EA580C" opacity="0.5"/>
    <circle cx="176" cy="288" r="2.8" fill="#F97316" opacity="0.65"/>
    <text x="121" y="292" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#6E2707">Aqueous Phase (H₂O)</text>

    <!-- Explicit Feature Pill -->
    <rect x="44" y="314" width="154" height="22" rx="11" fill="#6E2707"/>
    <text x="121" y="329" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">176 Explicit Features</text>

    <!-- Arrow Left -> Center -->
    <line x1="214" y1="146" x2="229" y2="146" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arr-orange)"/>

    <!-- Center Top Card: 4 Physical Descriptor Groups -->
    <rect x="234" y="70" width="180" height="148" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1"/>
    <text x="248" y="90" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">4 Physical Groups</text>

    <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
      <text x="248" y="109" font-weight="700" fill="#EA580C">Physicochemical (42)</text>
      <rect x="248" y="114" width="152" height="8" rx="4" fill="#FFEDD5"/>
      <rect x="248" y="114" width="144" height="8" rx="4" fill="#EA580C"/>

      <text x="248" y="136" font-weight="600" fill="#0A0E17">Compositional (109)</text>
      <rect x="248" y="141" width="152" height="8" rx="4" fill="#FFEDD5"/>
      <rect x="248" y="141" width="116" height="8" rx="4" fill="#F97316"/>

      <text x="248" y="163" font-weight="600" fill="#475569">Topological (19)</text>
      <rect x="248" y="168" width="152" height="8" rx="4" fill="#FFEDD5"/>
      <rect x="248" y="168" width="76" height="8" rx="4" fill="#6E2707"/>

      <text x="248" y="190" font-weight="600" fill="#475569">Energetic (6)</text>
      <rect x="248" y="195" width="152" height="8" rx="4" fill="#FFEDD5"/>
      <rect x="248" y="195" width="52" height="8" rx="4" fill="#475569"/>
    </g>

    <!-- Arrow Top -> Bottom Center -->
    <line x1="324" y1="218" x2="324" y2="230" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-orange)"/>

    <!-- Center Bottom Card: Boosted Trees x5 -->
    <rect x="234" y="234" width="180" height="112" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1"/>
    <text x="248" y="254" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">GBDT Regressors</text>

    <!-- Decision Tree Schematic -->
    <g stroke="#6E2707" stroke-width="1.8">
      <line x1="296" y1="274" x2="270" y2="298"/>
      <line x1="296" y1="274" x2="322" y2="298"/>
      <line x1="270" y1="298" x2="254" y2="322"/>
      <line x1="270" y1="298" x2="284" y2="322"/>
      <line x1="322" y1="298" x2="308" y2="322"/>
      <line x1="322" y1="298" x2="338" y2="322"/>
    </g>
    <circle cx="296" cy="274" r="6.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="270" cy="298" r="5.5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="322" cy="298" r="5.5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
    <g fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5">
      <rect x="248" y="317" width="12" height="12" rx="3"/>
      <rect x="278" y="317" width="12" height="12" rx="3"/>
      <rect x="302" y="317" width="12" height="12" rx="3"/>
      <rect x="332" y="317" width="12" height="12" rx="3"/>
    </g>

    <!-- 5 Independent Seed Bars -->
    <g>
      <rect x="364" y="268" width="34" height="7" rx="3.5" fill="#EA580C"/>
      <rect x="364" y="279" width="34" height="7" rx="3.5" fill="#F97316"/>
      <rect x="364" y="290" width="34" height="7" rx="3.5" fill="#EA580C"/>
      <rect x="364" y="301" width="34" height="7" rx="3.5" fill="#F97316"/>
      <rect x="364" y="312" width="34" height="7" rx="3.5" fill="#6E2707"/>
      <text x="381" y="335" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">5 seeds</text>
    </g>

    <!-- Arrow Center -> Right -->
    <line x1="414" y1="290" x2="429" y2="290" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arr-orange)"/>

    <!-- Right Panel: Parity Plot (Predicted vs Observed logS) -->
    <rect x="434" y="70" width="178" height="276" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1"/>
    <text x="448" y="90" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">logS Parity Plot</text>

    <!-- Noise Floor Band around Diagonal -->
    <polygon points="464,274 574,116 596,116 596,142 486,296 464,296" fill="#FFEDD5" fill-opacity="0.7"/>

    <!-- Parity Axes -->
    <line x1="464" y1="112" x2="464" y2="296" stroke="#475569" stroke-width="1.6"/>
    <line x1="464" y1="296" x2="598" y2="296" stroke="#475569" stroke-width="1.6"/>

    <!-- y = x Identity Diagonal -->
    <line x1="468" y1="291" x2="592" y2="118" stroke="#0A0E17" stroke-width="1.6" stroke-dasharray="5 4"/>

    <!-- Residual Error Ticks -->
    <g stroke="#E11D48" stroke-width="1.8">
      <line x1="494" y1="242" x2="494" y2="255"/>
      <line x1="538" y1="210" x2="538" y2="194"/>
      <line x1="566" y1="142" x2="566" y2="155"/>
    </g>

    <!-- Scatter Points -->
    <g fill="#EA580C" stroke="#FFFFFF" stroke-width="1.3">
      <circle cx="478" cy="276" r="4"/>
      <circle cx="486" cy="268" r="4" fill="#F97316"/>
      <circle cx="494" cy="242" r="4"/>
      <circle cx="505" cy="240" r="4" fill="#F97316"/>
      <circle cx="514" cy="222" r="4"/>
      <circle cx="523" cy="216" r="4" fill="#F97316"/>
      <circle cx="530" cy="202" r="4"/>
      <circle cx="538" cy="210" r="4"/>
      <circle cx="548" cy="176" r="4" fill="#F97316"/>
      <circle cx="557" cy="170" r="4"/>
      <circle cx="566" cy="142" r="4"/>
      <circle cx="576" cy="146" r="4" fill="#F97316"/>
      <circle cx="584" cy="128" r="4"/>
    </g>

    <!-- Parity Annotations -->
    <text x="472" y="130" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6E2707">±0.7 floor</text>
    <text x="592" y="286" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">y = x</text>

    <text x="531" y="316" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Observed logS</text>
    <text x="451" y="204" text-anchor="middle" transform="rotate(-90 451 204)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Predicted logS</text>
    <text x="531" y="335" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#EA580C">log₁₀(mol/L)</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <text x="28" y="378" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">AqSolDB scaffold split · 5 independent models</text>
    <text x="612" y="378" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
      <tspan fill="#475569">Target: </tspan><tspan font-weight="700" fill="#EA580C">rmse ↓</tspan>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.75"/>
</svg>
