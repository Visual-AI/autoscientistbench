<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>CtrlConsist — Control Consistency Losses for Diffusion Bridges</title>
  <desc>Controlled Cox-Ingersoll-Ross diffusion bridge paths pinned at X0=2 and X1=2 align to the true bridge law P* via backward self-consistency targets over state-dependent square-root volatility above the X=0 barrier.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#261E6B" opacity="0.16"/>
    </pattern>
    <marker id="arrInd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 L3,5 Z" fill="#4F46E5"/>
    </marker>
    <marker id="arrVio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.5 L9,5 L1,8.5 L3,5 Z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Base Card -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="20" y="60" width="600" height="294" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accentGrad)"/>
  </g>
  <rect x="0.75" y="0.75" width="638.5" height="398.5" rx="15.25" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Top Header -->
  <text x="28" y="38" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.2">CtrlConsist</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">CIR Diffusion Bridge Control</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

  <!-- SDE Formula Pill & Legend -->
  <rect x="414" y="68" width="196" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="512" y="85" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#261E6B">dXₜ = (1−Xₜ)dt + √Xₜ dWₜ</text>

  <rect x="74" y="68" width="136" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="86" y1="81" x2="104" y2="81" stroke="#4F46E5" stroke-width="2.8"/>
  <text x="110" y="85" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">Pθ</text>
  <line x1="142" y1="81" x2="162" y2="81" stroke="#059669" stroke-width="2.4" stroke-dasharray="4 3"/>
  <text x="168" y="85" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">P*</text>

  <!-- Coordinate Axes & Positivity Barrier X = 0 -->
  <rect x="66" y="314" width="516" height="14" fill="#261E6B" fill-opacity="0.06"/>
  <line x1="66" y1="314" x2="582" y2="314" stroke="#261E6B" stroke-opacity="0.55" stroke-width="1.8"/>
  <line x1="66" y1="314" x2="66" y2="100" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="582" y1="314" x2="582" y2="100" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- Subtle Mean Reference b = 1 -->
  <line x1="66" y1="242" x2="582" y2="242" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="58" y="246" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">1</text>
  <text x="58" y="172" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#261E6B">2</text>
  <text x="58" y="318" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">0</text>

  <!-- Uncontrolled CIR Drift Paths (drifting down toward mean b=1, missing X1=2) -->
  <g fill="none" stroke="#E11D48" stroke-width="1.9" stroke-dasharray="5 3.5" stroke-opacity="0.78">
    <path d="M66,168 L112,196 L160,232 L214,264 L276,278 L342,286 L412,276 L484,288 L582,282"/>
    <path d="M66,168 L118,190 L172,224 L232,254 L296,268 L364,270 L432,262 L504,270 L582,256"/>
  </g>
  <text x="512" y="304" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">Uncontrolled CIR</text>

  <!-- Controlled Bridge Density Envelope (Pinched Spindle X0=2 -> X1=2) -->
  <path d="M66,168 C178,108 470,108 582,168 C470,238 178,238 66,168 Z" fill="url(#bridgeGrad)" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Stochastic Bridge Sample Trajectories -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66,168 L110,152 L156,136 L206,144 L256,126 L312,134 L366,128 L422,144 L476,138 L528,154 L582,168" stroke="#8B5CF6" stroke-width="1.6" stroke-opacity="0.62"/>
    <path d="M66,168 L116,160 L166,148 L218,162 L272,150 L328,166 L384,152 L438,160 L490,148 L538,162 L582,168" stroke="#4F46E5" stroke-width="1.6" stroke-opacity="0.55"/>
    <path d="M66,168 L114,180 L164,196 L216,184 L268,206 L324,196 L378,210 L432,194 L486,202 L536,184 L582,168" stroke="#8B5CF6" stroke-width="1.6" stroke-opacity="0.62"/>
    <path d="M66,168 L118,174 L170,186 L224,174 L280,192 L336,180 L392,194 L446,182 L498,188 L544,176 L582,168" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Mean Controlled Bridge P_theta & True Bridge P* -->
  <path d="M66,168 C206,186 442,186 582,168" fill="none" stroke="#4F46E5" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M66,168 C206,180 442,180 582,168" fill="none" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- Forward Rollout & Backward Consistency Arcs -->
  <path d="M196,120 Q324,98 452,120" fill="none" stroke="#8B5CF6" stroke-width="2.2" marker-end="url(#arrVio)"/>
  <text x="312" y="92" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#8B5CF6">Forward SDE Rollout</text>

  <path d="M448,218 Q324,242 200,218" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrInd)"/>
  <rect x="234" y="236" width="180" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.94" stroke="#4F46E5" stroke-opacity="0.35" stroke-width="1"/>
  <text x="324" y="250" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">Backward Consistency Targets</text>

  <!-- Pinned Endpoint Anchors (X0=2 and X1=2) -->
  <circle cx="66" cy="168" r="7.5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="66" cy="168" r="3" fill="#059669"/>
  <text x="80" y="140" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">X₀ = 2</text>

  <circle cx="582" cy="168" r="7.5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="582" cy="168" r="3" fill="#059669"/>
  <text x="570" y="140" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#261E6B">X₁ = 2</text>

  <!-- X-Axis Time & Barrier Labels -->
  <text x="66" y="344" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">t = 0</text>
  <text x="324" y="344" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#261E6B">Positivity Barrier X = 0 (σ = √x)</text>
  <text x="582" y="344" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">t = 1</text>

  <!-- Bottom Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
  <text x="28" y="378" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">CIR bridge · a = b = ε = 1 · 500 SDE steps</text>
  <text x="612" y="378" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
    <tspan fill="#475569" font-weight="500">Target </tspan>
    <tspan fill="#4F46E5" font-weight="700">kl_to_solution ↓</tspan>
  </text>
</svg>
