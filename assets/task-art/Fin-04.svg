<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>CAST — Cross-Asset State-Space Trading for Drawdown Control</title>
  <desc>Cross-asset price-change correlations couple multi-order Kalman state-space filters into a receding-horizon MPC controller that maximizes annualized Sharpe while guarding maximum drawdown above the NAV 200 liquidation floor.</desc>
  <defs>
    <clipPath id="cast-card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="cast-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FAFE"/>
      <stop offset="58%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cast-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cast-nav-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="cast-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0C4366" fill-opacity="0.15"/>
    </pattern>
    <marker id="cast-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1 1.5L9 5L1 8.5Z" fill="#0284C7"/>
    </marker>
    <marker id="cast-arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1.5L9 5L1 8.5Z" fill="#06B6D4"/>
    </marker>
  </defs>

  <g clip-path="url(#cast-card-clip)">
    <rect width="640" height="400" fill="url(#cast-bg)"/>
    <rect x="28" y="60" width="584" height="294" fill="url(#cast-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#cast-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="37" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">CAST</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Cross-Asset State-Space Trading</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top-Left Quadrant: Cross-Asset Correlation Matrix (rho) -->
  <text x="136" y="84" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0C4366">Cross-Asset Coupling ρ</text>

  <!-- Row tags -->
  <g text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">
    <text x="64" y="114">N</text>
    <text x="64" y="140">C</text>
    <text x="64" y="166">T</text>
    <text x="64" y="192">G</text>
  </g>
  <!-- 4x4 Symmetric Heatmap Tiles -->
  <g stroke="#FFFFFF" stroke-width="2">
    <!-- Row 1 -->
    <rect x="72" y="96" width="30" height="24" rx="4" fill="#0C4366"/>
    <rect x="104" y="96" width="30" height="24" rx="4" fill="#0284C7"/>
    <rect x="136" y="96" width="30" height="24" rx="4" fill="#06B6D4"/>
    <rect x="168" y="96" width="30" height="24" rx="4" fill="#0284C7"/>
    <!-- Row 2 -->
    <rect x="72" y="122" width="30" height="24" rx="4" fill="#0284C7"/>
    <rect x="104" y="122" width="30" height="24" rx="4" fill="#0C4366"/>
    <rect x="136" y="122" width="30" height="24" rx="4" fill="#E0F2FE"/>
    <rect x="168" y="122" width="30" height="24" rx="4" fill="#06B6D4"/>
    <!-- Row 3 -->
    <rect x="72" y="148" width="30" height="24" rx="4" fill="#06B6D4"/>
    <rect x="104" y="148" width="30" height="24" rx="4" fill="#E0F2FE"/>
    <rect x="136" y="148" width="30" height="24" rx="4" fill="#0C4366"/>
    <rect x="168" y="148" width="30" height="24" rx="4" fill="#0284C7"/>
    <!-- Row 4 -->
    <rect x="72" y="174" width="30" height="24" rx="4" fill="#0284C7"/>
    <rect x="104" y="174" width="30" height="24" rx="4" fill="#06B6D4"/>
    <rect x="136" y="174" width="30" height="24" rx="4" fill="#0284C7"/>
    <rect x="168" y="174" width="30" height="24" rx="4" fill="#0C4366"/>
  </g>

  <!-- Feed arrow from correlation matrix down to Kalman filter -->
  <line x1="136" y1="202" x2="136" y2="226" stroke="#0284C7" stroke-width="2" marker-end="url(#cast-arrow-blue)"/>

  <!-- Bottom-Left Quadrant: Receding-Horizon State-Space Control Loop -->
  <rect x="52" y="232" width="168" height="36" rx="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="136" y="255" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0C4366">Kalman IRW Filter</text>

  <rect x="52" y="298" width="168" height="36" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="136" y="321" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0284C7">MPC Horizon L=7</text>

  <!-- Control feedback loop arcs -->
  <path d="M222 252 C240 264 240 298 224 310" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#cast-arrow-blue)"/>
  <path d="M50 314 C32 302 32 266 48 254" fill="none" stroke="#06B6D4" stroke-width="2" marker-end="url(#cast-arrow-cyan)"/>
  <!-- Action feed into market panel -->
  <line x1="240" y1="282" x2="294" y2="282" stroke="#0284C7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#cast-arrow-blue)"/>
  <text x="266" y="274" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0284C7">uₜ</text>

  <!-- Right Half Hero: Portfolio NAV Trajectory + Receding-Horizon Fan + Stop Floor -->
  <text x="454" y="84" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">NAV Trajectory &amp; Drawdown Guard</text>

  <!-- Stop liquidation zone below NAV 200 -->
  <rect x="304" y="296" width="300" height="24" fill="#E11D48" fill-opacity="0.09"/>

  <!-- Axes & Reference Lines -->
  <line x1="304" y1="96" x2="304" y2="320" stroke="#475569" stroke-width="1.8"/>
  <line x1="304" y1="320" x2="606" y2="320" stroke="#475569" stroke-width="1.8"/>
  <!-- Initial NAV 1000 line -->
  <line x1="304" y1="232" x2="604" y2="232" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="298" y="236" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">1000</text>
  <!-- Liquidation stop floor NAV 200 -->
  <line x1="304" y1="296" x2="604" y2="296" stroke="#E11D48" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="598" y="289" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">Stop Floor · 200</text>

  <!-- Uncontrolled Drawdown Reference Curve -->
  <path d="M304 232 C328 216 352 178 372 178 C394 178 416 266 440 266 C464 266 492 222 522 214" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Drawdown bracket -->
  <line x1="440" y1="180" x2="440" y2="262" stroke="#E11D48" stroke-width="1.6"/>
  <line x1="435" y1="180" x2="445" y2="180" stroke="#E11D48" stroke-width="1.6"/>
  <line x1="435" y1="262" x2="445" y2="262" stroke="#E11D48" stroke-width="1.6"/>
  <text x="474" y="274" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">MDD Guard</text>

  <!-- Receding-horizon L=7 forecast fan at time t -->
  <line x1="522" y1="98" x2="522" y2="320" stroke="#0284C7" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="522,138 602,98 602,178" fill="#06B6D4" fill-opacity="0.22"/>
  <path d="M522 138 Q562 124 600 112" fill="none" stroke="#0284C7" stroke-width="2.6" stroke-dasharray="5 3"/>

  <!-- CAST Controlled Equity Curve -->
  <path d="M304 232 C332 214 360 192 388 186 C410 182 422 200 440 198 C464 196 492 152 522 138 L522 232 L304 232 Z" fill="url(#cast-nav-fill)"/>
  <path d="M304 232 C332 214 360 192 388 186 C410 182 422 200 440 198 C464 196 492 152 522 138" fill="none" stroke="#059669" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Active decision point t -->
  <circle cx="522" cy="138" r="10" fill="#059669" fill-opacity="0.18"/>
  <circle cx="522" cy="138" r="5.5" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>

  <text x="450" y="136" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">CAST NAV</text>
  <text x="568" y="98" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0284C7">L=7 Fan</text>
  <text x="412" y="340" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Causal Trading Days</text>
  <text x="522" y="340" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0284C7">t</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">4 Market Panels · 30 Independent Accounts</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#0284C7">Sharpe ↑</tspan></text>
</svg>
