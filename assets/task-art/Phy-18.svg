<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>SuperIsing — Fuzzy-Sphere Conformal Spectrum Optimization</title>
  <desc>A fuzzy sphere with nine magnetic monopole flux quanta and tunable Hamiltonian parameters h, mu1, and mub matched against fourteen conformal-bootstrap scaling dimensions across spin sectors.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="sphere-grad" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="56%" stop-color="#FEF3C7" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.32"/>
    </radialGradient>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="640" height="400" rx="14"/>
    </clipPath>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6E3A05" fill-opacity="0.16"/>
    </pattern>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base canvas & grid -->
    <rect x="0" y="0" width="640" height="400" fill="url(#card-bg)"/>
    <rect x="16" y="54" width="608" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#accent-bar)"/>

    <!-- Header (y=18..54) -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.3">SuperIsing</text>
    <text x="612" y="36" font-size="12.5" font-weight="500" fill="#475569" text-anchor="end">Fuzzy-Sphere CFT Spectrum Matching</text>
    <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>

    <!-- LEFT PANEL: Fuzzy Sphere S^2 (N_mf = 9) + Parameter Sliders -->
    <text x="150" y="80" font-size="13" font-weight="600" fill="#0A0E17" text-anchor="middle">Fuzzy Sphere (N<tspan font-size="11.5" dy="2.5">mf</tspan><tspan dy="-2.5"> = 9)</tspan></text>

    <!-- Sphere body -->
    <circle cx="150" cy="178" r="80" fill="url(#sphere-grad)" stroke="#D97706" stroke-width="2.4"/>

    <!-- Quantized LLL orbital latitudes & meridians -->
    <g fill="none" stroke="#6E3A05" stroke-opacity="0.28" stroke-width="1.3">
      <ellipse cx="150" cy="178" rx="80" ry="22"/>
      <ellipse cx="150" cy="140" rx="70" ry="15"/>
      <ellipse cx="150" cy="216" rx="70" ry="15"/>
      <ellipse cx="150" cy="178" rx="34" ry="80" stroke-dasharray="4 3"/>
      <ellipse cx="150" cy="178" rx="64" ry="80" stroke-dasharray="4 3"/>
    </g>

    <!-- Central magnetic monopole & radial flux lines -->
    <g stroke="#D97706" stroke-width="1.4" stroke-opacity="0.45" stroke-dasharray="3 3">
      <line x1="150" y1="178" x2="150" y2="104"/>
      <line x1="150" y1="178" x2="218" y2="142"/>
      <line x1="150" y1="178" x2="218" y2="214"/>
      <line x1="150" y1="178" x2="150" y2="252"/>
      <line x1="150" y1="178" x2="82" y2="214"/>
      <line x1="150" y1="178" x2="82" y2="142"/>
    </g>
    <circle cx="150" cy="178" r="15" fill="#F59E0B" fill-opacity="0.26"/>
    <circle cx="150" cy="178" r="6" fill="#6E3A05" stroke="#FFFFFF" stroke-width="1.6"/>

    <!-- 9 Quantized fermion & boson orbital dots on sphere surface -->
    <g stroke="#FFFFFF" stroke-width="1.4">
      <circle cx="110" cy="146" r="4.5" fill="#D97706"/>
      <circle cx="150" cy="126" r="4.5" fill="#059669"/>
      <circle cx="192" cy="146" r="4.5" fill="#D97706"/>
      <circle cx="88" cy="184" r="4.5" fill="#D97706"/>
      <circle cx="122" cy="197" r="4.5" fill="#059669"/>
      <circle cx="180" cy="197" r="4.5" fill="#D97706"/>
      <circle cx="212" cy="184" r="4.5" fill="#D97706"/>
      <circle cx="116" cy="226" r="4.5" fill="#D97706"/>
      <circle cx="184" cy="226" r="4.5" fill="#059669"/>
    </g>

    <!-- Tunable Hamiltonian Parameter Sliders (h, mu_1, mu_b) -->
    <g>
      <!-- h slider -->
      <text x="64" y="294" font-size="13" font-weight="700" fill="#0A0E17" text-anchor="end">h</text>
      <rect x="74" y="287" width="160" height="5" rx="2.5" fill="#CBD5E1"/>
      <rect x="74" y="287" width="96" height="5" rx="2.5" fill="#D97706"/>
      <circle cx="170" cy="289.5" r="6" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>

      <!-- mu_1 slider -->
      <text x="64" y="317" font-size="13" font-weight="700" fill="#0A0E17" text-anchor="end">μ<tspan font-size="11.5" dy="2.5">1</tspan></text>
      <rect x="74" y="310" width="160" height="5" rx="2.5" fill="#CBD5E1"/>
      <rect x="74" y="310" width="58" height="5" rx="2.5" fill="#F59E0B"/>
      <circle cx="132" cy="312.5" r="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>

      <!-- mu_b slider -->
      <text x="64" y="340" font-size="13" font-weight="700" fill="#0A0E17" text-anchor="end">μ<tspan font-size="11.5" dy="2.5">b</tspan></text>
      <rect x="74" y="333" width="160" height="5" rx="2.5" fill="#CBD5E1"/>
      <rect x="74" y="333" width="122" height="5" rx="2.5" fill="#6E3A05"/>
      <circle cx="196" cy="335.5" r="6" fill="#6E3A05" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- ED Coupling Arrow -->
    <line x1="250" y1="178" x2="286" y2="178" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow-amber)"/>
    <text x="268" y="168" font-size="11.5" font-weight="700" fill="#6E3A05" text-anchor="middle">ED</text>

    <!-- RIGHT PANEL: 14-Operator Conformal Bootstrap Scaling Dimension Tower -->
    <!-- Axes -->
    <line x1="336" y1="98" x2="336" y2="306" stroke="#475569" stroke-width="1.8"/>
    <line x1="336" y1="306" x2="604" y2="306" stroke="#475569" stroke-width="1.8"/>

    <!-- Spin column vertical guides -->
    <g stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="3 4">
      <line x1="382" y1="118" x2="382" y2="306"/>
      <line x1="448" y1="118" x2="448" y2="306"/>
      <line x1="514" y1="118" x2="514" y2="306"/>
      <line x1="576" y1="118" x2="576" y2="306"/>
    </g>

    <!-- Conformal descendant ladders (Delta -> Delta+1, l -> l+1) -->
    <g fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.45" stroke-dasharray="4 3">
      <polyline points="382,286 448,252 514,218 576,184"/>
      <polyline points="382,252 448,218 514,184 576,150"/>
    </g>

    <!-- 14 Conformal Bootstrap Target Reference Bars (emerald) -->
    <g stroke="#059669" stroke-width="2.8" stroke-linecap="round">
      <!-- l = 0 (4 operators) -->
      <line x1="368" y1="286" x2="396" y2="286"/>
      <line x1="368" y1="252" x2="396" y2="252"/>
      <line x1="368" y1="176" x2="396" y2="176"/>
      <line x1="368" y1="138" x2="396" y2="138"/>
      <!-- l = 1 (4 operators) -->
      <line x1="434" y1="252" x2="462" y2="252"/>
      <line x1="434" y1="218" x2="462" y2="218"/>
      <line x1="434" y1="180" x2="462" y2="180"/>
      <line x1="434" y1="140" x2="462" y2="140"/>
      <!-- l = 2 (4 operators) -->
      <line x1="500" y1="218" x2="528" y2="218"/>
      <line x1="500" y1="204" x2="528" y2="204"/>
      <line x1="500" y1="184" x2="528" y2="184"/>
      <line x1="500" y1="150" x2="528" y2="150"/>
      <!-- l = 3 (2 operators) -->
      <line x1="562" y1="184" x2="590" y2="184"/>
      <line x1="562" y1="150" x2="590" y2="150"/>
    </g>

    <!-- Tiny crimson mismatch residuals on higher levels -->
    <g stroke="#E11D48" stroke-width="1.8">
      <line x1="382" y1="138" x2="382" y2="132"/>
      <line x1="448" y1="140" x2="448" y2="146"/>
      <line x1="514" y1="150" x2="514" y2="143"/>
      <line x1="576" y1="150" x2="576" y2="157"/>
    </g>

    <!-- 14 ED Eigenvalue Dots (amber) -->
    <g fill="#D97706" stroke="#FFFFFF" stroke-width="1.4">
      <circle cx="382" cy="286" r="4.2"/>
      <circle cx="382" cy="253" r="4.2"/>
      <circle cx="382" cy="174" r="4.2"/>
      <circle cx="382" cy="132" r="4.2"/>

      <circle cx="448" cy="252" r="4.2"/>
      <circle cx="448" cy="217" r="4.2"/>
      <circle cx="448" cy="182" r="4.2"/>
      <circle cx="448" cy="146" r="4.2"/>

      <circle cx="514" cy="219" r="4.2"/>
      <circle cx="514" cy="204" r="4.2"/>
      <circle cx="514" cy="182" r="4.2"/>
      <circle cx="514" cy="143" r="4.2"/>

      <circle cx="576" cy="185" r="4.2"/>
      <circle cx="576" cy="157" r="4.2"/>
    </g>

    <!-- Primary operator callouts -->
    <text x="360" y="290" font-size="11.5" font-weight="700" fill="#6E3A05" text-anchor="end">σ</text>
    <text x="360" y="256" font-size="11.5" font-weight="700" fill="#6E3A05" text-anchor="end">ε</text>
    <text x="495" y="210" font-size="11.5" font-weight="700" fill="#6E3A05" text-anchor="end">T</text>

    <!-- Top horizontal legend completely clear above highest level -->
    <line x1="358" y1="98" x2="380" y2="98" stroke="#059669" stroke-width="2.8" stroke-linecap="round"/>
    <text x="386" y="102" font-size="12.5" font-weight="600" fill="#0A0E17">Bootstrap Δ<tspan font-size="11.5" dy="2">ref</tspan></text>
    <circle cx="514" cy="98" r="4.2" fill="#D97706" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="524" y="102" font-size="12.5" font-weight="600" fill="#0A0E17">ED levels</text>

    <!-- Axis Labels -->
    <text x="336" y="86" font-size="13" font-weight="700" fill="#0A0E17" text-anchor="middle">Δ</text>
    <text x="328" y="310" font-size="11.5" fill="#475569" text-anchor="end">0</text>
    <text x="328" y="242" font-size="11.5" fill="#475569" text-anchor="end">2</text>
    <text x="328" y="174" font-size="11.5" fill="#475569" text-anchor="end">4</text>
    <text x="328" y="106" font-size="11.5" fill="#475569" text-anchor="end">6</text>

    <text x="382" y="323" font-size="11.5" fill="#475569" text-anchor="middle">0</text>
    <text x="448" y="323" font-size="11.5" fill="#475569" text-anchor="middle">1</text>
    <text x="514" y="323" font-size="11.5" fill="#475569" text-anchor="middle">2</text>
    <text x="576" y="323" font-size="11.5" fill="#475569" text-anchor="middle">3</text>
    <text x="479" y="342" font-size="12" font-weight="600" fill="#0A0E17" text-anchor="middle">Spin ℓ</text>

    <!-- Footer (y=378) -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
    <text x="28" y="378" font-size="12.5" fill="#475569">N<tspan font-size="11.5" dy="2">mf</tspan><tspan dy="-2"> = 9 · 14 CFT Operators · (h, μ</tspan><tspan font-size="11.5" dy="2">1</tspan><tspan dy="-2">, μ</tspan><tspan font-size="11.5" dy="2">b</tspan><tspan dy="-2">)</tspan></text>
    <text x="612" y="378" font-size="12.5" fill="#475569" text-anchor="end">Metric: <tspan font-weight="700" fill="#D97706">cost ↓</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>
</svg>
