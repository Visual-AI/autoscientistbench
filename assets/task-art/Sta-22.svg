<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>SpectralSpatial: Multivariate Spectral Confounder Adjustment</title>
  <desc>A 20x20 spatial lattice and rank-5 shared tensor transform exposures and outcomes into the Laplacian eigenbasis where spatial confounding decays at local frequency for 95% credible interval inference.</desc>
  <defs>
    <clipPath id="plateClip">
      <rect x="0" y="0" width="640" height="400" rx="14"/>
    </clipPath>
    <linearGradient id="plateBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFF6F8"/>
      <stop offset="55%" stop-color="#FFF6F8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B1028"/>
      <stop offset="45%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="confoundDecay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.30"/>
      <stop offset="75%" stop-color="#FFE4E6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="coordDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#E11D48" opacity="0.15"/>
    </pattern>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.2 L8.8 5 L0 8.8 Z" fill="#E11D48"/>
    </marker>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
    <rect x="0" y="0" width="640" height="400" fill="url(#plateBg)"/>
    <rect x="20" y="58" width="600" height="296" fill="url(#coordDots)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#topAccent)"/>

    <!-- Header -->
    <text x="28" y="38" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">SpectralSpatial</text>
    <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Spectral Confounder Spatial Model</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>

    <!-- Left Column: Spatial Lattice + 3-Way Shared Tensor -->
    <g>
      <!-- Top: Isometric 20x20 Spatial Field -->
      <rect x="32" y="70" width="164" height="128" rx="11" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="114" y="89" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#6B1028">20×20 Spatial Field</text>
      <!-- Isometric diamond lattice -->
      <polygon points="114,100 182,142 114,184 46,142" fill="#FFF6F8" stroke="#6B1028" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Confounder wave blobs inside lattice -->
      <ellipse cx="94" cy="142" rx="28" ry="16" fill="#F43F5E" fill-opacity="0.24"/>
      <ellipse cx="136" cy="140" rx="24" ry="13" fill="#FFE4E6" fill-opacity="0.85"/>
      <!-- Gridlines on diamond -->
      <g stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.85">
        <line x1="63" y1="131.5" x2="131" y2="173.5"/>
        <line x1="80" y1="121" x2="148" y2="163"/>
        <line x1="97" y1="110.5" x2="165" y2="152.5"/>
        <line x1="165" y1="131.5" x2="97" y2="173.5"/>
        <line x1="148" y1="121" x2="80" y2="163"/>
        <line x1="131" y1="110.5" x2="63" y2="152.5"/>
      </g>
      <!-- Local exposure / outcome sites -->
      <g stroke="#FFFFFF" stroke-width="1.1">
        <circle cx="88" cy="134" r="3.6" fill="#E11D48"/>
        <circle cx="114" cy="126" r="3.6" fill="#6B1028"/>
        <circle cx="106" cy="152" r="3.8" fill="#6B1028"/>
        <circle cx="134" cy="142" r="3.6" fill="#E11D48"/>
        <circle cx="122" cy="164" r="3.4" fill="#F43F5E"/>
        <circle cx="148" cy="134" r="3.2" fill="#6B1028"/>
      </g>

      <!-- Bottom: 3-Way Tensor Factorization -->
      <rect x="32" y="210" width="164" height="130" rx="11" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="114" y="229" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#6B1028">Shared Tensor (K=5)</text>
      <!-- Isometric 3D Tensor Cube -->
      <g transform="translate(46, 242)">
        <!-- Top face -->
        <polygon points="24,0 48,11 24,22 0,11" fill="#FFE4E6" stroke="#6B1028" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Left face -->
        <polygon points="0,11 24,22 24,54 0,43" fill="#F43F5E" fill-opacity="0.34" stroke="#6B1028" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Right face -->
        <polygon points="24,22 48,11 48,43 24,54" fill="#E11D48" fill-opacity="0.58" stroke="#6B1028" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Subtle slice lines -->
        <line x1="0" y1="27" x2="24" y2="38" stroke="#6B1028" stroke-width="0.9" stroke-opacity="0.5"/>
        <line x1="24" y1="38" x2="48" y2="27" stroke="#6B1028" stroke-width="0.9" stroke-opacity="0.5"/>
        <line x1="12" y1="5.5" x2="36" y2="16.5" stroke="#6B1028" stroke-width="0.9" stroke-opacity="0.5"/>
      </g>
      <text x="108" y="274" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#475569">=</text>
      <!-- Three factor matrices -->
      <rect x="122" y="246" width="14" height="50" rx="3" fill="#E11D48" fill-opacity="0.85" stroke="#6B1028" stroke-width="1.2"/>
      <rect x="144" y="253" width="14" height="43" rx="3" fill="#F43F5E" fill-opacity="0.82" stroke="#6B1028" stroke-width="1.2"/>
      <rect x="166" y="261" width="14" height="35" rx="3" fill="#6B1028" fill-opacity="0.85" stroke="#6B1028" stroke-width="1.2"/>
      <text x="114" y="324" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Basis · Exp · Out</text>
    </g>

    <!-- Arrow Left -> Center -->
    <line x1="199" y1="205" x2="213" y2="205" stroke="#E11D48" stroke-width="2.4" marker-end="url(#arrowRose)"/>

    <!-- Center Panel: Laplacian Spectral Frequency Decomposition -->
    <g>
      <rect x="218" y="70" width="228" height="270" rx="11" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="332" y="92" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Laplacian Eigenbasis</text>

      <!-- Highlighted local-scale frequency band -->
      <rect x="392" y="108" width="40" height="190" rx="5" fill="#FFE4E6" fill-opacity="0.78"/>
      <line x1="392" y1="108" x2="392" y2="298" stroke="#E11D48" stroke-width="1.6" stroke-dasharray="4 3"/>
      <text x="412" y="124" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#6B1028">ω₁</text>

      <!-- Axes & zero midline -->
      <path d="M236 108 V298 H434" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="236" y1="216" x2="434" y2="216" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- Spatial Confounding Decay Envelope (wide at global left, vanishes at local right) -->
      <path d="M238 142 C282 148, 336 188, 392 216 C336 244, 282 284, 238 290 Z" fill="url(#confoundDecay)"/>
      <path d="M238 142 C282 148, 336 188, 392 216" fill="none" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="5 3.5"/>
      <path d="M238 290 C282 284, 336 244, 392 216" fill="none" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="5 3.5"/>
      <text x="245" y="126" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">Confounding → 0</text>

      <!-- Smooth Spectral Spline Effect Curves -->
      <path d="M238 172 C278 162, 318 178, 358 174 C382 172, 398 170, 412 169" fill="none" stroke="#6B1028" stroke-width="3" stroke-linecap="round"/>
      <path d="M238 258 C280 264, 320 228, 360 202 C384 190, 398 192, 412 192" fill="none" stroke="#E11D48" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M238 232 C284 246, 324 256, 362 246 C384 240, 398 238, 412 238" fill="none" stroke="#F43F5E" stroke-width="2.4" stroke-linecap="round"/>

      <!-- Identified local-scale effect dots at omega_1 -->
      <g stroke="#FFFFFF" stroke-width="1.5">
        <circle cx="412" cy="169" r="4.4" fill="#6B1028"/>
        <circle cx="412" cy="192" r="4.2" fill="#E11D48"/>
        <circle cx="412" cy="238" r="4" fill="#F43F5E"/>
      </g>

      <!-- Axis labels -->
      <text x="238" y="314" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Global</text>
      <text x="432" y="314" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">Local</text>
      <text x="335" y="331" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Spatial Frequency</text>
    </g>

    <!-- Arrow Center -> Right -->
    <line x1="449" y1="205" x2="464" y2="205" stroke="#E11D48" stroke-width="2.4" marker-end="url(#arrowRose)"/>

    <!-- Right Panel: Posterior 95% Credible Intervals -->
    <g>
      <rect x="469" y="70" width="143" height="270" rx="11" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="540" y="92" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A0E17">95% Credible Int.</text>

      <!-- Reference zero vertical line -->
      <line x1="528" y1="112" x2="528" y2="300" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- 6 Horizontal 95% Credible Intervals with posterior mean & truth diamonds -->
      <!-- Row 1 (y=130) -->
      <rect x="534" y="125" width="56" height="10" rx="5" fill="#FFE4E6"/>
      <line x1="534" y1="130" x2="590" y2="130" stroke="#E11D48" stroke-width="2.4"/>
      <line x1="534" y1="125" x2="534" y2="135" stroke="#E11D48" stroke-width="2"/>
      <line x1="590" y1="125" x2="590" y2="135" stroke="#E11D48" stroke-width="2"/>
      <circle cx="562" cy="130" r="4.2" fill="#6B1028" stroke="#FFFFFF" stroke-width="1.2"/>
      <polygon points="570,125.5 574.5,130 570,134.5 565.5,130" fill="#059669" stroke="#FFFFFF" stroke-width="0.9"/>

      <!-- Row 2 (y=160) -->
      <rect x="486" y="155" width="52" height="10" rx="5" fill="#FFE4E6"/>
      <line x1="486" y1="160" x2="538" y2="160" stroke="#E11D48" stroke-width="2.4"/>
      <line x1="486" y1="155" x2="486" y2="165" stroke="#E11D48" stroke-width="2"/>
      <line x1="538" y1="155" x2="538" y2="165" stroke="#E11D48" stroke-width="2"/>
      <circle cx="512" cy="160" r="4.2" fill="#6B1028" stroke="#FFFFFF" stroke-width="1.2"/>
      <polygon points="504,155.5 508.5,160 504,164.5 499.5,160" fill="#059669" stroke="#FFFFFF" stroke-width="0.9"/>

      <!-- Row 3 (y=190) -->
      <rect x="524" y="185" width="60" height="10" rx="5" fill="#FFE4E6"/>
      <line x1="524" y1="190" x2="584" y2="190" stroke="#E11D48" stroke-width="2.4"/>
      <line x1="524" y1="185" x2="524" y2="195" stroke="#E11D48" stroke-width="2"/>
      <line x1="584" y1="185" x2="584" y2="195" stroke="#E11D48" stroke-width="2"/>
      <circle cx="554" cy="190" r="4.2" fill="#6B1028" stroke="#FFFFFF" stroke-width="1.2"/>
      <polygon points="546,185.5 550.5,190 546,194.5 541.5,190" fill="#059669" stroke="#FFFFFF" stroke-width="0.9"/>

      <!-- Row 4 (y=220) -->
      <rect x="504" y="215" width="48" height="10" rx="5" fill="#FFE4E6"/>
      <line x1="504" y1="220" x2="552" y2="220" stroke="#E11D48" stroke-width="2.4"/>
      <line x1="504" y1="215" x2="504" y2="225" stroke="#E11D48" stroke-width="2"/>
      <line x1="552" y1="215" x2="552" y2="225" stroke="#E11D48" stroke-width="2"/>
      <circle cx="528" cy="220" r="4.2" fill="#6B1028" stroke="#FFFFFF" stroke-width="1.2"/>
      <polygon points="536,215.5 540.5,220 536,224.5 531.5,220" fill="#059669" stroke="#FFFFFF" stroke-width="0.9"/>

      <!-- Row 5 (y=250) -->
      <rect x="542" y="245" width="54" height="10" rx="5" fill="#FFE4E6"/>
      <line x1="542" y1="250" x2="596" y2="250" stroke="#E11D48" stroke-width="2.4"/>
      <line x1="542" y1="245" x2="542" y2="255" stroke="#E11D48" stroke-width="2"/>
      <line x1="596" y1="245" x2="596" y2="255" stroke="#E11D48" stroke-width="2"/>
      <circle cx="569" cy="250" r="4.2" fill="#6B1028" stroke="#FFFFFF" stroke-width="1.2"/>
      <polygon points="577,245.5 581.5,250 577,254.5 572.5,250" fill="#059669" stroke="#FFFFFF" stroke-width="0.9"/>

      <!-- Row 6 (y=280) -->
      <rect x="488" y="275" width="56" height="10" rx="5" fill="#FFE4E6"/>
      <line x1="488" y1="280" x2="544" y2="280" stroke="#E11D48" stroke-width="2.4"/>
      <line x1="488" y1="275" x2="488" y2="285" stroke="#E11D48" stroke-width="2"/>
      <line x1="544" y1="275" x2="544" y2="285" stroke="#E11D48" stroke-width="2"/>
      <circle cx="516" cy="280" r="4.2" fill="#6B1028" stroke="#FFFFFF" stroke-width="1.2"/>
      <polygon points="524,275.5 528.5,280 524,284.5 519.5,280" fill="#059669" stroke="#FFFFFF" stroke-width="0.9"/>

      <!-- Legend -->
      <circle cx="486" cy="322" r="3.8" fill="#6B1028"/>
      <text x="494" y="326" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Mean</text>
      <polygon points="552,318 556,322 552,326 548,322" fill="#059669"/>
      <text x="560" y="326" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Truth</text>
    </g>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
    <text x="28" y="381" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#E11D48">mean_mse ↓</tspan></text>
    <text x="612" y="381" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">9 Exposures × 5 Outcomes · Coverage ≥ 0.93</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>
</svg>
