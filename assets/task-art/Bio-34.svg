<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>SpatialIsoform: Single-Cell Spatial Isoform Variability</title>
  <desc>Spatial expression patterns across Stereo-seq tissue coordinates—frontier, square domain, and line stripe versus random null—are tested using k-nearest-neighbor Moran's I under strict permutation null control.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FBF9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0D9488" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <g clip-path="url(#cardClip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base luminous plate -->
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accentGrad)"/>
    <rect x="20" y="58" width="600" height="298" fill="url(#dotGrid)"/>

    <!-- Header -->
    <text x="28" y="38" font-size="18" font-weight="700" fill="#0A0E17">SpatialIsoform</text>
    <text x="612" y="37" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Single-Cell Spatial Isoform Variability</text>
    <line x1="28" y1="56" x2="612" y2="56" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>

    <!-- Tile 1 (Top-Left): Frontier Pattern -->
    <rect x="32" y="76" width="180" height="128" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="44" y="95" font-size="11.5" font-weight="700" fill="#114B46">Frontier</text>
    <text x="200" y="95" text-anchor="end" font-size="11.5" font-weight="600" fill="#059669">SVI</text>
    <!-- Soft frontier region shading & dashed boundary -->
    <path d="M 42 104 H 178 C 142 138, 104 162, 42 176 Z" fill="#CCFBF1" fill-opacity="0.5"/>
    <path d="M 42 176 C 104 162, 142 138, 178 104" fill="none" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="4 3"/>
    <!-- Isoform=1 dots (upper-left) -->
    <g fill="#0D9488">
      <circle cx="54" cy="114" r="3.3"/><circle cx="72" cy="112" r="3.3"/><circle cx="92" cy="116" r="3.3"/>
      <circle cx="114" cy="112" r="3.3"/><circle cx="136" cy="115" r="3.3"/><circle cx="154" cy="112" r="3.3"/>
      <circle cx="52" cy="130" r="3.3"/><circle cx="68" cy="128" r="3.3"/><circle cx="86" cy="132" r="3.3"/>
      <circle cx="106" cy="128" r="3.3"/><circle cx="126" cy="131" r="3.3"/>
      <circle cx="56" cy="148" r="3.3"/><circle cx="76" cy="146" r="3.3"/><circle cx="96" cy="147" r="3.3"/>
      <circle cx="52" cy="164" r="3.3"/><circle cx="72" cy="161" r="3.3"/>
    </g>
    <!-- Isoform=0 dots (lower-right) -->
    <g fill="#CBD5E1">
      <circle cx="186" cy="118" r="2.8"/><circle cx="164" cy="134" r="2.8"/><circle cx="188" cy="138" r="2.8"/>
      <circle cx="142" cy="150" r="2.8"/><circle cx="168" cy="154" r="2.8"/><circle cx="192" cy="156" r="2.8"/>
      <circle cx="118" cy="168" r="2.8"/><circle cx="146" cy="172" r="2.8"/><circle cx="174" cy="172" r="2.8"/>
      <circle cx="196" cy="176" r="2.8"/><circle cx="78" cy="186" r="2.8"/><circle cx="104" cy="186" r="2.8"/>
      <circle cx="132" cy="188" r="2.8"/><circle cx="160" cy="189" r="2.8"/><circle cx="188" cy="190" r="2.8"/>
    </g>

    <!-- Tile 2 (Top-Right): Square Domain Pattern -->
    <rect x="226" y="76" width="180" height="128" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="238" y="95" font-size="11.5" font-weight="700" fill="#114B46">Square domain</text>
    <text x="394" y="95" text-anchor="end" font-size="11.5" font-weight="600" fill="#059669">SVI</text>
    <!-- Square highlight -->
    <rect x="282" y="120" width="68" height="58" rx="4" fill="#CCFBF1" fill-opacity="0.55" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="4 3"/>
    <!-- Isoform=1 cluster inside square -->
    <g fill="#0D9488">
      <circle cx="294" cy="131" r="3.3"/><circle cx="310" cy="130" r="3.3"/><circle cx="326" cy="132" r="3.3"/><circle cx="340" cy="131" r="3.3"/>
      <circle cx="292" cy="146" r="3.3"/><circle cx="308" cy="144" r="3.3"/><circle cx="324" cy="147" r="3.3"/><circle cx="339" cy="146" r="3.3"/>
      <circle cx="295" cy="160" r="3.3"/><circle cx="312" cy="159" r="3.3"/><circle cx="328" cy="161" r="3.3"/><circle cx="341" cy="160" r="3.3"/>
      <circle cx="301" cy="171" r="3.3"/><circle cx="319" cy="171" r="3.3"/><circle cx="334" cy="170" r="3.3"/>
    </g>
    <!-- Surrounding Isoform=0 cells -->
    <g fill="#CBD5E1">
      <circle cx="246" cy="114" r="2.8"/><circle cx="268" cy="112" r="2.8"/><circle cx="306" cy="111" r="2.8"/><circle cx="352" cy="112" r="2.8"/><circle cx="382" cy="114" r="2.8"/>
      <circle cx="248" cy="136" r="2.8"/><circle cx="266" cy="142" r="2.8"/><circle cx="368" cy="134" r="2.8"/><circle cx="388" cy="140" r="2.8"/>
      <circle cx="246" cy="162" r="2.8"/><circle cx="266" cy="166" r="2.8"/><circle cx="366" cy="162" r="2.8"/><circle cx="388" cy="164" r="2.8"/>
      <circle cx="250" cy="188" r="2.8"/><circle cx="282" cy="190" r="2.8"/><circle cx="318" cy="190" r="2.8"/><circle cx="356" cy="188" r="2.8"/><circle cx="386" cy="188" r="2.8"/>
    </g>

    <!-- Tile 3 (Bottom-Left): Line Stripe Pattern -->
    <rect x="32" y="216" width="180" height="128" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="44" y="235" font-size="11.5" font-weight="700" fill="#114B46">Line stripe</text>
    <text x="200" y="235" text-anchor="end" font-size="11.5" font-weight="600" fill="#059669">SVI</text>
    <!-- Horizontal stripe domain -->
    <rect x="42" y="276" width="160" height="28" rx="3" fill="#CCFBF1" fill-opacity="0.55"/>
    <line x1="42" y1="276" x2="202" y2="276" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="42" y1="304" x2="202" y2="304" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="4 3"/>
    <!-- Stripe Isoform=1 cells -->
    <g fill="#0D9488">
      <circle cx="52" cy="285" r="3.3"/><circle cx="70" cy="284" r="3.3"/><circle cx="88" cy="286" r="3.3"/>
      <circle cx="106" cy="284" r="3.3"/><circle cx="124" cy="286" r="3.3"/><circle cx="142" cy="284" r="3.3"/>
      <circle cx="160" cy="286" r="3.3"/><circle cx="178" cy="284" r="3.3"/><circle cx="194" cy="286" r="3.3"/>
      <circle cx="60" cy="296" r="3.3"/><circle cx="80" cy="297" r="3.3"/><circle cx="100" cy="295" r="3.3"/>
      <circle cx="120" cy="297" r="3.3"/><circle cx="140" cy="295" r="3.3"/><circle cx="162" cy="297" r="3.3"/><circle cx="184" cy="296" r="3.3"/>
    </g>
    <!-- Background Isoform=0 cells -->
    <g fill="#CBD5E1">
      <circle cx="54" cy="254" r="2.8"/><circle cx="84" cy="252" r="2.8"/><circle cx="116" cy="255" r="2.8"/><circle cx="150" cy="253" r="2.8"/><circle cx="184" cy="254" r="2.8"/>
      <circle cx="68" cy="266" r="2.8"/><circle cx="104" cy="266" r="2.8"/><circle cx="138" cy="265" r="2.8"/><circle cx="172" cy="267" r="2.8"/>
      <circle cx="56" cy="316" r="2.8"/><circle cx="90" cy="318" r="2.8"/><circle cx="126" cy="316" r="2.8"/><circle cx="160" cy="318" r="2.8"/><circle cx="192" cy="316" r="2.8"/>
      <circle cx="72" cy="331" r="2.8"/><circle cx="110" cy="332" r="2.8"/><circle cx="146" cy="330" r="2.8"/><circle cx="180" cy="332" r="2.8"/>
    </g>

    <!-- Tile 4 (Bottom-Right): Random Null Control -->
    <rect x="226" y="216" width="180" height="128" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-opacity="0.45" stroke-width="1.3"/>
    <text x="238" y="235" font-size="11.5" font-weight="700" fill="#E11D48">Random null</text>
    <text x="394" y="235" text-anchor="end" font-size="11.5" font-weight="600" fill="#E11D48">Null</text>
    <!-- Uncorrelated mixed rose & slate cells -->
    <g fill="#E11D48" fill-opacity="0.72">
      <circle cx="250" cy="254" r="3"/><circle cx="294" cy="258" r="3"/><circle cx="352" cy="252" r="3"/><circle cx="386" cy="264" r="3"/>
      <circle cx="268" cy="278" r="3"/><circle cx="320" cy="276" r="3"/><circle cx="366" cy="284" r="3"/><circle cx="246" cy="304" r="3"/>
      <circle cx="296" cy="300" r="3"/><circle cx="340" cy="306" r="3"/><circle cx="388" cy="310" r="3"/><circle cx="270" cy="328" r="3"/>
      <circle cx="316" cy="326" r="3"/><circle cx="364" cy="330" r="3"/>
    </g>
    <g fill="#CBD5E1">
      <circle cx="272" cy="252" r="2.8"/><circle cx="324" cy="254" r="2.8"/><circle cx="372" cy="254" r="2.8"/>
      <circle cx="246" cy="276" r="2.8"/><circle cx="294" cy="280" r="2.8"/><circle cx="344" cy="278" r="2.8"/><circle cx="390" cy="286" r="2.8"/>
      <circle cx="270" cy="304" r="2.8"/><circle cx="318" cy="304" r="2.8"/><circle cx="364" cy="306" r="2.8"/>
      <circle cx="248" cy="328" r="2.8"/><circle cx="294" cy="330" r="2.8"/><circle cx="342" cy="328" r="2.8"/><circle cx="388" cy="330" r="2.8"/>
    </g>

    <!-- Right-Top Card: k-NN Spatial Neighborhood Graph -->
    <rect x="426" y="76" width="184" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="518" y="96" text-anchor="middle" font-size="11.5" font-weight="600" fill="#114B46">k-NN spatial graph</text>
    <!-- k-NN neighborhood radius -->
    <circle cx="518" cy="144" r="36" fill="#CCFBF1" fill-opacity="0.45" stroke="#0D9488" stroke-width="1.3" stroke-dasharray="3.5 3"/>
    <!-- Radial neighbor spokes -->
    <g stroke="#10B981" stroke-width="1.6">
      <line x1="518" y1="144" x2="494" y2="124"/>
      <line x1="518" y1="144" x2="526" y2="116"/>
      <line x1="518" y1="144" x2="546" y2="132"/>
      <line x1="518" y1="144" x2="544" y2="160"/>
      <line x1="518" y1="144" x2="516" y2="174"/>
      <line x1="518" y1="144" x2="490" y2="158"/>
    </g>
    <!-- Linked neighbor nodes -->
    <g fill="#0D9488">
      <circle cx="494" cy="124" r="4"/>
      <circle cx="526" cy="116" r="4"/>
      <circle cx="546" cy="132" r="4"/>
      <circle cx="544" cy="160" r="4"/>
      <circle cx="516" cy="174" r="4"/>
      <circle cx="490" cy="158" r="4"/>
    </g>
    <!-- Center cell -->
    <circle cx="518" cy="144" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Outside unlinked cells -->
    <g fill="#CBD5E1">
      <circle cx="464" cy="120" r="3.2"/>
      <circle cx="574" cy="118" r="3.2"/>
      <circle cx="462" cy="168" r="3.2"/>
      <circle cx="576" cy="168" r="3.2"/>
    </g>

    <!-- Right-Bottom Card: Moran's I Permutation Null vs Observed SVI -->
    <rect x="426" y="206" width="184" height="138" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="518" y="226" text-anchor="middle" font-size="11.5" font-weight="600" fill="#114B46">Moran's I permutation</text>

    <!-- Permutation null bell curve centered around x=486 -->
    <path d="M 438 306 C 456 306, 466 244, 486 244 C 506 244, 516 306, 538 306 Z" fill="#CBD5E1" fill-opacity="0.38" stroke="#475569" stroke-width="2"/>
    <!-- Right rejection tail (p <= 0.05) -->
    <path d="M 514 306 L 514 285 C 520 296, 528 305, 538 306 Z" fill="#E11D48" fill-opacity="0.55"/>
    <line x1="514" y1="242" x2="514" y2="306" stroke="#E11D48" stroke-width="1.4" stroke-dasharray="3 3"/>

    <!-- Observed SVI spike -->
    <line x1="578" y1="306" x2="578" y2="262" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <circle cx="578" cy="262" r="8.5" fill="#059669" fill-opacity="0.22"/>
    <circle cx="578" cy="262" r="4.5" fill="#059669"/>
    <text x="578" y="249" text-anchor="middle" font-size="11.5" font-weight="700" fill="#059669">SVI</text>

    <!-- Baseline axis -->
    <line x1="436" y1="306" x2="600" y2="306" stroke="#475569" stroke-width="1.5"/>
    <text x="484" y="328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E11D48">Null ≤ 5.8%</text>
    <text x="578" y="328" text-anchor="middle" font-size="11.5" font-weight="700" fill="#059669">I_obs</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>
    <text x="28" y="381" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#0D9488">macro_recall ↑</tspan></text>
    <text x="612" y="381" text-anchor="end" font-size="11.5" fill="#475569">Stereo-seq · 60,437 cells</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1"/>
</svg>
