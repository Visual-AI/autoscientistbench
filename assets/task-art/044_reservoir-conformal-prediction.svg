<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>ResCP — Reservoir Conformal Prediction for Time Series</title>
  <desc>Three-stage conformal time-series diagram where forecast residuals drive an untrained recurrent Echo State Network, cosine similarity with a recency ramp weights past reservoir states, and the narrowest 90% quantile window yields prediction bounds.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="reservoir-grad" cx="46%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="62%" stop-color="#DBEAFE" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.22"/>
    </radialGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.16"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0052FF"/>
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base luminous plate -->
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="24" y="60" width="592" height="292" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accent-bar)"/>

    <!-- Header -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.3">ResCP</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Reservoir Conformal Time Series</text>
    <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

    <!-- ZONE 1: Past Forecast Residual Stream -->
    <text x="79" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#0A1E5E">Residuals r_t</text>
    <rect x="34" y="92" width="90" height="226" rx="10" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Zero baseline & oscillating residual impulses -->
    <line x1="44" y1="204" x2="114" y2="204" stroke="#475569" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="3,2"/>
    <g stroke="#0052FF" stroke-width="2.4" stroke-linecap="round">
      <line x1="50" y1="204" x2="50" y2="174"/>
      <line x1="60" y1="204" x2="60" y2="232"/>
      <line x1="70" y1="204" x2="70" y2="156"/>
      <line x1="80" y1="204" x2="80" y2="246"/>
      <line x1="90" y1="204" x2="90" y2="182"/>
      <line x1="100" y1="204" x2="100" y2="254"/>
      <line x1="110" y1="204" x2="110" y2="164"/>
    </g>
    <g fill="#0A1E5E">
      <circle cx="50" cy="174" r="2.6"/>
      <circle cx="60" cy="232" r="2.6"/>
      <circle cx="70" cy="156" r="2.6"/>
      <circle cx="80" cy="246" r="2.6"/>
      <circle cx="90" cy="182" r="2.6"/>
      <circle cx="100" cy="254" r="2.6"/>
      <circle cx="110" cy="164" r="2.6"/>
    </g>
    <text x="79" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">y_t − ŷ_t</text>
    <text x="79" y="298" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">Past Window</text>

    <!-- Input Arrow into Reservoir -->
    <line x1="126" y1="204" x2="152" y2="204" stroke="#0052FF" stroke-width="2.6" marker-end="url(#arrow-blue)"/>

    <!-- ZONE 2: Untrained Echo State Network (Circular Recurrent Reservoir) -->
    <text x="250" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A1E5E">Echo State Reservoir</text>

    <!-- Reservoir aura & disk -->
    <circle cx="250" cy="204" r="92" fill="#DBEAFE" fill-opacity="0.38"/>
    <circle cx="250" cy="204" r="84" fill="url(#reservoir-grad)" stroke="#0EA5E9" stroke-width="2.2" stroke-dasharray="6,4"/>

    <!-- Sparse recurrent echo state edges (muted background + active dynamical paths) -->
    <g fill="none" stroke="#475569" stroke-opacity="0.32" stroke-width="1.4">
      <path d="M 192 184 Q 218 148 248 142"/>
      <path d="M 248 142 Q 286 144 304 176"/>
      <path d="M 192 184 Q 186 226 210 256"/>
      <path d="M 210 256 Q 252 272 292 254"/>
      <path d="M 218 206 Q 246 232 274 226"/>
      <path d="M 232 168 Q 214 196 218 206"/>
      <path d="M 274 226 Q 302 214 304 176"/>
      <path d="M 292 254 Q 262 246 248 264"/>
    </g>
    <!-- Active recurrent echo cycles -->
    <g fill="none" stroke="#0EA5E9" stroke-width="2.2">
      <path d="M 192 184 Q 230 176 266 176" marker-end="url(#arrow-sky)"/>
      <path d="M 266 176 Q 294 202 274 226" marker-end="url(#arrow-sky)"/>
      <path d="M 274 226 Q 240 218 228 190" marker-end="url(#arrow-sky)"/>
      <path d="M 228 190 Q 252 152 294 166"/>
    </g>
    <!-- Self-echo feedback loop -->
    <path d="M 256 140 C 266 122, 232 122, 242 140" fill="none" stroke="#0052FF" stroke-opacity="0.7" stroke-width="1.8"/>

    <!-- Reservoir neurons: passive + glowing active query state nodes -->
    <g fill="#FFFFFF" stroke="#475569" stroke-width="1.8">
      <circle cx="192" cy="184" r="5"/>
      <circle cx="248" cy="142" r="5"/>
      <circle cx="210" cy="256" r="5"/>
      <circle cx="248" cy="264" r="5"/>
      <circle cx="292" cy="254" r="5"/>
      <circle cx="218" cy="206" r="4.8"/>
      <circle cx="232" cy="168" r="4.8"/>
    </g>
    <!-- Highlighted active reservoir state vector h_q -->
    <g>
      <circle cx="266" cy="176" r="10.5" fill="#0052FF" fill-opacity="0.22"/>
      <circle cx="266" cy="176" r="6.2" fill="#0052FF" stroke="#FFFFFF" stroke-width="2"/>

      <circle cx="304" cy="176" r="10" fill="#0052FF" fill-opacity="0.22"/>
      <circle cx="304" cy="176" r="6" fill="#0052FF" stroke="#FFFFFF" stroke-width="2"/>

      <circle cx="274" cy="226" r="10" fill="#0EA5E9" fill-opacity="0.24"/>
      <circle cx="274" cy="226" r="5.8" fill="#0052FF" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Query state pill beneath reservoir -->
    <rect x="184" y="310" width="132" height="24" rx="12" fill="#DBEAFE" stroke="#0052FF" stroke-opacity="0.35" stroke-width="1"/>
    <text x="250" y="326" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0052FF">Query State h_q</text>

    <!-- Cosine Similarity Attention Rays (Center -> Right Top) -->
    <path d="M 336 176 C 356 172, 366 146, 382 140" fill="none" stroke="#0052FF" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
    <path d="M 336 196 C 358 192, 368 172, 382 164" fill="none" stroke="#0EA5E9" stroke-opacity="0.65" stroke-width="1.6" stroke-dasharray="4,3"/>

    <!-- ZONE 3 TOP: Cosine Similarity Softmax + Recency Ramp Pool -->
    <rect x="386" y="70" width="226" height="130" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1"/>
    <text x="499" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#0A1E5E">Cosine Softmax × Recency</text>

    <!-- Historical state weight bars (baseline y=160) -->
    <line x1="402" y1="160" x2="596" y2="160" stroke="#475569" stroke-opacity="0.5" stroke-width="1.2"/>
    <g>
      <rect x="408" y="148" width="14" height="12" rx="3" fill="#CBD5E1"/>
      <rect x="432" y="142" width="14" height="18" rx="3" fill="#CBD5E1"/>
      <rect x="456" y="128" width="14" height="32" rx="3" fill="#0EA5E9" fill-opacity="0.55"/>
      <rect x="480" y="146" width="14" height="14" rx="3" fill="#CBD5E1"/>
      <rect x="504" y="112" width="14" height="48" rx="3" fill="#0052FF"/>
      <rect x="528" y="144" width="14" height="16" rx="3" fill="#CBD5E1"/>
      <rect x="552" y="132" width="14" height="28" rx="3" fill="#0EA5E9" fill-opacity="0.72"/>
      <rect x="576" y="106" width="14" height="54" rx="3" fill="#0052FF"/>
    </g>
    <!-- Linear recency ramp wedge under pool -->
    <polygon points="406,181 592,181 592,169" fill="#0EA5E9" fill-opacity="0.32" stroke="#0EA5E9" stroke-width="1.2"/>
    <text x="408" y="175" font-size="10.5" font-weight="500" fill="#475569">Pool h_i</text>
    <text x="592" y="194" text-anchor="end" font-size="10.5" font-weight="600" fill="#0EA5E9">Recency Ramp →</text>

    <!-- Down connector arrow -->
    <line x1="499" y1="201" x2="499" y2="217" stroke="#0052FF" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

    <!-- ZONE 3 BOTTOM: Weighted Residual Distribution & Narrowest 90% Quantile Window -->
    <rect x="386" y="220" width="226" height="128" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1"/>
    <text x="499" y="239" text-anchor="middle" font-size="12" font-weight="600" fill="#0A1E5E">Min-Width 90% Quantile</text>

    <!-- Baseline -->
    <line x1="402" y1="318" x2="596" y2="318" stroke="#475569" stroke-opacity="0.5" stroke-width="1.2"/>

    <!-- Left 5% tail (Winkler penalty zone) -->
    <path d="M 404 318 C 418 317, 432 312, 446 298 L 446 318 Z" fill="#E11D48" fill-opacity="0.24"/>
    <!-- Central 90% narrowest quantile band [b, 0.9+b] -->
    <path d="M 446 298 C 462 280, 476 254, 492 254 C 510 254, 526 276, 542 296 L 542 318 L 446 318 Z" fill="#0052FF" fill-opacity="0.22"/>
    <!-- Right 5% tail (Winkler penalty zone) -->
    <path d="M 542 296 C 558 311, 574 317, 594 318 L 542 318 Z" fill="#E11D48" fill-opacity="0.24"/>

    <!-- Smooth weighted residual density outline -->
    <path d="M 404 318 C 418 317, 432 312, 446 298 C 462 280, 476 254, 492 254 C 510 254, 526 276, 542 296 C 558 311, 574 317, 594 318"
          fill="none" stroke="#0052FF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Quantile boundaries b and 0.9+b + frozen forecast y_hat_q -->
    <line x1="446" y1="266" x2="446" y2="322" stroke="#059669" stroke-width="2.2"/>
    <line x1="542" y1="266" x2="542" y2="322" stroke="#059669" stroke-width="2.2"/>
    <line x1="490" y1="252" x2="490" y2="318" stroke="#0A1E5E" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Bracket labels -->
    <text x="442" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">b</text>
    <text x="494" y="337" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0052FF">90% [L, U]</text>
    <text x="554" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">0.9+b</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
    <text x="28" y="381" font-size="12" font-weight="500" fill="#475569">12 cells · α = 0.10 · untrained ESN</text>
    <text x="612" y="381" text-anchor="end" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#0052FF">normalized_winkler ↓</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>
</svg>
