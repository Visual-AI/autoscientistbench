<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>InertialGenome — 3D Chromosome Inertial Frame Refinement</title>
  <desc>Three-stage bioinformatics diagram showing initial LorDG 3D chromatin structure and Hi-C contact supervision, alignment onto inertia tensor principal axes with RoPE and Nyström features, and refined 3D chromosome folding matching contact distances.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4FBF9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fiber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#114B46"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="ellipsoid-grad" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#CCFBF1" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fiber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFBF1" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#CCFBF1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.16"/>
    </pattern>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#114B46"/>
    </marker>
    <marker id="arrow-sec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base luminous plate -->
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="24" y="60" width="592" height="292" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accent-bar)"/>

    <!-- Header -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.3">InertialGenome</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">3D Chromosome Inertial Refinement</text>
    <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

    <!-- ZONE 1: Initial LorDG 3D Coil + Hi-C Contact Matrix -->
    <text x="110" y="76" text-anchor="middle" font-size="12.5" font-weight="600" fill="#114B46">LorDG Input</text>

    <!-- Initial distorted chromatin coil card -->
    <rect x="38" y="88" width="144" height="122" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Misaligned ghost offset (error signal) -->
    <path d="M 56 184 C 62 126, 98 102, 118 134 C 138 166, 108 192, 134 176 C 154 164, 160 120, 168 112"
          fill="none" stroke="#E11D48" stroke-opacity="0.34" stroke-width="2.2" stroke-dasharray="4,3"/>
    <!-- Distorted initial polymer -->
    <path d="M 52 176 C 68 122, 92 110, 112 140 C 130 166, 104 196, 130 184 C 150 174, 156 132, 166 118"
          fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Loci beads on initial coil -->
    <g fill="#FFFFFF" stroke="#475569" stroke-width="2">
      <circle cx="54" cy="172" r="3.6"/>
      <circle cx="76" cy="126" r="3.6"/>
      <circle cx="104" cy="130" r="3.6"/>
      <circle cx="118" cy="166" r="3.6"/>
      <circle cx="132" cy="182" r="3.6"/>
      <circle cx="154" cy="150" r="3.6"/>
      <circle cx="166" cy="118" r="3.6"/>
    </g>

    <!-- Hi-C Contact Supervision Matrix inset -->
    <rect x="48" y="224" width="124" height="104" rx="10" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1"/>
    <g transform="translate(74, 236)">
      <!-- 6x6 symmetric Hi-C contact heatmap showing TAD blocks -->
      <!-- Row 0 -->
      <rect x="0" y="0" width="11" height="11" rx="1.5" fill="#114B46"/>
      <rect x="13" y="0" width="11" height="11" rx="1.5" fill="#0D9488"/>
      <rect x="26" y="0" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <rect x="39" y="0" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <rect x="52" y="0" width="11" height="11" rx="1.5" fill="#10B981" fill-opacity="0.45"/>
      <rect x="65" y="0" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <!-- Row 1 -->
      <rect x="0" y="13" width="11" height="11" rx="1.5" fill="#0D9488"/>
      <rect x="13" y="13" width="11" height="11" rx="1.5" fill="#114B46"/>
      <rect x="26" y="13" width="11" height="11" rx="1.5" fill="#10B981"/>
      <rect x="39" y="13" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <rect x="52" y="13" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <rect x="65" y="13" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <!-- Row 2 -->
      <rect x="0" y="26" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <rect x="13" y="26" width="11" height="11" rx="1.5" fill="#10B981"/>
      <rect x="26" y="26" width="11" height="11" rx="1.5" fill="#114B46"/>
      <rect x="39" y="26" width="11" height="11" rx="1.5" fill="#0D9488"/>
      <rect x="52" y="26" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <rect x="65" y="26" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <!-- Row 3 -->
      <rect x="0" y="39" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <rect x="13" y="39" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <rect x="26" y="39" width="11" height="11" rx="1.5" fill="#0D9488"/>
      <rect x="39" y="39" width="11" height="11" rx="1.5" fill="#114B46"/>
      <rect x="52" y="39" width="11" height="11" rx="1.5" fill="#0D9488"/>
      <rect x="65" y="39" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <!-- Row 4 -->
      <rect x="0" y="52" width="11" height="11" rx="1.5" fill="#10B981" fill-opacity="0.45"/>
      <rect x="13" y="52" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <rect x="26" y="52" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <rect x="39" y="52" width="11" height="11" rx="1.5" fill="#0D9488"/>
      <rect x="52" y="52" width="11" height="11" rx="1.5" fill="#114B46"/>
      <rect x="65" y="52" width="11" height="11" rx="1.5" fill="#10B981"/>
      <!-- Row 5 -->
      <rect x="0" y="65" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <rect x="13" y="65" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <rect x="26" y="65" width="11" height="11" rx="1.5" fill="#F4FBF9"/>
      <rect x="39" y="65" width="11" height="11" rx="1.5" fill="#CCFBF1"/>
      <rect x="52" y="65" width="11" height="11" rx="1.5" fill="#10B981"/>
      <rect x="65" y="65" width="11" height="11" rx="1.5" fill="#114B46"/>
    </g>
    <text x="110" y="344" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">Hi-C C⁻⁰·⁵ Target</text>

    <!-- Connector Arrow 1 -> 2 -->
    <line x1="186" y1="184" x2="218" y2="184" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

    <!-- ZONE 2: Inertial Frame Ellipsoid + RoPE & Nyström Anchors -->
    <text x="306" y="76" text-anchor="middle" font-size="12.5" font-weight="600" fill="#114B46">Inertial Frame</text>

    <!-- Nyström multi-scale RBF anchor halo rings -->
    <circle cx="306" cy="202" r="82" fill="none" stroke="#10B981" stroke-opacity="0.24" stroke-width="1.4" stroke-dasharray="4,4"/>
    <circle cx="306" cy="202" r="64" fill="none" stroke="#0D9488" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Inertia tensor ellipsoid -->
    <g transform="rotate(-14 306 202)">
      <ellipse cx="306" cy="202" rx="64" ry="40" fill="url(#ellipsoid-grad)" stroke="#0D9488" stroke-width="2.2"/>
      <!-- Equator & meridian wireframes -->
      <ellipse cx="306" cy="202" rx="64" ry="15" fill="none" stroke="#0D9488" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4,3"/>
      <ellipse cx="306" cy="202" rx="22" ry="40" fill="none" stroke="#114B46" stroke-opacity="0.32" stroke-width="1.3" stroke-dasharray="4,3"/>
    </g>

    <!-- Chiral rotation alignment arc around e2 -->
    <path d="M 278 144 A 26 9 0 0 1 322 140" fill="none" stroke="#0D9488" stroke-width="1.8" marker-end="url(#arrow-teal)"/>

    <!-- Principal inertia axes e1, e2, e3 -->
    <line x1="306" y1="202" x2="376" y2="185" stroke="#114B46" stroke-width="2.8" marker-end="url(#arrow-dark)"/>
    <line x1="306" y1="202" x2="294" y2="118" stroke="#0D9488" stroke-width="2.6" marker-end="url(#arrow-teal)"/>
    <line x1="306" y1="202" x2="254" y2="256" stroke="#10B981" stroke-width="2.6" marker-end="url(#arrow-sec)"/>
    <!-- Centroid dot -->
    <circle cx="306" cy="202" r="4.8" fill="#114B46" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Axis labels (clear of ellipsoid & arrows) -->
    <text x="378" y="176" font-size="12" font-weight="700" fill="#114B46">e₁</text>
    <text x="304" y="114" font-size="12" font-weight="700" fill="#0D9488">e₂</text>
    <text x="239" y="268" font-size="12" font-weight="700" fill="#10B981">e₃</text>

    <!-- Nyström RBF anchor diamonds -->
    <g fill="#10B981" stroke="#FFFFFF" stroke-width="1.5">
      <polygon points="244,142 250,148 244,154 238,148"/>
      <polygon points="354,132 360,138 354,144 348,138"/>
      <polygon points="366,246 372,252 366,258 360,252"/>
      <polygon points="282,276 288,282 282,288 276,282"/>
    </g>

    <!-- Geometric Transformer badge -->
    <rect x="234" y="302" width="144" height="24" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-opacity="0.4" stroke-width="1"/>
    <text x="306" y="318" text-anchor="middle" font-size="11.5" font-weight="600" fill="#114B46">Geometric Transformer</text>
    <text x="306" y="344" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">RoPE + Nyström</text>

    <!-- Connector Arrow 2 -> 3 -->
    <line x1="392" y1="202" x2="420" y2="202" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

    <!-- ZONE 3: Refined 3D Chromosome Structure -->
    <text x="518" y="76" text-anchor="middle" font-size="12.5" font-weight="600" fill="#114B46">Refined 3D Fiber</text>
    <ellipse cx="518" cy="206" rx="92" ry="102" fill="url(#fiber-glow)"/>

    <!-- Contact-derived 3D proximity chords (matched Hi-C contacts) -->
    <g stroke="#059669" stroke-width="2" stroke-dasharray="4,3">
      <line x1="468" y1="146" x2="556" y2="162"/>
      <line x1="474" y1="242" x2="562" y2="232"/>
      <line x1="504" y1="186" x2="538" y2="268"/>
    </g>

    <!-- Refined 3D Chromatin Ribbon (back segments first) -->
    <path d="M 442 276 C 426 218, 444 134, 488 112 C 532 90, 588 118, 578 168 C 568 214, 514 218, 482 186"
          fill="none" stroke="#114B46" stroke-opacity="0.78" stroke-width="5.2" stroke-linecap="round"/>

    <!-- Front over-crossing segment with white depth halo -->
    <path d="M 482 186 C 446 150, 484 106, 526 124 C 570 144, 594 212, 562 260 C 534 302, 466 306, 462 254 C 458 214, 512 192, 548 216 C 574 234, 586 276, 570 302"
          fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round"/>
    <path d="M 482 186 C 446 150, 484 106, 526 124 C 570 144, 594 212, 562 260 C 534 302, 466 306, 462 254 C 458 214, 512 192, 548 216 C 574 234, 586 276, 570 302"
          fill="none" stroke="url(#fiber-grad)" stroke-width="5.6" stroke-linecap="round"/>

    <!-- Chromatin loci nodes along refined 3D fiber -->
    <g stroke="#FFFFFF" stroke-width="2">
      <circle cx="442" cy="276" r="4.8" fill="#114B46"/>
      <circle cx="468" cy="146" r="5.2" fill="#059669"/>
      <circle cx="526" cy="124" r="5" fill="#0D9488"/>
      <circle cx="556" cy="162" r="5.2" fill="#059669"/>
      <circle cx="504" cy="186" r="5.2" fill="#059669"/>
      <circle cx="474" cy="242" r="5.2" fill="#059669"/>
      <circle cx="562" cy="232" r="5.2" fill="#059669"/>
      <circle cx="538" cy="268" r="5.2" fill="#059669"/>
      <circle cx="496" cy="296" r="4.8" fill="#10B981"/>
      <circle cx="570" cy="302" r="4.8" fill="#10B981"/>
    </g>

    <text x="518" y="344" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">Contact-Aligned Loci</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
    <text x="28" y="381" font-size="12" font-weight="500" fill="#475569">GM12878 · 100 kb resolution</text>
    <text x="612" y="381" text-anchor="end" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#0D9488">dscc ↑</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>
</svg>
