<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>MultiGraphon — Multi-Network Step-Function Graphon Estimation</title>
  <desc>Multiple observed undirected networks of varying sizes are jointly degree-sorted across nodes to estimate a symmetric block step-function graphon approximating the continuous latent graphon.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <clipPath id="upperTri">
      <polygon points="392,94 596,94 596,298"/>
    </clipPath>
    <clipPath id="lowerTri">
      <polygon points="392,94 392,298 596,298"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="graphonCont" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="30%" stop-color="#EDE9FE"/>
      <stop offset="58%" stop-color="#A855F7"/>
      <stop offset="82%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3E1B7A"/>
    </linearGradient>
    <linearGradient id="colorBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3E1B7A"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#3E1B7A" opacity="0.16"/>
    </pattern>
    <marker id="arrPurp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="16" y="56" width="608" height="298" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accentGrad)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="37" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">MultiGraphon</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Joint Degree Sorting &amp; Step Graphon</text>
  <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Stage 1: Multi-Size Observed Network Collection -->
  <text x="104" y="79" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#0A0E17">Observed Networks</text>

  <!-- Back Card (Graph 1) -->
  <rect x="74" y="96" width="96" height="86" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <g stroke="#A855F7" stroke-opacity="0.55" stroke-width="1.4">
    <line x1="98" y1="120" x2="144" y2="116"/>
    <line x1="144" y1="116" x2="150" y2="152"/>
    <line x1="98" y1="120" x2="122" y2="146"/>
    <line x1="122" y1="146" x2="150" y2="152"/>
  </g>
  <g fill="#A855F7">
    <circle cx="98" cy="120" r="3.5"/><circle cx="144" cy="116" r="4"/>
    <circle cx="150" cy="152" r="3.5"/><circle cx="122" cy="146" r="4"/>
  </g>

  <!-- Middle Card (Graph 2) -->
  <rect x="54" y="140" width="104" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <g stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="78" y1="166" x2="114" y2="160"/><line x1="114" y1="160" x2="138" y2="180"/>
    <line x1="78" y1="166" x2="104" y2="198"/><line x1="104" y1="198" x2="138" y2="180"/>
    <line x1="114" y1="160" x2="104" y2="198"/><line x1="74" y1="206" x2="104" y2="198"/>
  </g>
  <g fill="#7C3AED">
    <circle cx="78" cy="166" r="3.8"/><circle cx="114" cy="160" r="4.5"/>
    <circle cx="138" cy="180" r="4"/><circle cx="104" cy="198" r="4.8"/>
    <circle cx="74" cy="206" r="3.2"/>
  </g>

  <!-- Front Card (Graph M, richest) -->
  <rect x="34" y="186" width="118" height="104" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
  <g stroke="#3E1B7A" stroke-opacity="0.45" stroke-width="1.6">
    <line x1="56" y1="214" x2="92" y2="206"/><line x1="92" y1="206" x2="130" y2="216"/>
    <line x1="92" y1="206" x2="96" y2="244"/><line x1="56" y1="214" x2="96" y2="244"/>
    <line x1="130" y1="216" x2="96" y2="244"/><line x1="130" y1="216" x2="128" y2="264"/>
    <line x1="96" y1="244" x2="128" y2="264"/><line x1="96" y1="244" x2="62" y2="266"/>
    <line x1="56" y1="214" x2="62" y2="266"/><line x1="62" y1="266" x2="128" y2="264"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="56" cy="214" r="4.5" fill="#A855F7"/>
    <circle cx="92" cy="206" r="5.5" fill="#7C3AED"/>
    <circle cx="130" cy="216" r="5.2" fill="#7C3AED"/>
    <circle cx="96" cy="244" r="6.8" fill="#3E1B7A"/>
    <circle cx="62" cy="266" r="4.2" fill="#A855F7"/>
    <circle cx="128" cy="264" r="5.0" fill="#7C3AED"/>
  </g>

  <text x="104" y="314" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#3E1B7A">M = 200 Graphs</text>
  <text x="104" y="332" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Sizes n ∈ [10, 100]</text>

  <!-- Arrow 1 -->
  <line x1="164" y1="202" x2="192" y2="202" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrPurp)"/>

  <!-- Stage 2: Joint Degree Sorting & Block Binning -->
  <text x="270" y="79" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#0A0E17">Joint Degree Sort</text>

  <rect x="204" y="124" width="132" height="146" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <!-- 6 Equal-Width Latent Bins -->
  <g>
    <rect x="205" y="125" width="22" height="144" fill="#EDE9FE" fill-opacity="0.35"/>
    <rect x="249" y="125" width="22" height="144" fill="#EDE9FE" fill-opacity="0.35"/>
    <rect x="293" y="125" width="22" height="144" fill="#EDE9FE" fill-opacity="0.35"/>
    <line x1="227" y1="125" x2="227" y2="269" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="249" y1="125" x2="249" y2="269" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="271" y1="125" x2="271" y2="269" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="293" y1="125" x2="293" y2="269" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="315" y1="125" x2="315" y2="269" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <!-- Monotonic Sorted Degree Curve -->
  <path d="M 209 258 C 234 252 256 232 278 202 C 296 176 312 152 331 138" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <g fill="#3E1B7A" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="216" cy="256" r="3.8"/>
    <circle cx="238" cy="246" r="3.8"/>
    <circle cx="260" cy="226" r="3.8"/>
    <circle cx="282" cy="196" r="3.8"/>
    <circle cx="304" cy="164" r="3.8"/>
    <circle cx="326" cy="142" r="3.8"/>
  </g>
  <text x="270" y="290" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Normalized Ranks → k Blocks</text>

  <!-- Arrow 2 -->
  <line x1="344" y1="202" x2="374" y2="202" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrPurp)"/>

  <!-- Stage 3: Split-Diagonal Continuous W vs Step-Function Ŵ -->
  <text x="494" y="79" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#0A0E17">Graphon W vs. Step Ŵ</text>

  <!-- Upper-Right Triangle: Continuous Latent Graphon W(u,v) -->
  <g clip-path="url(#upperTri)">
    <rect x="392" y="94" width="204" height="204" fill="url(#graphonCont)"/>
    <!-- Delicate Equiprobability Contour Arcs -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.3">
      <path d="M 442 94 Q 446 150 498 200"/>
      <path d="M 488 94 Q 498 158 552 254"/>
      <path d="M 536 94 Q 548 150 596 226"/>
    </g>
  </g>

  <!-- Lower-Left Triangle: 6x6 Quantized Step-Function Estimate Ŵ (cell=34) -->
  <g clip-path="url(#lowerTri)">
    <!-- Row 0 (y=94) -->
    <rect x="392" y="94" width="34" height="34" fill="#F8F6FF"/>
    <!-- Row 1 (y=128) -->
    <rect x="392" y="128" width="34" height="34" fill="#EDE9FE"/>
    <rect x="426" y="128" width="34" height="34" fill="#A855F7" fill-opacity="0.24"/>
    <!-- Row 2 (y=162) -->
    <rect x="392" y="162" width="34" height="34" fill="#A855F7" fill-opacity="0.24"/>
    <rect x="426" y="162" width="34" height="34" fill="#A855F7" fill-opacity="0.44"/>
    <rect x="460" y="162" width="34" height="34" fill="#A855F7" fill-opacity="0.68"/>
    <!-- Row 3 (y=196) -->
    <rect x="392" y="196" width="34" height="34" fill="#A855F7" fill-opacity="0.44"/>
    <rect x="426" y="196" width="34" height="34" fill="#A855F7" fill-opacity="0.68"/>
    <rect x="460" y="196" width="34" height="34" fill="#A855F7" fill-opacity="0.90"/>
    <rect x="494" y="196" width="34" height="34" fill="#7C3AED" fill-opacity="0.88"/>
    <!-- Row 4 (y=230) -->
    <rect x="392" y="230" width="34" height="34" fill="#A855F7" fill-opacity="0.64"/>
    <rect x="426" y="230" width="34" height="34" fill="#A855F7" fill-opacity="0.86"/>
    <rect x="460" y="230" width="34" height="34" fill="#7C3AED" fill-opacity="0.86"/>
    <rect x="494" y="230" width="34" height="34" fill="#7C3AED"/>
    <rect x="528" y="230" width="34" height="34" fill="#3E1B7A" fill-opacity="0.86"/>
    <!-- Row 5 (y=264) -->
    <rect x="392" y="264" width="34" height="34" fill="#A855F7" fill-opacity="0.82"/>
    <rect x="426" y="264" width="34" height="34" fill="#7C3AED" fill-opacity="0.84"/>
    <rect x="460" y="264" width="34" height="34" fill="#7C3AED"/>
    <rect x="494" y="264" width="34" height="34" fill="#3E1B7A" fill-opacity="0.84"/>
    <rect x="528" y="264" width="34" height="34" fill="#3E1B7A" fill-opacity="0.94"/>
    <rect x="562" y="264" width="34" height="34" fill="#3E1B7A"/>

    <!-- Step Grid Hairlines -->
    <g stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.85">
      <line x1="426" y1="94" x2="426" y2="298"/><line x1="460" y1="94" x2="460" y2="298"/>
      <line x1="494" y1="94" x2="494" y2="298"/><line x1="528" y1="94" x2="528" y2="298"/>
      <line x1="562" y1="94" x2="562" y2="298"/>
      <line x1="392" y1="128" x2="596" y2="128"/><line x1="392" y1="162" x2="596" y2="162"/>
      <line x1="392" y1="196" x2="596" y2="196"/><line x1="392" y1="230" x2="596" y2="230"/>
      <line x1="392" y1="264" x2="596" y2="264"/>
    </g>
  </g>

  <!-- Outer Frame & Excluded Diagonal -->
  <rect x="392" y="94" width="204" height="204" fill="none" stroke="#3E1B7A" stroke-width="1.8"/>
  <line x1="392" y1="94" x2="596" y2="298" stroke="#FFFFFF" stroke-width="2.6"/>
  <line x1="392" y1="94" x2="596" y2="298" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- High-Contrast Floating Corner Badges inside Square -->
  <rect x="518" y="106" width="66" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="0.9"/>
  <text x="551" y="121" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#3E1B7A">True W</text>

  <rect x="404" y="264" width="66" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="0.9"/>
  <text x="437" y="279" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#7C3AED">Step Ŵ</text>

  <!-- Axis End Labels & Intensity Bar -->
  <text x="385" y="102" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">0</text>
  <text x="385" y="298" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">1</text>
  <text x="396" y="314" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">0</text>
  <text x="592" y="314" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">1</text>

  <!-- Edge Probability Scale Bar -->
  <rect x="444" y="324" width="100" height="8" rx="4" fill="url(#colorBar)" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="436" y="332" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">0</text>
  <text x="552" y="332" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">1</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target metric: <tspan font-weight="700" fill="#7C3AED">mise ↓</tspan></text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Off-Diagonal L² Error</text>
</svg>
