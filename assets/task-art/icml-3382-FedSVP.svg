<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>FedSVP: Semantic-Visual Prototype Alignment in Federated Adaptation</title>
  <desc>Ten non-IID federated clients upload compact visual prototypes from frozen CLIP features to a server, where regularized InfoNCE aligns visual prototypes with frozen semantic text anchors on a shared unit hypersphere.</desc>
  <defs>
    <clipPath id="svp-card-clip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="svp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="svp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="svp-sphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#DBEAFE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.16"/>
    </radialGradient>
    <pattern id="svp-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0A1E5E" opacity="0.15"/>
    </pattern>
    <marker id="svp-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 Z" fill="#0052FF"/>
    </marker>
    <marker id="svp-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 Z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <g clip-path="url(#svp-card-clip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#svp-bg)"/>
    <rect x="20" y="58" width="600" height="296" fill="url(#svp-dots)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#svp-accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="28" y="38" font-size="18" font-weight="700" fill="#0A0E17">FedSVP</text>
    <text x="612" y="37" text-anchor="end" font-size="12.5" fill="#475569">Semantic–Visual Federated Alignment</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="0.9" opacity="0.75"/>
  </g>

  <!-- Left: Non-IID Federated Clients -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="106" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0A1E5E">Non-IID Clients (ρ = 0.1)</text>

    <!-- Client 1 -->
    <rect x="34" y="92" width="144" height="46" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <circle cx="58" cy="115" r="14" fill="#DBEAFE"/>
    <path d="M 58 115 L 58 101 A 14 14 0 1 1 46 122 Z" fill="#0052FF"/>
    <path d="M 58 115 L 46 122 A 14 14 0 0 1 58 101 Z" fill="#0EA5E9" opacity="0.7"/>
    <circle cx="58" cy="115" r="5.5" fill="#FFFFFF"/>
    <text x="82" y="112" font-size="12" font-weight="700" fill="#0A0E17">Client 1</text>
    <rect x="82" y="120" width="46" height="5" rx="2.5" fill="#0052FF" opacity="0.8"/>
    <rect x="132" y="120" width="22" height="5" rx="2.5" fill="#0EA5E9" opacity="0.6"/>

    <!-- Client 2 -->
    <rect x="34" y="150" width="144" height="46" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <circle cx="58" cy="173" r="14" fill="#DBEAFE"/>
    <path d="M 58 173 L 58 159 A 14 14 0 1 1 45 167 Z" fill="#0EA5E9"/>
    <path d="M 58 173 L 45 167 A 14 14 0 0 1 58 159 Z" fill="#0A1E5E"/>
    <circle cx="58" cy="173" r="5.5" fill="#FFFFFF"/>
    <text x="82" y="170" font-size="12" font-weight="700" fill="#0A0E17">Client 2</text>
    <rect x="82" y="178" width="28" height="5" rx="2.5" fill="#0EA5E9"/>
    <rect x="114" y="178" width="44" height="5" rx="2.5" fill="#0A1E5E" opacity="0.7"/>

    <!-- Client 3 -->
    <rect x="34" y="208" width="144" height="46" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <circle cx="58" cy="231" r="14" fill="#DBEAFE"/>
    <path d="M 58 231 L 58 217 A 14 14 0 1 1 51 243 Z" fill="#059669"/>
    <path d="M 58 231 L 51 243 A 14 14 0 0 1 58 217 Z" fill="#0052FF" opacity="0.85"/>
    <circle cx="58" cy="231" r="5.5" fill="#FFFFFF"/>
    <text x="82" y="228" font-size="12" font-weight="700" fill="#0A0E17">Client 3</text>
    <rect x="82" y="236" width="52" height="5" rx="2.5" fill="#059669" opacity="0.85"/>
    <rect x="138" y="236" width="18" height="5" rx="2.5" fill="#0052FF" opacity="0.6"/>

    <!-- Ellipsis indicating K=10 -->
    <circle cx="106" cy="266" r="2.2" fill="#475569"/>
    <circle cx="106" cy="275" r="2.2" fill="#475569"/>
    <circle cx="106" cy="284" r="2.2" fill="#475569"/>

    <!-- Client K -->
    <rect x="34" y="294" width="144" height="46" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <circle cx="58" cy="317" r="14" fill="#DBEAFE"/>
    <path d="M 58 317 L 58 303 A 14 14 0 1 1 44 319 Z" fill="#0A1E5E"/>
    <path d="M 58 317 L 44 319 A 14 14 0 0 1 58 303 Z" fill="#0052FF"/>
    <circle cx="58" cy="317" r="5.5" fill="#FFFFFF"/>
    <text x="82" y="314" font-size="12" font-weight="700" fill="#0A0E17">Client K</text>
    <rect x="82" y="322" width="38" height="5" rx="2.5" fill="#0A1E5E" opacity="0.85"/>
    <rect x="124" y="322" width="34" height="5" rx="2.5" fill="#0EA5E9" opacity="0.65"/>

    <!-- Curved Prototype Upload Arcs to Server Hub -->
    <g fill="none" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 3">
      <path d="M 178 115 C 218 115 224 176 244 192" marker-end="url(#svp-arrow-cyan)"/>
      <path d="M 178 173 C 208 173 220 192 240 198" marker-end="url(#svp-arrow-cyan)"/>
      <path d="M 178 231 C 208 231 220 212 240 206" marker-end="url(#svp-arrow-cyan)"/>
      <path d="M 178 317 C 220 317 226 232 244 214" marker-end="url(#svp-arrow-cyan)"/>
    </g>
    <text x="242" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0A1E5E">C × 512</text>

    <!-- Server Aggregation Hub -->
    <circle cx="264" cy="202" r="22" fill="#DBEAFE" stroke="#0052FF" stroke-width="2.4"/>
    <text x="264" y="208" text-anchor="middle" font-size="17" font-weight="700" fill="#0A1E5E">Σ</text>
    <text x="264" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Server</text>

    <!-- Forward Arrow to Hypersphere -->
    <line x1="288" y1="202" x2="354" y2="202" stroke="#0052FF" stroke-width="2.8" marker-end="url(#svp-arrow-blue)"/>
  </g>

  <!-- Right: Frozen CLIP Unit Hypersphere Alignment -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="474" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0A1E5E">Frozen CLIP Prototype Sphere</text>

    <!-- Sphere Base -->
    <circle cx="474" cy="202" r="112" fill="url(#svp-sphere)" stroke="#0052FF" stroke-width="2.2" stroke-opacity="0.55"/>

    <!-- Latitude / Longitude Wireframe -->
    <g fill="none" stroke="#0EA5E9" stroke-width="1.1" opacity="0.45">
      <ellipse cx="474" cy="202" rx="112" ry="34"/>
      <ellipse cx="474" cy="202" rx="38" ry="112"/>
      <ellipse cx="474" cy="202" rx="84" ry="112" stroke-dasharray="4 4"/>
    </g>

    <!-- Class Decision Boundary Arcs on Sphere -->
    <path d="M 474 90 Q 470 198 370 245" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 474 90 Q 478 198 578 245" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 474 202 V 314" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Cluster 1 (Top-Left) -->
    <circle cx="418" cy="152" r="16" fill="#059669" opacity="0.14"/>
    <!-- Local visual protos -->
    <circle cx="386" cy="184" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="442" cy="118" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Pull arrows -->
    <path d="M 392 178 Q 402 164 410 158" fill="none" stroke="#0052FF" stroke-width="2.3" marker-end="url(#svp-arrow-blue)"/>
    <path d="M 437 125 Q 430 137 424 144" fill="none" stroke="#0052FF" stroke-width="2.3" marker-end="url(#svp-arrow-blue)"/>
    <!-- Semantic text anchor diamond -->
    <polygon points="418,142 428,152 418,162 408,152" fill="#0A1E5E" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Cluster 2 (Top-Right) -->
    <circle cx="530" cy="156" r="16" fill="#059669" opacity="0.14"/>
    <circle cx="562" cy="188" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="506" cy="122" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M 556 182 Q 546 169 538 162" fill="none" stroke="#0052FF" stroke-width="2.3" marker-end="url(#svp-arrow-blue)"/>
    <path d="M 511 129 Q 519 140 524 148" fill="none" stroke="#0052FF" stroke-width="2.3" marker-end="url(#svp-arrow-blue)"/>
    <polygon points="530,146 540,156 530,166 520,156" fill="#0A1E5E" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Cluster 3 (Bottom-Center) -->
    <circle cx="474" cy="264" r="16" fill="#059669" opacity="0.14"/>
    <circle cx="428" cy="278" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="520" cy="278" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M 436 276 Q 452 271 464 267" fill="none" stroke="#0052FF" stroke-width="2.3" marker-end="url(#svp-arrow-blue)"/>
    <path d="M 512 276 Q 496 271 484 267" fill="none" stroke="#0052FF" stroke-width="2.3" marker-end="url(#svp-arrow-blue)"/>
    <polygon points="474,254 484,264 474,274 464,264" fill="#0A1E5E" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Compact Legend beneath sphere -->
    <polygon points="348,332 354,338 348,344 342,338" fill="#0A1E5E"/>
    <text x="360" y="342" font-size="11.5" fill="#0A0E17">Text anchor</text>

    <circle cx="446" cy="338" r="5" fill="#0EA5E9"/>
    <text x="457" y="342" font-size="11.5" fill="#0A0E17">Visual</text>

    <line x1="510" y1="338" x2="532" y2="338" stroke="#0052FF" stroke-width="2.2" marker-end="url(#svp-arrow-blue)"/>
    <text x="540" y="342" font-size="11.5" font-weight="600" fill="#0052FF">InfoNCE</text>
  </g>

  <!-- Footer -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="0.9" opacity="0.75"/>
    <text x="28" y="380" font-size="12.5" fill="#475569">Target metric: <tspan font-weight="700" fill="#0052FF">genacc ↑</tspan></text>
    <text x="612" y="380" text-anchor="end" font-size="12" fill="#475569">UCF101 · 8-shot · PerAcc ≥ 86.5%</text>
  </g>
</svg>
