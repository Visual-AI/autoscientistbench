<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>PRS-Bridge — Projected Summary-Stat Polygenic Risk Scores</title>
  <desc>Block linkage disequilibrium triangle and eigenvalue projection feed into a sharp Bayesian bridge shrinkage prior producing sparse causal SNP weights for out-of-sample phenotype prediction.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FBF9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#114B46" opacity="0.16"/>
    </pattern>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 Z" fill="#0D9488"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="24" y="60" width="592" height="296" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#accentGrad)"/>
  </g>
  <rect x="0.75" y="0.75" width="638.5" height="398.5" rx="15.5" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">PRS-Bridge</text>
  <text x="612" y="38" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Projected Summary-Stat Polygenic Scores</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Zone 1: Block LD Triangle Heatmap + Eigenvalue Projection -->
  <rect x="30" y="76" width="172" height="266" rx="12" fill="#FFFFFF" fill-opacity="0.84" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="116" y="99" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#114B46">LD Block Matrix</text>

  <!-- Triangular Haploview LD Matrix (6 base blocks, half-diag = 12) -->
  <g stroke="#FFFFFF" stroke-width="1.2">
    <!-- Row 0 (base, cy=204) -->
    <polygon points="56,192 68,204 56,216 44,204" fill="#114B46"/>
    <polygon points="80,192 92,204 80,216 68,204" fill="#0D9488"/>
    <polygon points="104,192 116,204 104,216 92,204" fill="#10B981"/>
    <polygon points="128,192 140,204 128,216 116,204" fill="#CCFBF1"/>
    <polygon points="152,192 164,204 152,216 140,204" fill="#0D9488"/>
    <polygon points="176,192 188,204 176,216 164,204" fill="#114B46"/>
    <!-- Row 1 (cy=192) -->
    <polygon points="68,180 80,192 68,204 56,192" fill="#0D9488"/>
    <polygon points="92,180 104,192 92,204 80,192" fill="#114B46"/>
    <polygon points="116,180 128,192 116,204 104,192" fill="#CCFBF1"/>
    <polygon points="140,180 152,192 140,204 128,192" fill="#10B981"/>
    <polygon points="164,180 176,192 164,204 152,192" fill="#0D9488"/>
    <!-- Row 2 (cy=180) -->
    <polygon points="80,168 92,180 80,192 68,180" fill="#10B981"/>
    <polygon points="104,168 116,180 104,192 92,180" fill="#CCFBF1"/>
    <polygon points="128,168 140,180 128,192 116,180" fill="#F4FBF9"/>
    <polygon points="152,168 164,180 152,192 140,180" fill="#10B981"/>
    <!-- Row 3 (cy=168) -->
    <polygon points="92,156 104,168 92,180 80,168" fill="#CCFBF1"/>
    <polygon points="116,156 128,168 116,180 104,168" fill="#F4FBF9"/>
    <polygon points="140,156 152,168 140,180 128,168" fill="#CCFBF1"/>
    <!-- Row 4 (cy=156) -->
    <polygon points="104,144 116,156 104,168 92,156" fill="#F4FBF9"/>
    <polygon points="128,144 140,156 128,168 116,156" fill="#CCFBF1"/>
    <!-- Row 5 (apex, cy=144) -->
    <polygon points="116,132 128,144 116,156 104,144" fill="#F4FBF9" stroke="#CBD5E1" stroke-width="0.8"/>
  </g>
  <line x1="44" y1="226" x2="188" y2="226" stroke="#CBD5E1" stroke-opacity="0.65" stroke-width="1"/>

  <!-- Eigenvalue Scree Cutoff -->
  <line x1="44" y1="308" x2="188" y2="308" stroke="#475569" stroke-width="1.4"/>
  <!-- Retained top eigenmodes -->
  <rect x="49" y="244" width="12" height="64" rx="2" fill="#114B46"/>
  <rect x="66" y="262" width="12" height="46" rx="2" fill="#0D9488"/>
  <rect x="83" y="278" width="12" height="30" rx="2" fill="#10B981"/>
  <!-- Cutoff threshold line -->
  <line x1="102" y1="238" x2="102" y2="312" stroke="#E11D48" stroke-dasharray="4 3" stroke-width="1.8"/>
  <!-- Pruned small eigenvalues -->
  <rect x="109" y="293" width="11" height="15" rx="2" fill="#CBD5E1"/>
  <rect x="125" y="298" width="11" height="10" rx="2" fill="#CBD5E1"/>
  <rect x="141" y="301" width="11" height="7" rx="1.5" fill="#CBD5E1"/>
  <rect x="157" y="303" width="11" height="5" rx="1.5" fill="#CBD5E1"/>
  <rect x="173" y="305" width="11" height="3" rx="1" fill="#CBD5E1"/>
  <text x="146" y="258" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">λ ≥ 0.01</text>
  <text x="116" y="330" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Eigen-projection</text>

  <!-- Connector 1 -> 2 -->
  <line x1="203" y1="208" x2="219" y2="208" stroke="#0D9488" stroke-width="2.4" marker-end="url(#arrowTeal)"/>

  <!-- Zone 2: Bayesian Bridge Prior & Sparse SNP Effects -->
  <rect x="224" y="76" width="192" height="266" rx="12" fill="#FFFFFF" fill-opacity="0.84" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="320" y="99" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#114B46">Bridge Prior (α &lt; 1)</text>

  <!-- Bridge Prior Cusp vs Gaussian Reference -->
  <line x1="320" y1="112" x2="320" y2="204" stroke="#CBD5E1" stroke-dasharray="3 3" stroke-width="1.2"/>
  <line x1="242" y1="204" x2="398" y2="204" stroke="#475569" stroke-width="1.4"/>
  <!-- Reference Gaussian bell -->
  <path d="M 248 204 C 276 204, 294 156, 320 156 C 346 156, 364 204, 392 204" fill="none" stroke="#475569" stroke-opacity="0.45" stroke-dasharray="4 3" stroke-width="1.8"/>
  <!-- Razor-sharp Bridge prior cusp with heavy tails -->
  <path d="M 244 198 C 282 197, 306 190, 315 162 C 318 148, 319 124, 320 112 C 321 124, 322 148, 325 162 C 334 190, 358 197, 396 198 L 396 204 L 244 204 Z" fill="#0D9488" fill-opacity="0.20" stroke="#0D9488" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="320" y="218" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">0</text>
  <line x1="238" y1="226" x2="402" y2="226" stroke="#CBD5E1" stroke-opacity="0.65" stroke-width="1"/>

  <!-- Sparse SNP Effect Manhattan Spectrum -->
  <line x1="242" y1="308" x2="398" y2="308" stroke="#475569" stroke-width="1.4"/>
  <!-- Shrunk background noise SNPs -->
  <g stroke="#CBD5E1" stroke-width="2" stroke-linecap="round">
    <line x1="248" y1="308" x2="248" y2="303"/>
    <line x1="257" y1="308" x2="257" y2="305"/>
    <line x1="275" y1="308" x2="275" y2="302"/>
    <line x1="284" y1="308" x2="284" y2="304"/>
    <line x1="294" y1="308" x2="294" y2="303"/>
    <line x1="316" y1="308" x2="316" y2="304"/>
    <line x1="326" y1="308" x2="326" y2="302"/>
    <line x1="336" y1="308" x2="336" y2="305"/>
    <line x1="358" y1="308" x2="358" y2="303"/>
    <line x1="368" y1="308" x2="368" y2="304"/>
    <line x1="388" y1="308" x2="388" y2="303"/>
  </g>
  <!-- Sparse causal variant spikes -->
  <g stroke="#0D9488" stroke-width="2.8" stroke-linecap="round">
    <line x1="266" y1="308" x2="266" y2="258"/>
    <line x1="305" y1="308" x2="305" y2="242"/>
    <line x1="347" y1="308" x2="347" y2="252"/>
    <line x1="378" y1="308" x2="378" y2="266"/>
  </g>
  <circle cx="266" cy="258" r="4" fill="#10B981" stroke="#114B46" stroke-width="1.5"/>
  <circle cx="305" cy="242" r="4.5" fill="#10B981" stroke="#114B46" stroke-width="1.5"/>
  <circle cx="347" cy="252" r="4" fill="#10B981" stroke="#114B46" stroke-width="1.5"/>
  <circle cx="378" cy="266" r="4" fill="#10B981" stroke="#114B46" stroke-width="1.5"/>
  <text x="320" y="330" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Sparse β̂ (10⁻³ causal)</text>

  <!-- Connector 2 -> 3 -->
  <line x1="417" y1="208" x2="433" y2="208" stroke="#0D9488" stroke-width="2.4" marker-end="url(#arrowTeal)"/>

  <!-- Zone 3: Out-of-Sample Phenotype Prediction -->
  <rect x="438" y="76" width="174" height="266" rx="12" fill="#FFFFFF" fill-opacity="0.86" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="525" y="99" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#114B46">Phenotype R²</text>

  <!-- Axes -->
  <line x1="464" y1="118" x2="464" y2="304" stroke="#475569" stroke-width="1.5"/>
  <line x1="464" y1="304" x2="598" y2="304" stroke="#475569" stroke-width="1.5"/>
  <text x="454" y="128" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#475569">Y</text>
  <text x="531" y="330" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#475569">PRS = Gβ̂</text>

  <!-- Shaded correlation band -->
  <polygon points="470,296 592,164 592,126 470,258" fill="#CCFBF1" fill-opacity="0.65"/>

  <!-- Phenotype scatter points -->
  <g fill="#0D9488" fill-opacity="0.68">
    <circle cx="478" cy="276" r="3.2"/><circle cx="486" cy="258" r="3.2"/><circle cx="492" cy="282" r="3.2"/>
    <circle cx="498" cy="248" r="3.2"/><circle cx="505" cy="264" r="3.2"/><circle cx="511" cy="226" r="3.2"/>
    <circle cx="516" cy="242" r="3.2"/><circle cx="523" cy="212" r="3.2"/><circle cx="529" cy="232" r="3.2"/>
    <circle cx="534" cy="196" r="3.2"/><circle cx="540" cy="218" r="3.2"/><circle cx="546" cy="182" r="3.2"/>
    <circle cx="552" cy="204" r="3.2"/><circle cx="558" cy="170" r="3.2"/><circle cx="564" cy="190" r="3.2"/>
    <circle cx="570" cy="158" r="3.2"/><circle cx="576" cy="176" r="3.2"/><circle cx="584" cy="146" r="3.2"/>
    <circle cx="520" cy="252" r="3.2"/><circle cx="544" cy="166" r="3.2"/><circle cx="566" cy="144" r="3.2"/>
  </g>
  <!-- Regression line -->
  <line x1="470" y1="280" x2="592" y2="144" stroke="#114B46" stroke-width="3" stroke-linecap="round"/>
  <text x="568" y="286" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0D9488">corr² ↑</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
  <text x="28" y="378" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">GWAS summary stats + LD · Chr 1–22</text>
  <text x="612" y="378" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#0D9488">mean_r2 ↑</tspan></text>
</svg>
