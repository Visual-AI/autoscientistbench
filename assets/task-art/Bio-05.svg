<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>SNooPy: Long-Read Metagenomic SNP Calling</title>
  <desc>Noisy long reads aligned to a metagenomic assembly separate true strain SNPs that co-occur across shared reads and correlated loci from independent random sequencing errors via a combinatorial co-occurrence test.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FBF9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#114B46" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <g clip-path="url(#cardClip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base Plate -->
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="24" y="58" width="592" height="296" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#accentBar)"/>

    <!-- Header Zone (y=18..54) -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17">SNooPy</text>
    <text x="612" y="36" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Long-Read Metagenomic SNP Calling</text>
    <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>

    <!-- LEFT & CENTER HERO: Noisy Long-Read Pileup Alignment -->
    <g>
      <!-- Reference Assembly Contig Track -->
      <rect x="38" y="80" width="372" height="22" rx="6" fill="#114B46"/>
      <text x="224" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Reference Assembly Contig</text>

      <!-- 3 Correlated SNP Column Corridors -->
      <g fill="#CCFBF1" fill-opacity="0.65" stroke="#0D9488" stroke-width="1.2" stroke-dasharray="4 3">
        <rect x="114" y="106" width="20" height="206" rx="3"/>
        <rect x="214" y="106" width="20" height="206" rx="3"/>
        <rect x="320" y="106" width="20" height="206" rx="3"/>
      </g>

      <!-- Strain A Cluster (Upper 5 Long Reads sharing b=3 Correlated SNPs) -->
      <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3">
        <rect x="44" y="118" width="348" height="12" rx="4"/>
        <rect x="58" y="136" width="346" height="12" rx="4"/>
        <rect x="38" y="154" width="356" height="12" rx="4"/>
        <rect x="52" y="172" width="352" height="12" rx="4"/>
        <rect x="42" y="190" width="342" height="12" rx="4"/>
      </g>

      <!-- Co-occurring Strain SNP Blocks (a=5 reads × b=3 loci) -->
      <g fill="#0D9488">
        <!-- Column L1 (x=118) -->
        <rect x="118" y="118" width="12" height="12" rx="2"/>
        <rect x="118" y="136" width="12" height="12" rx="2"/>
        <rect x="118" y="154" width="12" height="12" rx="2"/>
        <rect x="118" y="172" width="12" height="12" rx="2"/>
        <rect x="118" y="190" width="12" height="12" rx="2"/>
        <!-- Column L2 (x=218) -->
        <rect x="218" y="118" width="12" height="12" rx="2"/>
        <rect x="218" y="136" width="12" height="12" rx="2"/>
        <rect x="218" y="154" width="12" height="12" rx="2"/>
        <rect x="218" y="172" width="12" height="12" rx="2"/>
        <rect x="218" y="190" width="12" height="12" rx="2"/>
        <!-- Column L3 (x=324) -->
        <rect x="324" y="118" width="12" height="12" rx="2"/>
        <rect x="324" y="136" width="12" height="12" rx="2"/>
        <rect x="324" y="154" width="12" height="12" rx="2"/>
        <rect x="324" y="172" width="12" height="12" rx="2"/>
        <rect x="324" y="190" width="12" height="12" rx="2"/>
      </g>

      <!-- Subtle Haplotype Partition Line -->
      <line x1="38" y1="212" x2="410" y2="212" stroke="#10B981" stroke-width="1.3" stroke-dasharray="5 4" stroke-opacity="0.7"/>

      <!-- Strain B / Reference Reads (Lower 5 Long Reads) -->
      <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3">
        <rect x="46" y="222" width="358" height="12" rx="4"/>
        <rect x="38" y="240" width="346" height="12" rx="4"/>
        <rect x="54" y="258" width="352" height="12" rx="4"/>
        <rect x="40" y="276" width="350" height="12" rx="4"/>
        <rect x="52" y="294" width="354" height="12" rx="4"/>
      </g>

      <!-- Independent Scattered 5% Sequencing Errors (Crimson Ticks) -->
      <g fill="#E11D48">
        <rect x="74" y="118" width="5" height="12" rx="1"/>
        <rect x="276" y="118" width="5" height="12" rx="1"/>
        <rect x="168" y="136" width="5" height="12" rx="1"/>
        <rect x="366" y="136" width="5" height="12" rx="1"/>
        <rect x="92" y="154" width="5" height="12" rx="1"/>
        <rect x="254" y="154" width="5" height="12" rx="1"/>
        <rect x="192" y="172" width="5" height="12" rx="1"/>
        <rect x="296" y="190" width="5" height="12" rx="1"/>
        <rect x="152" y="222" width="5" height="12" rx="1"/>
        <rect x="284" y="222" width="5" height="12" rx="1"/>
        <rect x="86" y="240" width="5" height="12" rx="1"/>
        <rect x="262" y="240" width="5" height="12" rx="1"/>
        <rect x="180" y="258" width="5" height="12" rx="1"/>
        <rect x="362" y="258" width="5" height="12" rx="1"/>
        <rect x="100" y="276" width="5" height="12" rx="1"/>
        <rect x="298" y="276" width="5" height="12" rx="1"/>
        <rect x="164" y="294" width="5" height="12" rx="1"/>
        <rect x="248" y="294" width="5" height="12" rx="1"/>
      </g>

      <!-- Clean Bottom Legend -->
      <g transform="translate(46, 336)" font-size="12" font-weight="600">
        <rect x="0" y="-10" width="12" height="12" rx="2.5" fill="#0D9488"/>
        <text x="18" y="0" fill="#0D9488">Correlated SNPs (a × b)</text>
        <rect x="188" y="-10" width="6" height="12" rx="1.5" fill="#E11D48"/>
        <text x="200" y="0" fill="#E11D48">Random 5% Errors</text>
      </g>
    </g>

    <!-- RIGHT: Column Correlation Clustering + Exact Co-occurrence Test -->
    <g>
      <!-- Top Card: Locus-by-Locus Correlation Matrix -->
      <rect x="434" y="80" width="178" height="148" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="523" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0E17">Locus Correlation</text>

      <!-- 5x5 Heatmap: 3x3 True SNP Cluster + 2 Noise Loci -->
      <g transform="translate(473, 112)">
        <!-- 3x3 Co-occurring SNP Block -->
        <rect x="0" y="0" width="20" height="20" fill="#114B46"/>
        <rect x="20" y="0" width="20" height="20" fill="#0D9488"/>
        <rect x="40" y="0" width="20" height="20" fill="#10B981"/>
        <rect x="60" y="0" width="20" height="20" fill="#F4FBF9"/>
        <rect x="80" y="0" width="20" height="20" fill="#F4FBF9"/>

        <rect x="0" y="20" width="20" height="20" fill="#0D9488"/>
        <rect x="20" y="20" width="20" height="20" fill="#114B46"/>
        <rect x="40" y="20" width="20" height="20" fill="#0D9488"/>
        <rect x="60" y="20" width="20" height="20" fill="#F4FBF9"/>
        <rect x="80" y="20" width="20" height="20" fill="#F4FBF9"/>

        <rect x="0" y="40" width="20" height="20" fill="#10B981"/>
        <rect x="20" y="40" width="20" height="20" fill="#0D9488"/>
        <rect x="40" y="40" width="20" height="20" fill="#114B46"/>
        <rect x="60" y="40" width="20" height="20" fill="#F4FBF9"/>
        <rect x="80" y="40" width="20" height="20" fill="#F4FBF9"/>

        <!-- Uncorrelated Noise Rows -->
        <rect x="0" y="60" width="20" height="20" fill="#F4FBF9"/>
        <rect x="20" y="60" width="20" height="20" fill="#F4FBF9"/>
        <rect x="40" y="60" width="20" height="20" fill="#F4FBF9"/>
        <rect x="60" y="60" width="20" height="20" fill="#E11D48" fill-opacity="0.35"/>
        <rect x="80" y="60" width="20" height="20" fill="#F4FBF9"/>

        <rect x="0" y="80" width="20" height="20" fill="#F4FBF9"/>
        <rect x="20" y="80" width="20" height="20" fill="#F4FBF9"/>
        <rect x="40" y="80" width="20" height="20" fill="#F4FBF9"/>
        <rect x="60" y="80" width="20" height="20" fill="#F4FBF9"/>
        <rect x="80" y="80" width="20" height="20" fill="#E11D48" fill-opacity="0.35"/>

        <!-- Crisp Outer Frame + Highlighted True Cluster Box -->
        <rect x="0" y="0" width="100" height="100" rx="3" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
        <rect x="0" y="0" width="60" height="60" rx="2" fill="none" stroke="#059669" stroke-width="2.4"/>
      </g>

      <!-- Bottom Card: Statistical Co-occurrence Threshold -->
      <rect x="434" y="242" width="178" height="96" rx="12" fill="#CCFBF1" fill-opacity="0.45" stroke="#0D9488" stroke-width="1.8"/>
      <text x="523" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#114B46">Co-occurrence Test</text>
      <text x="523" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0D9488">sᵃᵇ C(n,a) C(m,b)</text>
      <text x="523" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">&lt; 0.001 → True SNP</text>
    </g>

    <!-- Footer Bar (y=378) -->
    <line x1="28" y1="357" x2="612" y2="357" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.75"/>
    <text x="28" y="378" font-size="12.5" fill="#475569">4-strain mixture · 5% error · ploidy-free</text>
    <text x="612" y="378" text-anchor="end" font-size="12.5" fill="#475569">Metric <tspan font-weight="700" fill="#0D9488">snp_f1 ↑</tspan></text>
  </g>

  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-opacity="0.75"/>
</svg>
