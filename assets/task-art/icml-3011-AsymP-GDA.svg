<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>AsymP-GDA: Asymmetric Perturbation in Bilinear Saddle-Point Games</title>
  <desc>Phase portrait showing asymmetric single-player perturbation spirals converging to the exact Nash equilibrium while unperturbed updates cycle and symmetric perturbation shifts the saddle, paired with last-iterate NashConv decay.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="nash-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.01"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#4F46E5" opacity="0.16"/>
    </pattern>
    <marker id="arr-indigo" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0.5 0.5 L6.5 3.5 L0.5 6.5 Z" fill="#4F46E5"/>
    </marker>
    <marker id="arr-violet" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0.5 0.5 L6.5 3.5 L0.5 6.5 Z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-rose" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0.5 0.5 L5.5 3 L0.5 5.5 Z" fill="#E11D48"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Plate Background -->
    <rect width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="0" y="54" width="640" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="#4F46E5"/>

    <!-- Header -->
    <text x="28" y="36" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">AsymP-GDA</text>
    <text x="612" y="36" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Asymmetric Bilinear Saddle Optimization</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Left Panel: Bilinear Saddle Phase Portrait -->
    <rect x="28" y="68" width="356" height="278" rx="12" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
    <text x="42" y="88" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Bilinear Saddle Phase Plane</text>
    <text x="370" y="88" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">xᵀAy</text>

    <!-- Hyperbolic Saddle Level Contours centered at (206, 208) -->
    <g fill="none" stroke="#E0E7FF" stroke-width="1.6">
      <path d="M 220 106 Q 226 190 356 196"/>
      <path d="M 244 106 Q 252 170 356 178"/>
      <path d="M 192 106 Q 186 190 56 196"/>
      <path d="M 168 106 Q 160 170 56 178"/>
      <path d="M 56 220 Q 186 226 192 316"/>
      <path d="M 56 238 Q 160 246 168 316"/>
      <path d="M 356 220 Q 226 226 220 316"/>
      <path d="M 356 238 Q 252 246 244 316"/>
    </g>

    <!-- Saddle Axes -->
    <line x1="48" y1="208" x2="366" y2="208" stroke="#CBD5E1" stroke-width="1.2"/>
    <line x1="206" y1="102" x2="206" y2="318" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="366" y="201" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">x (P1)</text>
    <text x="213" y="112" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">y (P2)</text>

    <!-- Unperturbed GDA Cycling Orbit -->
    <ellipse cx="206" cy="208" rx="90" ry="70" fill="none" stroke="#475569" stroke-opacity="0.45" stroke-width="1.8" stroke-dasharray="5 5"/>
    <text x="52" y="122" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">GDA cycle</text>

    <!-- Symmetric Perturbation (Biased Shifted Point) -->
    <path d="M 352 162 C 348 134 316 122 300 138 C 290 148 302 164 316 156 C 324 152 322 142 315 144" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-rose)"/>
    <g stroke="#E11D48" stroke-width="2.2" stroke-linecap="round">
      <line x1="306" y1="140" x2="314" y2="148"/>
      <line x1="314" y1="140" x2="306" y2="148"/>
    </g>
    <text x="310" y="118" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">SymP shift</text>

    <!-- Asymmetric Run 0 (Perturb P1 -> exact x*) -->
    <path d="M 104 168 C 122 122 224 118 268 158 C 296 184 278 248 228 254 C 178 260 156 220 176 192 C 188 176 218 182 213 200" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-indigo)"/>
    <circle cx="104" cy="168" r="4.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="42" y="188" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">Run 0 (μ₁)</text>

    <!-- Asymmetric Run 1 (Perturb P2 -> exact y*) -->
    <path d="M 134 294 C 202 310 296 278 308 218 C 316 178 268 142 218 150 C 174 158 154 196 174 226 C 188 244 220 236 213 217" fill="none" stroke="#8B5CF6" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr-violet)"/>
    <circle cx="134" cy="294" r="4.5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="42" y="298" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#8B5CF6">Run 1 (μ₂)</text>

    <!-- True Nash Equilibrium Target -->
    <circle cx="206" cy="208" r="24" fill="url(#nash-glow)"/>
    <path d="M 206 198 L 216 208 L 206 218 L 196 208 Z" fill="#059669" stroke="#FFFFFF" stroke-width="2.2"/>
    <text x="206" y="336" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">True Nash (x*, y*)</text>

    <!-- Top Right Card: Dual-Run Pairing -->
    <rect x="398" y="68" width="214" height="114" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="412" y="88" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Asymmetric Dual Runs</text>

    <rect x="412" y="100" width="82" height="28" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.6"/>
    <text x="453" y="118" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#261E6B">Run 0 · μ₁</text>
    <line x1="494" y1="114" x2="524" y2="128" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr-indigo)"/>

    <rect x="412" y="138" width="82" height="28" rx="8" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-width="1.6"/>
    <text x="453" y="156" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#261E6B">Run 1 · μ₂</text>
    <line x1="494" y1="152" x2="524" y2="138" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-violet)"/>

    <rect x="532" y="111" width="68" height="44" rx="10" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.8"/>
    <text x="566" y="129" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#059669">(x, y)</text>
    <text x="566" y="146" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#059669">t = T</text>

    <!-- Bottom Right Card: Last-Iterate NashConv Decay -->
    <rect x="398" y="194" width="214" height="152" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="412" y="214" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">Last-Iterate NashConv</text>

    <!-- Plot Axes -->
    <line x1="420" y1="224" x2="420" y2="320" stroke="#475569" stroke-width="1.6"/>
    <line x1="420" y1="320" x2="598" y2="320" stroke="#475569" stroke-width="1.6"/>

    <!-- DGDA Cycling Curve -->
    <path d="M 424 242 Q 442 232 460 244 T 496 242 T 532 245 T 568 242 T 594 244" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="594" y="234" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">DGDA</text>

    <!-- SymP Plateau Curve -->
    <path d="M 424 244 C 450 264 476 268 518 268 L 594 268" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="2 3"/>
    <text x="594" y="263" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">SymP</text>

    <!-- AsymP-DGDA Converging Curve -->
    <path d="M 424 246 C 454 274 504 298 592 314 L 592 320 L 424 320 Z" fill="url(#curve-fill)"/>
    <path d="M 424 246 C 454 274 504 298 592 314" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="592" cy="314" r="4" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="588" y="295" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#4F46E5">AsymP</text>

    <text x="509" y="337" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Counted Traversals →</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <text x="28" y="378" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">Leduc zero-sum · η = 0.1 · 2M traversals</text>
    <text x="612" y="378" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
      <tspan fill="#475569">Target: </tspan><tspan font-weight="700" fill="#4F46E5">nashconv ↓</tspan>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.75"/>
</svg>
