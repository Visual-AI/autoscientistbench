<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>HSG-12M — Non-Hermitian Crystal Spectral Multigraphs</title>
  <desc>Complex-plane energy spectrum of a one-dimensional non-Hermitian crystal represented as a spatial multigraph with parallel curved multi-edges, spectral arcs, and electrostatic potential contours classified by a capacity-controlled GNN into 24 Hamiltonian families.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="potential-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#FEF3C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.15"/>
    </pattern>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Base luminous plate -->
    <rect x="0" y="0" width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="24" y="60" width="592" height="292" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accent-bar)"/>

    <!-- Header -->
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17" letter-spacing="-0.3">HSG-12M</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Non-Hermitian Spectral Multigraphs</text>
    <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>

    <!-- LEFT-CENTER PANEL: Complex Energy Plane Spatial Multigraph -->
    <rect x="34" y="70" width="372" height="278" rx="10" fill="#FFFFFF" fill-opacity="0.78" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Electrostatic potential & DOS equipotential field -->
    <ellipse cx="216" cy="212" rx="154" ry="110" fill="url(#potential-glow)"/>
    <ellipse cx="216" cy="212" rx="142" ry="96" fill="none" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="4,4"/>
    <ellipse cx="216" cy="212" rx="108" ry="72" fill="none" stroke="#D97706" stroke-opacity="0.24" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Complex Plane Axes Re(E) and Im(E) -->
    <line x1="52" y1="212" x2="388" y2="212" stroke="#475569" stroke-opacity="0.5" stroke-width="1.3" marker-end="url(#arrow-axis)"/>
    <line x1="216" y1="292" x2="216" y2="86" stroke="#475569" stroke-opacity="0.5" stroke-width="1.3" marker-end="url(#arrow-axis)"/>
    <text x="386" y="202" text-anchor="end" font-size="11.5" font-weight="600" fill="#475569">Re(E)</text>
    <text x="224" y="96" font-size="11.5" font-weight="600" fill="#475569">Im(E)</text>

    <!-- Central spectral loop interior wash (enclosed by parallel multi-edges) -->
    <path d="M 152 212 Q 212 162 272 212 Q 212 262 152 212 Z" fill="#FEF3C7" fill-opacity="0.72"/>

    <!-- NON-HERMITIAN SPATIAL MULTIGRAPH EDGES -->
    <!-- Parallel curved multi-edges between v0=(152,212) and v1=(272,212) -->
    <path d="M 152 212 Q 212 162 272 212" fill="none" stroke="#D97706" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 152 212 Q 212 262 272 212" fill="none" stroke="#F59E0B" stroke-width="3.4" stroke-linecap="round"/>

    <!-- Second parallel teardrop multi-edge pair between v0=(152,212) and v2=(212,148) -->
    <path d="M 152 212 C 148 164, 178 140, 212 148" fill="none" stroke="#6E3A05" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 152 212 C 178 188, 198 170, 212 148" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Open-boundary crystal spectral arcs (GBZ branches) -->
    <path d="M 152 212 Q 118 190 96 154" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M 152 212 Q 120 242 90 272" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M 272 212 Q 306 184 336 154" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M 272 212 Q 308 240 340 270" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M 272 212 Q 258 164 212 148" fill="none" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 212 148 Q 204 126 196 112" fill="none" stroke="#6E3A05" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Edge midpoint geometry attribute diamonds (displacement, potential, DOS) -->
    <g fill="#FFFFFF" stroke="#6E3A05" stroke-width="1.5">
      <polygon points="212,182 216,186 212,190 208,186"/>
      <polygon points="212,234 216,238 212,242 208,238"/>
      <polygon points="168,158 172,162 168,166 164,162"/>
      <polygon points="306,180 310,184 306,188 302,184"/>
    </g>

    <!-- Spatial Multigraph Nodes (junctions & endpoints, sized by local DOS) -->
    <g>
      <!-- High-DOS branch junctions -->
      <circle cx="152" cy="212" r="10" fill="#F59E0B" fill-opacity="0.25"/>
      <circle cx="152" cy="212" r="5.8" fill="#6E3A05" stroke="#FFFFFF" stroke-width="2"/>

      <circle cx="272" cy="212" r="10" fill="#F59E0B" fill-opacity="0.25"/>
      <circle cx="272" cy="212" r="5.8" fill="#6E3A05" stroke="#FFFFFF" stroke-width="2"/>

      <circle cx="212" cy="148" r="8.5" fill="#F59E0B" fill-opacity="0.25"/>
      <circle cx="212" cy="148" r="5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.8"/>

      <!-- Arc endpoints -->
      <circle cx="96" cy="154" r="4.6" fill="#D97706" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="90" cy="272" r="4.6" fill="#D97706" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="336" cy="154" r="4.6" fill="#D97706" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="340" cy="270" r="4.6" fill="#D97706" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="196" cy="112" r="4.2" fill="#6E3A05" stroke="#FFFFFF" stroke-width="1.6"/>
    </g>

    <!-- Clean non-overlapping annotations inside complex plane -->
    <text x="98" y="114" text-anchor="middle" font-size="11.5" font-weight="600" fill="#D97706">Spectral Arcs</text>
    <line x1="98" y1="120" x2="96" y2="144" stroke="#D97706" stroke-width="1.3"/>

    <text x="342" y="114" text-anchor="middle" font-size="11.5" font-weight="500" fill="#475569">Potential Φ</text>

    <text x="216" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#6E3A05">Parallel Multi-Edges</text>
    <line x1="212" y1="304" x2="212" y2="246" stroke="#6E3A05" stroke-width="1.3" stroke-dasharray="3,2"/>

    <!-- Bridge Arrow -->
    <line x1="409" y1="208" x2="432" y2="208" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

    <!-- RIGHT PANEL: Controlled GNN & 24-Class Hamiltonian Readout -->
    <rect x="436" y="70" width="176" height="278" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1"/>
    <text x="524" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#6E3A05">Controlled GNN</text>

    <!-- Stacked message-passing GNN layers -->
    <rect x="458" y="104" width="132" height="18" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="524" y="117" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6E3A05">Node + Edge Geometry</text>

    <rect x="470" y="130" width="108" height="18" rx="5" fill="#F59E0B" fill-opacity="0.28" stroke="#D97706" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="524" y="143" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6E3A05">4× Message Passing</text>

    <rect x="484" y="156" width="80" height="18" rx="5" fill="#D97706" fill-opacity="0.88"/>
    <text x="524" y="169" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFFFFF">Global Pool</text>

    <!-- Capacity budget pill -->
    <rect x="456" y="184" width="136" height="22" rx="11" fill="#FFFBF2" stroke="#D97706" stroke-opacity="0.4" stroke-width="1"/>
    <text x="524" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#6E3A05">≤731k · 1k steps</text>

    <!-- 24-Class Hamiltonian Spectrum Readout -->
    <line x1="450" y1="316" x2="598" y2="316" stroke="#475569" stroke-opacity="0.55" stroke-width="1.2"/>
    <g fill="#F59E0B" fill-opacity="0.52">
      <rect x="453" y="308" width="4" height="8" rx="1"/>
      <rect x="459" y="302" width="4" height="14" rx="1"/>
      <rect x="465" y="310" width="4" height="6" rx="1"/>
      <rect x="471" y="296" width="4" height="20" rx="1"/>
      <rect x="477" y="306" width="4" height="10" rx="1"/>
      <rect x="483" y="309" width="4" height="7" rx="1"/>
      <rect x="489" y="292" width="4" height="24" rx="1"/>
      <rect x="495" y="304" width="4" height="12" rx="1"/>
      <rect x="501" y="310" width="4" height="6" rx="1"/>
      <rect x="507" y="300" width="4" height="16" rx="1"/>
      <rect x="513" y="307" width="4" height="9" rx="1"/>
      <rect x="519" y="295" width="4" height="21" rx="1"/>
      <rect x="525" y="306" width="4" height="10" rx="1"/>
      <rect x="531" y="310" width="4" height="6" rx="1"/>
      <rect x="537" y="298" width="4" height="18" rx="1"/>
      <!-- Winning Hamiltonian class peak -->
      <rect x="543" y="242" width="4.5" height="74" rx="1.5" fill="#D97706" fill-opacity="1"/>
      <rect x="549" y="292" width="4" height="24" rx="1"/>
      <rect x="555" y="306" width="4" height="10" rx="1"/>
      <rect x="561" y="309" width="4" height="7" rx="1"/>
      <rect x="567" y="302" width="4" height="14" rx="1"/>
      <rect x="573" y="308" width="4" height="8" rx="1"/>
      <rect x="579" y="298" width="4" height="18" rx="1"/>
      <rect x="585" y="307" width="4" height="9" rx="1"/>
      <rect x="591" y="310" width="4" height="6" rx="1"/>
    </g>
    <circle cx="545.25" cy="240" r="3.6" fill="#059669" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="545" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#059669">H*</text>
    <text x="524" y="336" text-anchor="middle" font-size="11.5" font-weight="500" fill="#475569">24 Hamiltonian Classes</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="1"/>
    <text x="28" y="381" font-size="12" font-weight="500" fill="#475569">One-band crystals · controlled capacity</text>
    <text x="612" y="381" text-anchor="end" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#D97706">accuracy ↑</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>
</svg>
