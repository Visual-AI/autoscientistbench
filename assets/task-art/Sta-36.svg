<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>DP-FRT — Differentially Private Fisher Randomization Test</title>
  <desc>A two-sided geometric denoising posterior over integer binary outcome counts maps through the hypergeometric Fisher randomization test to a discrete p-value distribution and central 95% credible set.</desc>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6B1028" opacity="0.15"/>
    </pattern>
    <marker id="arrRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#E11D48"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#059669"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="16" y="56" width="608" height="298" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#accentGrad)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="37" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">DP-FRT</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#475569">Geometric Denoising &amp; 95% Credible Set</text>
  <line x1="28" y1="53" x2="612" y2="53" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Left Panel: 2D L1 Geometric Denoising Lattice -->
  <text x="158" y="79" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#0A0E17">Denoising Posterior (ε)</text>

  <!-- Count Axes -->
  <line x1="60" y1="104" x2="60" y2="298" stroke="#0A0E17" stroke-width="1.5"/>
  <line x1="60" y1="298" x2="258" y2="298" stroke="#0A0E17" stroke-width="1.5"/>
  <text x="54" y="112" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#475569">b</text>
  <text x="262" y="302" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#475569">a</text>

  <!-- Nested L1 Diamond Contours centered at noisy release (158, 200) -->
  <polygon points="158,108 250,200 158,292 66,200" fill="#FFE4E6" fill-opacity="0.58" stroke="#F43F5E" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="158,132 226,200 158,268 90,200" fill="#F43F5E" fill-opacity="0.18" stroke="#E11D48" stroke-opacity="0.65" stroke-width="1.6"/>
  <polygon points="158,166 192,200 158,234 124,200" fill="#E11D48" fill-opacity="0.24" stroke="#E11D48" stroke-width="2"/>

  <!-- Subtle Lattice Gridlines (5x5: a in 90,124,158,192,226; b in 132,166,200,234,268) -->
  <g stroke="#CBD5E1" stroke-width="0.9" stroke-opacity="0.65">
    <line x1="90" y1="120" x2="90" y2="280"/><line x1="124" y1="120" x2="124" y2="280"/>
    <line x1="158" y1="120" x2="158" y2="280"/><line x1="192" y1="120" x2="192" y2="280"/>
    <line x1="226" y1="120" x2="226" y2="280"/>
    <line x1="78" y1="132" x2="238" y2="132"/><line x1="78" y1="166" x2="238" y2="166"/>
    <line x1="78" y1="200" x2="238" y2="200"/><line x1="78" y1="234" x2="238" y2="234"/>
    <line x1="78" y1="268" x2="238" y2="268"/>
  </g>

  <!-- Discrete Integer Lattice Nodes Weighted by exp(-eps * L1) -->
  <!-- Far L1 >= 3 -->
  <g fill="#475569" fill-opacity="0.35">
    <circle cx="90" cy="132" r="2.6"/><circle cx="124" cy="132" r="3.0"/><circle cx="192" cy="132" r="3.0"/><circle cx="226" cy="132" r="2.6"/>
    <circle cx="90" cy="166" r="3.0"/><circle cx="226" cy="166" r="3.0"/>
    <circle cx="90" cy="234" r="3.0"/><circle cx="226" cy="234" r="3.0"/>
    <circle cx="90" cy="268" r="2.6"/><circle cx="124" cy="268" r="3.0"/><circle cx="192" cy="268" r="3.0"/><circle cx="226" cy="268" r="2.6"/>
  </g>
  <!-- Mid L1 = 2 -->
  <g fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.2">
    <circle cx="158" cy="132" r="4.4"/><circle cx="158" cy="268" r="4.4"/>
    <circle cx="90" cy="200" r="4.4"/><circle cx="226" cy="200" r="4.4"/>
    <circle cx="124" cy="166" r="4.4"/><circle cx="192" cy="166" r="4.4"/>
    <circle cx="124" cy="234" r="4.4"/><circle cx="192" cy="234" r="4.4"/>
  </g>
  <!-- Near L1 = 1 -->
  <g fill="#E11D48" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="158" cy="166" r="5.6"/><circle cx="158" cy="234" r="5.6"/>
    <circle cx="124" cy="200" r="5.6"/><circle cx="192" cy="200" r="5.6"/>
  </g>
  <!-- Center Noisy Release (t11, t01) -->
  <circle cx="158" cy="200" r="10.5" fill="none" stroke="#6B1028" stroke-width="1.6" stroke-opacity="0.5"/>
  <circle cx="158" cy="200" r="6.8" fill="#6B1028" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Clean Corner Tag & Weight Formula -->
  <text x="248" y="114" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#6B1028">(t₁₁, t₀₁)</text>
  <text x="158" y="324" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6B1028">w ∝ exp(−ε ‖t − (a,b)‖₁)</text>

  <!-- Mapping Arrow -->
  <line x1="274" y1="200" x2="338" y2="200" stroke="#E11D48" stroke-width="2.4" marker-end="url(#arrRose)"/>
  <text x="306" y="185" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6B1028">Hypergeom.</text>
  <text x="306" y="220" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">p_FRT(a, b)</text>

  <!-- Right Panel: Discrete Posterior p_FRT Mass & Central 95% Credible Set -->
  <text x="484" y="79" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#0A0E17">Discrete Posterior p-Values</text>

  <!-- Central 95% Credible Region Highlight -->
  <rect x="414" y="128" width="130" height="170" fill="#059669" fill-opacity="0.09"/>
  <line x1="414" y1="124" x2="414" y2="298" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="544" y1="124" x2="544" y2="298" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Width Caliper Above Spikes -->
  <line x1="421" y1="122" x2="537" y2="122" stroke="#059669" stroke-width="2.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="479" y="110" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">95% Credible Width ↓</text>

  <!-- Axis -->
  <line x1="360" y1="298" x2="606" y2="298" stroke="#0A0E17" stroke-width="1.6"/>

  <!-- Tail 2.5% Impulses (Muted Rose) -->
  <g stroke="#F43F5E" stroke-width="2.6" stroke-opacity="0.48" stroke-linecap="round">
    <line x1="378" y1="298" x2="378" y2="282"/>
    <line x1="396" y1="298" x2="396" y2="266"/>
    <line x1="564" y1="298" x2="564" y2="270"/>
    <line x1="584" y1="298" x2="584" y2="284"/>
  </g>
  <g fill="#F43F5E" fill-opacity="0.55">
    <circle cx="378" cy="282" r="3.4"/>
    <circle cx="396" cy="266" r="3.4"/>
    <circle cx="564" cy="270" r="3.4"/>
    <circle cx="584" cy="284" r="3.4"/>
  </g>

  <!-- Central 95% Supported Discrete Spikes -->
  <g stroke="#E11D48" stroke-width="3" stroke-linecap="round">
    <line x1="414" y1="298" x2="414" y2="242"/>
    <line x1="430" y1="298" x2="430" y2="216"/>
    <line x1="446" y1="298" x2="446" y2="188"/>
    <line x1="462" y1="298" x2="462" y2="168"/>
    <line x1="478" y1="298" x2="478" y2="156"/>
    <line x1="494" y1="298" x2="494" y2="174"/>
    <line x1="510" y1="298" x2="510" y2="202"/>
    <line x1="526" y1="298" x2="526" y2="232"/>
    <line x1="544" y1="298" x2="544" y2="252"/>
  </g>
  <g fill="#6B1028" stroke="#FFFFFF" stroke-width="1.3">
    <circle cx="414" cy="242" r="4"/>
    <circle cx="430" cy="216" r="4"/>
    <circle cx="446" cy="188" r="4"/>
    <circle cx="462" cy="168" r="4.2"/>
    <circle cx="478" cy="156" r="4.5"/>
    <circle cx="494" cy="174" r="4.2"/>
    <circle cx="510" cy="202" r="4"/>
    <circle cx="526" cy="232" r="4"/>
    <circle cx="544" cy="252" r="4"/>
  </g>

  <!-- True Nonprivate p_FRT Diamond Marker on Axis -->
  <polygon points="470,291 477,298 470,305 463,298" fill="#059669" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- Axis & Quantile Labels (Staggered cleanly on two tiers, zero overlap) -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="366" y="315">0</text>
    <text x="470" y="318" font-weight="700" fill="#059669">True p*</text>
    <text x="600" y="315">1</text>
  </g>
  <text x="414" y="336" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#059669">2.5%</text>
  <text x="544" y="336" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#059669">97.5%</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target metric: <tspan font-weight="700" fill="#E11D48">mean_width ↓</tspan></text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Coverage Guard ≥ 0.94</text>
</svg>
