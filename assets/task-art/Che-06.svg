<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>QUED — Quantum-Descriptor Acute Toxicity Regression</title>
  <desc>Lowest-energy DFTB3+MBD molecular conformers with quantum orbitals and dipole features combine 39,340 Bag-of-Bonds and 213 electronic DQM descriptors to predict acute LD50 toxicity in log10(mol/kg) with minimal MAE.</desc>
  <defs>
    <clipPath id="qued-card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="qued-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6F8"/>
      <stop offset="58%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="qued-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="qued-orbital-pos" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#F43F5E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="qued-orbital-neg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B1028" stop-opacity="0.30"/>
      <stop offset="75%" stop-color="#6B1028" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6B1028" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qued-well-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4E6" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFF6F8" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="qued-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6B1028" fill-opacity="0.15"/>
    </pattern>
    <marker id="qued-arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1 1.5L9 5L1 8.5Z" fill="#475569"/>
    </marker>
    <marker id="qued-arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1 1.5L9 5L1 8.5Z" fill="#E11D48"/>
    </marker>
  </defs>

  <g clip-path="url(#qued-card-clip)">
    <rect width="640" height="400" fill="url(#qued-bg)"/>
    <rect x="28" y="60" width="584" height="294" fill="url(#qued-grid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#qued-bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="37" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">QUED</text>
  <text x="612" y="37" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Quantum-Descriptor Toxicity Regression</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Left Hero: Quantum Conformer + Orbitals + Potential Energy Well -->
  <text x="38" y="80" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#6B1028">DFTB3+MBD</text>

  <!-- Electronic orbital cloud lobes -->
  <ellipse cx="146" cy="146" rx="68" ry="44" fill="url(#qued-orbital-pos)"/>
  <path d="M142 126 C112 80 172 80 142 126 Z" fill="#E11D48" fill-opacity="0.22" stroke="#E11D48" stroke-opacity="0.45" stroke-width="1.4"/>
  <path d="M142 126 C120 156 164 156 142 126 Z" fill="#6B1028" fill-opacity="0.18" stroke="#6B1028" stroke-opacity="0.4" stroke-width="1.3"/>
  <path d="M204 126 C182 88 228 84 204 126 Z" fill="#E11D48" fill-opacity="0.24" stroke="#E11D48" stroke-opacity="0.5" stroke-width="1.4"/>
  <ellipse cx="90" cy="158" rx="34" ry="26" fill="url(#qued-orbital-neg)"/>

  <!-- Molecular geometry (aromatic core + carbonyl + amine) -->
  <g stroke="#0A0E17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Benzene ring -->
    <polygon points="142,126 171,143 171,177 142,194 113,177 113,143"/>
    <circle cx="142" cy="160" r="19" stroke="#6B1028" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- Left substituent -->
    <line x1="113" y1="143" x2="84" y2="128"/>
    <!-- Right carbonyl + heteroatom -->
    <line x1="171" y1="143" x2="204" y2="126"/>
    <line x1="201" y1="124" x2="201" y2="96"/>
    <line x1="207" y1="124" x2="207" y2="96"/>
    <line x1="204" y1="126" x2="236" y2="143"/>
    <line x1="171" y1="177" x2="200" y2="192"/>
  </g>
  <!-- Atoms with Mulliken charge accents -->
  <circle cx="84" cy="128" r="8" fill="#6B1028" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="204" cy="94" r="9" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="236" cy="143" r="8" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="200" cy="192" r="6.5" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="142" cy="126" r="4" fill="#0A0E17"/>
  <circle cx="171" cy="143" r="4" fill="#0A0E17"/>
  <circle cx="171" cy="177" r="4" fill="#0A0E17"/>
  <circle cx="142" cy="194" r="4" fill="#0A0E17"/>
  <circle cx="113" cy="177" r="4" fill="#0A0E17"/>
  <circle cx="113" cy="143" r="4" fill="#0A0E17"/>
  <circle cx="204" cy="126" r="4.5" fill="#0A0E17"/>

  <text x="56" y="122" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6B1028">δ+</text>
  <text x="220" y="96" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">δ−</text>

  <!-- Dipole moment vector -->
  <line x1="100" y1="218" x2="210" y2="218" stroke="#E11D48" stroke-width="2.4" marker-end="url(#qued-arrow-rose)"/>
  <line x1="112" y1="211" x2="112" y2="225" stroke="#E11D48" stroke-width="2.2"/>
  <text x="222" y="222" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#E11D48">μ</text>

  <!-- Conformational Potential Energy Surface -->
  <path d="M44 252 C70 256 84 294 108 294 C132 294 140 264 162 264 C184 264 190 318 214 318 C238 318 254 274 278 254 L278 326 L44 326 Z" fill="url(#qued-well-fill)"/>
  <path d="M44 252 C70 256 84 294 108 294 C132 294 140 264 162 264 C184 264 190 318 214 318 C238 318 254 274 278 254" fill="none" stroke="#6B1028" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="44" y1="326" x2="278" y2="326" stroke="#CBD5E1" stroke-width="1.2"/>
  <circle cx="214" cy="318" r="10" fill="#E11D48" fill-opacity="0.18"/>
  <circle cx="214" cy="318" r="5" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
  <text x="214" y="344" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E11D48">E_min Conformer</text>

  <!-- Connector arrow 1 -->
  <line x1="264" y1="196" x2="308" y2="196" stroke="#475569" stroke-width="2.2" marker-end="url(#qued-arrow-slate)"/>

  <!-- Middle Column: BOB + DQM Concatenated Spectral Descriptor Vector -->
  <text x="347" y="82" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A0E17">BOB · 39.3k</text>
  <rect x="318" y="92" width="58" height="156" rx="8" fill="#FFFFFF" stroke="#6B1028" stroke-width="2"/>
  <g stroke-linecap="round">
    <line x1="326" y1="104" x2="366" y2="104" stroke="#6B1028" stroke-width="4" stroke-opacity="0.85"/>
    <line x1="326" y1="116" x2="354" y2="116" stroke="#475569" stroke-width="3" stroke-opacity="0.55"/>
    <line x1="326" y1="127" x2="368" y2="127" stroke="#6B1028" stroke-width="3.5" stroke-opacity="0.72"/>
    <line x1="326" y1="138" x2="346" y2="138" stroke="#475569" stroke-width="2.5" stroke-opacity="0.45"/>
    <line x1="326" y1="149" x2="364" y2="149" stroke="#6B1028" stroke-width="4" stroke-opacity="0.80"/>
    <line x1="326" y1="160" x2="358" y2="160" stroke="#475569" stroke-width="2.5" stroke-opacity="0.55"/>
    <line x1="326" y1="171" x2="368" y2="171" stroke="#6B1028" stroke-width="3.5" stroke-opacity="0.65"/>
    <line x1="326" y1="182" x2="342" y2="182" stroke="#475569" stroke-width="2.5" stroke-opacity="0.40"/>
    <line x1="326" y1="193" x2="362" y2="193" stroke="#6B1028" stroke-width="4" stroke-opacity="0.88"/>
    <line x1="326" y1="204" x2="352" y2="204" stroke="#475569" stroke-width="2.5" stroke-opacity="0.50"/>
    <line x1="326" y1="215" x2="366" y2="215" stroke="#6B1028" stroke-width="3.5" stroke-opacity="0.70"/>
    <line x1="326" y1="226" x2="356" y2="226" stroke="#475569" stroke-width="3" stroke-opacity="0.55"/>
    <line x1="326" y1="237" x2="368" y2="237" stroke="#6B1028" stroke-width="3.5" stroke-opacity="0.78"/>
  </g>

  <text x="347" y="261" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#475569">+</text>

  <rect x="318" y="268" width="58" height="58" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.2"/>
  <g stroke-linecap="round">
    <line x1="326" y1="280" x2="366" y2="280" stroke="#E11D48" stroke-width="4"/>
    <line x1="326" y1="291" x2="356" y2="291" stroke="#F43F5E" stroke-width="3.5"/>
    <line x1="326" y1="302" x2="368" y2="302" stroke="#E11D48" stroke-width="4"/>
    <line x1="326" y1="313" x2="350" y2="313" stroke="#6B1028" stroke-width="3.5"/>
  </g>
  <text x="347" y="344" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E11D48">DQM · 213</text>

  <!-- Connector arrow 2 -->
  <line x1="382" y1="196" x2="407" y2="196" stroke="#475569" stroke-width="2.2" marker-end="url(#qued-arrow-slate)"/>

  <!-- Right Panel: LD50 Acute Toxicity Parity & L1 Residuals -->
  <text x="520" y="84" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">LD50 · log₁₀(mol/kg)</text>

  <!-- Tight MAE corridor along diagonal -->
  <polygon points="444,296 444,274 578,108 598,108 598,132 464,296" fill="#FFE4E6" fill-opacity="0.65"/>

  <!-- Axes -->
  <line x1="444" y1="106" x2="444" y2="298" stroke="#475569" stroke-width="1.8"/>
  <line x1="444" y1="298" x2="600" y2="298" stroke="#475569" stroke-width="1.8"/>
  <!-- Diagonal y = y_hat -->
  <line x1="444" y1="298" x2="598" y2="110" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- L1 vertical residual segments -->
  <g stroke-width="2.4" stroke-linecap="round">
    <line x1="468" y1="269" x2="468" y2="253" stroke="#059669"/>
    <line x1="490" y1="242" x2="490" y2="262" stroke="#E11D48"/>
    <line x1="514" y1="212" x2="514" y2="196" stroke="#059669"/>
    <line x1="538" y1="183" x2="538" y2="206" stroke="#E11D48"/>
    <line x1="562" y1="154" x2="562" y2="138" stroke="#059669"/>
    <line x1="582" y1="130" x2="582" y2="144" stroke="#E11D48"/>
  </g>

  <!-- Molecule prediction scatter points -->
  <g stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="456" cy="282" r="4.5" fill="#6B1028"/>
    <circle cx="468" cy="253" r="4.8" fill="#059669"/>
    <circle cx="480" cy="251" r="4.2" fill="#E11D48"/>
    <circle cx="490" cy="262" r="4.8" fill="#E11D48"/>
    <circle cx="503" cy="227" r="4.2" fill="#6B1028"/>
    <circle cx="514" cy="196" r="4.8" fill="#059669"/>
    <circle cx="527" cy="194" r="4.2" fill="#F43F5E"/>
    <circle cx="538" cy="206" r="4.8" fill="#E11D48"/>
    <circle cx="550" cy="167" r="4.2" fill="#6B1028"/>
    <circle cx="562" cy="138" r="4.8" fill="#059669"/>
    <circle cx="574" cy="141" r="4.2" fill="#F43F5E"/>
    <circle cx="582" cy="144" r="4.8" fill="#E11D48"/>
  </g>

  <text x="562" y="232" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E11D48">|y − ŷ|</text>
  <text x="522" y="320" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Observed</text>
  <text x="431" y="204" text-anchor="middle" transform="rotate(-90 431 204)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Predicted</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="380" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">Lowest-Energy Conformers · BOB + DQM</text>
  <text x="612" y="380" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Target: <tspan font-weight="700" fill="#E11D48">MAE ↓</tspan></text>
</svg>
