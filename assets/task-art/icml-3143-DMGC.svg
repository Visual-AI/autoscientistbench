<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>DMGC: Attribute-Aware Bidirectional Graph Refinement and Multi-Level Fusion</title>
  <desc>Multi-view graph inputs pass through an attribute-aware bidirectional refinement lens that adds intra-cluster edges and prunes noisy cross-edges, feeding pseudo-label guided fusion into five unsupervised latent clusters.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="lens-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.75"/>
      <stop offset="72%" stop-color="#DBEAFE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0052FF" opacity="0.16"/>
    </pattern>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0.5 0.5 L6.5 3.5 L0.5 6.5 Z" fill="#0052FF"/>
    </marker>
    <marker id="arr-sky" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0.5 0.5 L6.5 3.5 L0.5 6.5 Z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Plate Background -->
    <rect width="640" height="400" fill="url(#bg-grad)"/>
    <rect x="0" y="54" width="640" height="304" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="640" height="3" fill="#0052FF"/>

    <!-- Header -->
    <text x="28" y="36" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0A0E17">DMGC</text>
    <text x="612" y="36" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">Multi-View Graph Refinement &amp; Fusion</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Left Zone: Two Graph Views -->
    <!-- View 1 Card -->
    <rect x="28" y="78" width="156" height="114" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="40" y="98" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">View 1 · (A, X)</text>
    <g stroke="#CBD5E1" stroke-width="1.8">
      <line x1="58" y1="126" x2="96" y2="118"/>
      <line x1="58" y1="126" x2="72" y2="164"/>
      <line x1="96" y1="118" x2="112" y2="158"/>
      <line x1="72" y1="164" x2="112" y2="158"/>
      <line x1="96" y1="118" x2="146" y2="144" stroke="#E11D48" stroke-dasharray="3 3"/>
      <line x1="112" y1="158" x2="146" y2="144"/>
    </g>
    <g fill="#0052FF" stroke="#FFFFFF" stroke-width="1.5">
      <circle cx="58" cy="126" r="6"/>
      <circle cx="96" cy="118" r="6"/>
      <circle cx="72" cy="164" r="6"/>
      <circle cx="112" cy="158" r="6" fill="#0EA5E9"/>
      <circle cx="146" cy="144" r="6" fill="#0EA5E9"/>
    </g>
    <!-- Mini Attribute Bars -->
    <g fill="#0052FF" opacity="0.65">
      <rect x="138" y="164" width="26" height="4" rx="2"/>
      <rect x="138" y="171" width="18" height="4" rx="2" fill="#0EA5E9"/>
      <rect x="138" y="178" width="30" height="4" rx="2"/>
    </g>

    <!-- View 2 Card -->
    <rect x="28" y="206" width="156" height="114" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="40" y="226" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">View 2 · (A, X)</text>
    <g stroke="#CBD5E1" stroke-width="1.8">
      <line x1="58" y1="256" x2="96" y2="246"/>
      <line x1="58" y1="256" x2="76" y2="294"/>
      <line x1="96" y1="246" x2="116" y2="286"/>
      <line x1="76" y1="294" x2="148" y2="274" stroke="#E11D48" stroke-dasharray="3 3"/>
      <line x1="116" y1="286" x2="148" y2="274"/>
    </g>
    <g fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.5">
      <circle cx="58" cy="256" r="6"/>
      <circle cx="96" cy="246" r="6"/>
      <circle cx="76" cy="294" r="6"/>
      <circle cx="116" cy="286" r="6" fill="#0052FF"/>
      <circle cx="148" cy="274" r="6" fill="#0052FF"/>
    </g>
    <g fill="#0EA5E9" opacity="0.65">
      <rect x="138" y="294" width="22" height="4" rx="2"/>
      <rect x="138" y="301" width="30" height="4" rx="2" fill="#0052FF"/>
      <rect x="138" y="308" width="16" height="4" rx="2"/>
    </g>

    <!-- Connecting Flow Arrows: Views -> Refinement Lens -->
    <path d="M 184 138 C 204 138 210 166 225 178" fill="none" stroke="#0052FF" stroke-width="2.2" marker-end="url(#arr-blue)"/>
    <path d="M 184 260 C 204 260 210 232 225 220" fill="none" stroke="#0EA5E9" stroke-width="2.2" marker-end="url(#arr-sky)"/>

    <!-- Center Zone: Attribute-Aware Bidirectional Structural Refinement Lens -->
    <text x="308" y="92" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0A0E17">Bidirectional Refinement</text>

    <circle cx="308" cy="198" r="90" fill="url(#lens-glow)"/>
    <circle cx="308" cy="198" r="76" fill="#FFFFFF" stroke="#0052FF" stroke-width="2.6"/>
    <circle cx="308" cy="198" r="68" fill="none" stroke="#DBEAFE" stroke-width="1.4" stroke-dasharray="4 4"/>

    <!-- Pruned Cross-Cluster Noisy Edges (Rose dashed + X) -->
    <g stroke="#E11D48" stroke-width="2" stroke-dasharray="4 3">
      <line x1="296" y1="158" x2="340" y2="196"/>
      <line x1="278" y1="210" x2="322" y2="236"/>
    </g>
    <!-- X Cut Markers -->
    <g>
      <circle cx="318" cy="177" r="7.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4"/>
      <path d="M 315 174 L 321 180 M 321 174 L 315 180" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="300" cy="223" r="7.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4"/>
      <path d="M 297 220 L 303 226 M 303 220 L 297 226" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Added Intra-Cluster Edges (Bold Blue / Cyan) -->
    <g stroke="#0052FF" stroke-width="3" stroke-linecap="round">
      <line x1="264" y1="178" x2="296" y2="158"/>
      <line x1="264" y1="178" x2="278" y2="210"/>
      <line x1="296" y1="158" x2="278" y2="210"/>
    </g>
    <g stroke="#0EA5E9" stroke-width="3" stroke-linecap="round">
      <line x1="340" y1="196" x2="354" y2="226"/>
      <line x1="340" y1="196" x2="322" y2="236"/>
      <line x1="354" y1="226" x2="322" y2="236"/>
    </g>

    <!-- Refined Nodes inside Lens -->
    <g stroke="#FFFFFF" stroke-width="2">
      <circle cx="264" cy="178" r="7.5" fill="#0052FF"/>
      <circle cx="296" cy="158" r="7.5" fill="#0052FF"/>
      <circle cx="278" cy="210" r="7.5" fill="#0052FF"/>
      <circle cx="340" cy="196" r="7.5" fill="#0EA5E9"/>
      <circle cx="354" cy="226" r="7.5" fill="#0EA5E9"/>
      <circle cx="322" cy="236" r="7.5" fill="#0EA5E9"/>
    </g>

    <!-- Lens Legend (Clear below aperture) -->
    <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">
      <line x1="226" y1="294" x2="244" y2="294" stroke="#0052FF" stroke-width="2.8" stroke-linecap="round"/>
      <text x="250" y="298" fill="#0052FF">+ Add</text>
      <line x1="312" y1="294" x2="330" y2="294" stroke="#E11D48" stroke-width="2.2" stroke-dasharray="4 3"/>
      <text x="336" y="298" fill="#E11D48">− Prune</text>
    </g>

    <!-- Arrow: Lens -> Multi-level Fusion Cluster Card -->
    <line x1="386" y1="198" x2="427" y2="198" stroke="#0052FF" stroke-width="2.6" marker-end="url(#arr-blue)"/>
    <text x="407" y="186" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0A1E5E">Fuse</text>

    <!-- Right Zone: Multi-Level Fusion & 5 Latent Clusters -->
    <rect x="434" y="78" width="178" height="236" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="523" y="99" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">5 Latent Clusters</text>

    <!-- Cluster 1 (Top - Primary Blue) -->
    <ellipse cx="523" cy="138" rx="26" ry="18" fill="#0052FF" fill-opacity="0.14" stroke="#0052FF" stroke-width="1.5"/>
    <g fill="#0052FF">
      <circle cx="513" cy="136" r="3.4"/><circle cx="523" cy="131" r="3.4"/><circle cx="534" cy="137" r="3.4"/><circle cx="520" cy="144" r="3.4"/><circle cx="530" cy="145" r="3.4"/>
    </g>

    <!-- Cluster 2 (Upper Right - Sky Cyan) -->
    <ellipse cx="574" cy="186" rx="24" ry="19" fill="#0EA5E9" fill-opacity="0.16" stroke="#0EA5E9" stroke-width="1.5"/>
    <g fill="#0EA5E9">
      <circle cx="566" cy="182" r="3.4"/><circle cx="578" cy="178" r="3.4"/><circle cx="585" cy="188" r="3.4"/><circle cx="572" cy="193" r="3.4"/><circle cx="562" cy="191" r="3.4"/>
    </g>

    <!-- Cluster 3 (Lower Right - Emerald) -->
    <ellipse cx="556" cy="252" rx="25" ry="19" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.5"/>
    <g fill="#059669">
      <circle cx="546" cy="248" r="3.4"/><circle cx="558" cy="244" r="3.4"/><circle cx="568" cy="252" r="3.4"/><circle cx="554" cy="259" r="3.4"/><circle cx="545" cy="257" r="3.4"/>
    </g>

    <!-- Cluster 4 (Lower Left - Deep Navy) -->
    <ellipse cx="488" cy="252" rx="25" ry="19" fill="#0A1E5E" fill-opacity="0.12" stroke="#0A1E5E" stroke-width="1.5"/>
    <g fill="#0A1E5E">
      <circle cx="478" cy="249" r="3.4"/><circle cx="490" cy="244" r="3.4"/><circle cx="499" cy="252" r="3.4"/><circle cx="486" cy="260" r="3.4"/><circle cx="477" cy="257" r="3.4"/>
    </g>

    <!-- Cluster 5 (Upper Left - Slate) -->
    <ellipse cx="472" cy="186" rx="24" ry="19" fill="#475569" fill-opacity="0.14" stroke="#475569" stroke-width="1.5"/>
    <g fill="#475569">
      <circle cx="464" cy="182" r="3.4"/><circle cx="475" cy="177" r="3.4"/><circle cx="483" cy="187" r="3.4"/><circle cx="472" cy="194" r="3.4"/><circle cx="462" cy="191" r="3.4"/>
    </g>

    <text x="523" y="299" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Unsupervised Partition</text>

    <!-- Pseudo-label Guided Feedback Arc -->
    <path d="M 523 314 C 523 344 308 344 308 313" fill="none" stroke="#0EA5E9" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arr-sky)"/>
    <rect x="358" y="324" width="116" height="20" rx="10" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
    <text x="416" y="338" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#0052FF">Pseudo-label guide</text>

    <!-- Footer -->
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <text x="28" y="378" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">Wisconsin graph · 5 clusters · Hungarian match</text>
    <text x="612" y="378" text-anchor="end" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
      <tspan fill="#475569">Target: </tspan><tspan font-weight="700" fill="#0052FF">acc ↑</tspan>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.75"/>
</svg>
