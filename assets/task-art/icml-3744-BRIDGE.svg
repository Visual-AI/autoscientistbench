<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>BRIDGE: Predicting Human Task Completion Time From Model Performance</title>
  <desc>Sparse binary model pass-fail observations with preserved missingness are jointly fit with a two-parameter logistic IRT model to extract latent task difficulty, which calibrates linearly onto four human completion-time buckets.</desc>
  <defs>
    <clipPath id="brg-card-clip">
      <rect x="0" y="0" width="640" height="400" rx="16"/>
    </clipPath>
    <linearGradient id="brg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="brg-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="brg-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0A1E5E" opacity="0.15"/>
    </pattern>
    <marker id="brg-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 Z" fill="#0052FF"/>
    </marker>
  </defs>

  <g clip-path="url(#brg-card-clip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#brg-bg)"/>
    <rect x="20" y="58" width="600" height="296" fill="url(#brg-dots)"/>
    <rect x="0" y="0" width="640" height="3" fill="url(#brg-accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="28" y="38" font-size="18" font-weight="700" fill="#0A0E17">BRIDGE</text>
    <text x="612" y="37" text-anchor="end" font-size="12.5" fill="#475569">IRT Model-to-Human Time Bridge</text>
    <line x1="28" y1="54" x2="612" y2="54" stroke="#CBD5E1" stroke-width="0.9" opacity="0.75"/>
  </g>

  <!-- Panel 1: Sparse Model x Task Matrix -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="114" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0A1E5E">Sparse Pass / Fail</text>

    <text x="36" y="190" transform="rotate(-90 36 190)" text-anchor="middle" font-size="11.5" fill="#475569">Models θ</text>

    <!-- 5x5 Matrix at x=48..184, y=104..268 (cell 24x28, gap 4) -->
    <g transform="translate(48 104)">
      <!-- Row 0 (strong model) -->
      <rect x="0" y="0" width="24" height="28" rx="5" fill="#0052FF"/>
      <circle cx="12" cy="14" r="3.5" fill="#FFFFFF"/>
      <rect x="28" y="0" width="24" height="28" rx="5" fill="#0052FF"/>
      <circle cx="40" cy="14" r="3.5" fill="#FFFFFF"/>
      <rect x="56" y="0" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>
      <rect x="84" y="0" width="24" height="28" rx="5" fill="#0052FF"/>
      <circle cx="96" cy="14" r="3.5" fill="#FFFFFF"/>
      <rect x="112" y="0" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 119 9 L 129 19 M 129 9 L 119 19" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>

      <!-- Row 1 -->
      <rect x="0" y="34" width="24" height="28" rx="5" fill="#0052FF"/>
      <circle cx="12" cy="48" r="3.5" fill="#FFFFFF"/>
      <rect x="28" y="34" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>
      <rect x="56" y="34" width="24" height="28" rx="5" fill="#0052FF"/>
      <circle cx="68" cy="48" r="3.5" fill="#FFFFFF"/>
      <rect x="84" y="34" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 91 43 L 101 53 M 101 43 L 91 53" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
      <rect x="112" y="34" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>

      <!-- Row 2 -->
      <rect x="0" y="68" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>
      <rect x="28" y="68" width="24" height="28" rx="5" fill="#0052FF"/>
      <circle cx="40" cy="82" r="3.5" fill="#FFFFFF"/>
      <rect x="56" y="68" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 63 77 L 73 87 M 73 77 L 63 87" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
      <rect x="84" y="68" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>
      <rect x="112" y="68" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 119 77 L 129 87 M 129 77 L 119 87" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>

      <!-- Row 3 -->
      <rect x="0" y="102" width="24" height="28" rx="5" fill="#0052FF"/>
      <circle cx="12" cy="116" r="3.5" fill="#FFFFFF"/>
      <rect x="28" y="102" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 35 111 L 45 121 M 45 111 L 35 121" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
      <rect x="56" y="102" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>
      <rect x="84" y="102" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 91 111 L 101 121 M 101 111 L 91 121" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
      <rect x="112" y="102" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>

      <!-- Row 4 (weak model) -->
      <rect x="0" y="136" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>
      <rect x="28" y="136" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 35 145 L 45 155 M 45 145 L 35 155" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
      <rect x="56" y="136" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 63 145 L 73 155 M 73 145 L 63 155" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
      <rect x="84" y="136" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="3 2.5"/>
      <rect x="112" y="136" width="24" height="28" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
      <path d="M 119 145 L 129 155 M 129 145 L 119 155" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="116" y="294" text-anchor="middle" font-size="11.5" fill="#475569">Tasks b</text>

    <!-- Legend -->
    <rect x="34" y="317" width="11" height="11" rx="2.5" fill="#0052FF"/>
    <text x="50" y="327" font-size="11" fill="#0A0E17">Pass</text>
    <rect x="86" y="317" width="11" height="11" rx="2.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4"/>
    <text x="102" y="327" font-size="11" fill="#0A0E17">Fail</text>
    <rect x="132" y="317" width="11" height="11" rx="2.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="2.5 2"/>
    <text x="148" y="327" font-size="11" fill="#475569">Miss</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="188" x2="212" y2="188" stroke="#0052FF" stroke-width="2.4" marker-end="url(#brg-arrow-blue)"/>

  <!-- Panel 2: 2PL IRT Curves -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="308" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0A1E5E">2PL IRT Curves</text>

    <rect x="220" y="96" width="174" height="196" rx="11" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>

    <!-- 0.5 dashed guide -->
    <line x1="238" y1="190" x2="384" y2="190" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- Drop lines to difficulty b -->
    <line x1="274" y1="190" x2="274" y2="270" stroke="#0EA5E9" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="310" y1="190" x2="310" y2="270" stroke="#0052FF" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="348" y1="190" x2="348" y2="270" stroke="#0A1E5E" stroke-width="1.3" stroke-dasharray="3 3"/>

    <!-- 3 Logistic S-curves -->
    <path d="M 240 264 C 258 260 264 226 274 190 C 284 154 294 118 332 112 L 382 110" fill="none" stroke="#0EA5E9" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 240 268 C 280 264 296 232 310 190 C 324 148 340 116 382 111" fill="none" stroke="#0052FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 240 270 L 296 268 C 326 264 338 232 348 190 C 358 148 368 122 384 114" fill="none" stroke="#0A1E5E" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Inflection points at P=0.5 -->
    <circle cx="274" cy="190" r="4.5" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="310" cy="190" r="4.8" fill="#0052FF" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="348" cy="190" r="4.5" fill="#0A1E5E" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Axes -->
    <path d="M 238 106 V 270 H 386" fill="none" stroke="#0A0E17" stroke-width="1.8" stroke-linecap="round"/>
    <text x="274" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#0EA5E9">b₁</text>
    <text x="310" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#0052FF">b₂</text>
    <text x="348" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#0A1E5E">b₃</text>

    <text x="308" y="312" text-anchor="middle" font-size="11.5" fill="#475569">Model ability θ</text>
    <text x="308" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0052FF">P = σ(a(θ − b))</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="398" y1="188" x2="420" y2="188" stroke="#0052FF" stroke-width="2.4" marker-end="url(#brg-arrow-blue)"/>

  <!-- Panel 3: Log-Time Calibration & 4 Buckets -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="518" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0A1E5E">4 Human Time Buckets</text>

    <rect x="426" y="96" width="186" height="196" rx="11" fill="#FFFFFF" fill-opacity="0.86" stroke="#CBD5E1" stroke-width="1"/>

    <!-- 4 Horizontal Time Bucket Bands (plot x=440..552, dedicated label margin x=556..608) -->
    <rect x="440" y="108" width="112" height="40" fill="#0A1E5E" opacity="0.10"/>
    <rect x="440" y="148" width="112" height="40" fill="#0052FF" opacity="0.10"/>
    <rect x="440" y="188" width="112" height="40" fill="#0EA5E9" opacity="0.11"/>
    <rect x="440" y="228" width="112" height="40" fill="#059669" opacity="0.10"/>

    <!-- Bucket Threshold Hairlines -->
    <g stroke="#0A1E5E" stroke-width="1" stroke-dasharray="4 3" opacity="0.4">
      <line x1="440" y1="148" x2="552" y2="148"/>
      <line x1="440" y1="188" x2="552" y2="188"/>
      <line x1="440" y1="228" x2="552" y2="228"/>
    </g>

    <!-- Bucket Labels in Dedicated Right Margin (zero overlap with line or points) -->
    <text x="558" y="132" font-size="10.5" font-weight="700" fill="#0A1E5E">&gt;240m</text>
    <text x="558" y="172" font-size="10.5" font-weight="600" fill="#0052FF">60–240</text>
    <text x="558" y="212" font-size="10.5" font-weight="600" fill="#0EA5E9">15–60</text>
    <text x="558" y="252" font-size="10.5" font-weight="700" fill="#059669">0–15m</text>

    <!-- Calibration Confidence Band + Linear Bridge -->
    <polygon points="444,252 544,114 550,126 450,264" fill="#0052FF" opacity="0.14"/>
    <line x1="446" y1="258" x2="546" y2="120" stroke="#0052FF" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Calibration Scatter Points -->
    <circle cx="456" cy="248" r="3.8" fill="#059669" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="470" cy="236" r="3.8" fill="#059669" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="480" cy="208" r="3.8" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="494" cy="198" r="3.8" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="508" cy="172" r="3.8" fill="#0052FF" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="520" cy="160" r="3.8" fill="#0052FF" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="532" cy="134" r="3.8" fill="#0A1E5E" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="542" cy="124" r="3.8" fill="#0A1E5E" stroke="#FFFFFF" stroke-width="1.4"/>

    <!-- Axes -->
    <path d="M 440 106 V 268 H 554" fill="none" stroke="#0A0E17" stroke-width="1.8" stroke-linecap="round"/>

    <text x="524" y="312" text-anchor="middle" font-size="11.5" fill="#475569">Task difficulty b</text>
    <text x="524" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0052FF">log t = m·b + c</text>
  </g>

  <!-- Footer -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="0.9" opacity="0.75"/>
    <text x="28" y="380" font-size="12.5" fill="#475569">Target metric: <tspan font-weight="700" fill="#0052FF">bucket_accuracy ↑</tspan></text>
    <text x="612" y="380" text-anchor="end" font-size="12" fill="#475569">4 buckets · κ ≥ 0.22 · F1 ≥ 0.27</text>
  </g>
</svg>
