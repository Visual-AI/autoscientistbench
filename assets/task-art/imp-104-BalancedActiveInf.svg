<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>BalancedActiveInf: Cube-Balanced Active Population Inference</title>
  <desc>Cube sampling selects a balanced subset of population units proportional to predicted errors for oracle label queries, yielding design-weighted residual corrections that shrink the valid 90% confidence interval width around the finite-population mean.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="narrowCurve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#475569" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="0" y="52" width="640" height="306" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#topBar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17">BalancedActiveInf</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Cube-Balanced Active Estimation</text>
  </g>
  <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Left Panel: Finite Population & Cube Sampling Polytope -->
  <rect x="28" y="72" width="288" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="44" y="94" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">Population (ŷ, ê)</text>
  <rect x="228" y="80" width="76" height="20" rx="6" fill="#DBEAFE"/>
  <text x="266" y="94" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">Σπ ≤ 869</text>

  <!-- Cube-Balanced Polytope Hull connecting selected nodes -->
  <polygon points="56,170 132,130 246,130 284,210 246,290 132,290 94,250" fill="#0052FF" fill-opacity="0.06" stroke="#0052FF" stroke-width="1.8" stroke-dasharray="5 3.5"/>
  <!-- Internal balance chords -->
  <g stroke="#0EA5E9" stroke-width="1.2" stroke-opacity="0.45">
    <line x1="132" y1="130" x2="170" y2="210"/>
    <line x1="246" y1="130" x2="170" y2="210"/>
    <line x1="56" y1="170" x2="170" y2="210"/>
    <line x1="284" y1="210" x2="170" y2="210"/>
    <line x1="132" y1="290" x2="170" y2="210"/>
    <line x1="246" y1="290" x2="170" y2="210"/>
  </g>

  <!-- Unqueried Population Units (size proportional to error_pred) -->
  <g fill="#DBEAFE" stroke="#CBD5E1" stroke-width="1.2">
    <circle cx="56" cy="130" r="5"/>
    <circle cx="94" cy="130" r="6"/>
    <circle cx="170" cy="130" r="5"/>
    <circle cx="208" cy="130" r="6.5"/>
    <circle cx="284" cy="130" r="5"/>

    <circle cx="94" cy="170" r="5.5"/>
    <circle cx="132" cy="170" r="5"/>
    <circle cx="170" cy="170" r="6"/>
    <circle cx="208" cy="170" r="5"/>
    <circle cx="246" cy="170" r="6"/>
    <circle cx="284" cy="170" r="5.5"/>

    <circle cx="56" cy="210" r="5.5"/>
    <circle cx="94" cy="210" r="6"/>
    <circle cx="132" cy="210" r="5.5"/>
    <circle cx="208" cy="210" r="6"/>
    <circle cx="246" cy="210" r="5"/>

    <circle cx="56" cy="250" r="5"/>
    <circle cx="132" cy="250" r="6"/>
    <circle cx="170" cy="250" r="5.5"/>
    <circle cx="208" cy="250" r="6.5"/>
    <circle cx="246" cy="250" r="5"/>
    <circle cx="284" cy="250" r="5.5"/>

    <circle cx="56" cy="290" r="5"/>
    <circle cx="94" cy="290" r="5.5"/>
    <circle cx="170" cy="290" r="6"/>
    <circle cx="208" cy="290" r="5"/>
    <circle cx="284" cy="290" r="5"/>
  </g>

  <!-- Cube-Selected Oracle-Queried Units + Residual Ticks -->
  <g>
    <!-- Node (132, 130) -->
    <circle cx="132" cy="130" r="11.5" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="132" cy="130" r="7.5" fill="#0052FF"/>
    <line x1="132" y1="118" x2="132" y2="108" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node (246, 130) -->
    <circle cx="246" cy="130" r="11.5" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="246" cy="130" r="7.5" fill="#0052FF"/>
    <line x1="246" y1="118" x2="246" y2="110" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node (56, 170) -->
    <circle cx="56" cy="170" r="11.5" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="56" cy="170" r="7.5" fill="#0052FF"/>
    <line x1="56" y1="158" x2="56" y2="149" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node (170, 210) center anchor -->
    <circle cx="170" cy="210" r="12" fill="none" stroke="#059669" stroke-width="2.2"/>
    <circle cx="170" cy="210" r="8" fill="#0052FF"/>
    <line x1="170" y1="198" x2="170" y2="188" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node (284, 210) -->
    <circle cx="284" cy="210" r="11.5" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="284" cy="210" r="7.5" fill="#0052FF"/>
    <line x1="284" y1="198" x2="284" y2="189" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node (94, 250) -->
    <circle cx="94" cy="250" r="11.5" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="94" cy="250" r="7.5" fill="#0052FF"/>
    <line x1="94" y1="238" x2="94" y2="230" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node (132, 290) -->
    <circle cx="132" cy="290" r="11.5" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="132" cy="290" r="7.5" fill="#0052FF"/>
    <line x1="132" y1="278" x2="132" y2="270" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Node (246, 290) -->
    <circle cx="246" cy="290" r="11.5" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="246" cy="290" r="7.5" fill="#0052FF"/>
    <line x1="246" y1="278" x2="246" y2="269" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Left Legend Bar -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">
    <circle cx="48" cy="325" r="4.5" fill="#DBEAFE" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="58" y="329">Frozen ŷ</text>
    <circle cx="130" cy="325" r="5.5" fill="#0052FF" stroke="#059669" stroke-width="1.6"/>
    <text x="142" y="329">Oracle y</text>
    <line x1="214" y1="320" x2="214" y2="330" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
    <text x="223" y="329">Residual</text>
  </g>

  <!-- Connecting Design-Weight Arrow -->
  <line x1="322" y1="205" x2="362" y2="205" stroke="#0052FF" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <text x="342" y="191" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0052FF">1 / π</text>
  <text x="342" y="224" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569">Weight</text>

  <!-- Right Panel: Distribution & Valid 90% CI Width Shrinkage -->
  <rect x="370" y="72" width="242" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="386" y="94" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">90% Interval Shrinkage</text>

  <!-- Ground Truth Mean theta Line -->
  <text x="491" y="114" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A0E17">θ</text>
  <line x1="491" y1="120" x2="491" y2="306" stroke="#0A0E17" stroke-width="1.3" stroke-dasharray="4 3" stroke-opacity="0.65"/>

  <!-- Baseline Axis -->
  <line x1="386" y1="226" x2="596" y2="226" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Wide Uniform Sampling Curve -->
  <path d="M 390 226 C 420 224, 444 182, 491 182 C 538 182, 562 224, 592 226 Z" fill="#475569" fill-opacity="0.08"/>
  <path d="M 390 226 C 420 224, 444 182, 491 182 C 538 182, 562 224, 592 226" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 3.5"/>

  <!-- Sharp Balanced Active Inference Curve -->
  <path d="M 436 226 C 460 224, 470 124, 491 124 C 512 124, 522 224, 546 226 Z" fill="url(#narrowCurve)"/>
  <path d="M 436 226 C 460 224, 470 124, 491 124 C 512 124, 522 224, 546 226" fill="none" stroke="#0052FF" stroke-width="3"/>

  <!-- Curve Labels -->
  <text x="536" y="148" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">Balanced</text>
  <text x="386" y="180" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">Uniform</text>

  <!-- Wide Uniform 90% CI Bracket -->
  <line x1="404" y1="264" x2="578" y2="264" stroke="#E11D48" stroke-width="2.5"/>
  <line x1="404" y1="257" x2="404" y2="271" stroke="#E11D48" stroke-width="2.5"/>
  <line x1="578" y1="257" x2="578" y2="271" stroke="#E11D48" stroke-width="2.5"/>
  <circle cx="491" cy="264" r="3.5" fill="#E11D48"/>
  <text x="404" y="248" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E11D48">Uniform CI</text>

  <!-- Narrow Balanced Active 90% CI Bracket + Shrink Arrows -->
  <line x1="454" y1="298" x2="528" y2="298" stroke="#059669" stroke-width="3.2"/>
  <line x1="454" y1="290" x2="454" y2="306" stroke="#059669" stroke-width="2.8"/>
  <line x1="528" y1="290" x2="528" y2="306" stroke="#059669" stroke-width="2.8"/>
  <circle cx="491" cy="298" r="4.2" fill="#059669" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Inward Shrinkage Arrows -->
  <line x1="412" y1="298" x2="444" y2="298" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="570" y1="298" x2="538" y2="298" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="491" y="328" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">Balanced 90% CI</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
    <text x="28" y="379" fill="#475569">Bike · 90% Coverage · Active Budget</text>
    <text x="612" y="379" text-anchor="end" fill="#475569">Metric: <tspan font-weight="700" fill="#0052FF">Mean CI Width ↓</tspan></text>
  </g>
</svg>
