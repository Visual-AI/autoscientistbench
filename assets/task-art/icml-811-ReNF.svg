<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>ReNF: Cascaded Multi-Horizon Time Series Forecasting</title>
  <desc>Reversible instance normalization feeds seven ETTh1 channels into three cascading MLP stages predicting progressively longer horizons of 32, 64, and 96 steps with detached intermediate feedback and EMA output.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="revinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="s1Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="s2Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="s3Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#475569" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="639" height="399" rx="14"/>
    </clipPath>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0A1E5E"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="400" fill="url(#bgGrad)"/>
    <rect x="0" y="52" width="640" height="306" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="640" height="3.5" fill="url(#topBar)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Header -->
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="28" y="36" font-size="18" font-weight="700" fill="#0A0E17">ReNF</text>
    <text x="612" y="35" text-anchor="end" font-size="12.5" font-weight="500" fill="#475569">Cascaded Multi-Horizon Forecasting</text>
  </g>
  <line x1="28" y1="52" x2="612" y2="52" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Shared Horizon Axis & Vertical Guides -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.85">
    <line x1="264" y1="74" x2="264" y2="330"/>
    <line x1="376" y1="74" x2="376" y2="330"/>
    <line x1="488" y1="74" x2="488" y2="330"/>
    <line x1="600" y1="74" x2="600" y2="330"/>
  </g>
  <line x1="264" y1="330" x2="604" y2="330" stroke="#475569" stroke-width="1.5" stroke-opacity="0.65"/>
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="264" y="346">t = 0</text>
    <text x="376" y="346">32</text>
    <text x="488" y="346">64</text>
    <text x="600" y="346">96</text>
  </g>

  <!-- Left Input Panel: 7-Channel ETTh1 History -->
  <rect x="28" y="82" width="148" height="236" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="40" y="92" width="124" height="24" rx="6" fill="#DBEAFE" fill-opacity="0.7"/>
  <text x="102" y="108" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">History (≤720)</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 40 136 C 54 128, 66 144, 80 134 C 94 124, 108 142, 124 132 C 140 124, 152 138, 164 130" stroke="#0052FF" stroke-width="2.4"/>
    <path d="M 40 160 C 56 168, 70 152, 86 162 C 102 170, 116 150, 132 158 C 146 165, 154 156, 164 162" stroke="#0EA5E9" stroke-width="2.2"/>
    <path d="M 40 184 C 52 176, 68 190, 84 182 C 100 174, 114 192, 130 184 C 144 177, 154 188, 164 180" stroke="#0A1E5E" stroke-width="2.2"/>
    <path d="M 40 208 C 54 214, 70 200, 86 210 C 102 218, 118 202, 134 210 C 148 216, 156 204, 164 208" stroke="#0052FF" stroke-width="1.7" stroke-opacity="0.45"/>
    <path d="M 40 232 C 56 225, 70 239, 86 230 C 102 222, 116 240, 132 232 C 146 226, 156 236, 164 228" stroke="#0EA5E9" stroke-width="1.7" stroke-opacity="0.45"/>
    <path d="M 40 256 C 54 262, 68 248, 84 258 C 100 266, 116 250, 132 257 C 148 263, 156 252, 164 256" stroke="#0A1E5E" stroke-width="1.6" stroke-opacity="0.38"/>
    <path d="M 40 280 C 56 273, 72 287, 88 278 C 104 270, 118 286, 134 278 C 148 272, 156 282, 164 276" stroke="#0052FF" stroke-width="1.6" stroke-opacity="0.38"/>
  </g>
  <text x="102" y="308" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#475569">7 Channels</text>

  <!-- RevIN Optical Lens -->
  <line x1="176" y1="200" x2="191" y2="200" stroke="#0052FF" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="196" y="106" width="28" height="188" rx="14" fill="url(#revinGrad)" stroke="#0052FF" stroke-width="2"/>
  <text x="210" y="200" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 210 200)" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#0A1E5E">RevIN</text>

  <!-- Fan-Out Connections from RevIN to 3 Stages -->
  <g fill="none" stroke="#0052FF" stroke-width="2" marker-end="url(#arrowBlue)">
    <path d="M 224 152 C 242 152, 240 106, 260 106"/>
    <path d="M 224 200 C 240 200, 244 190, 260 190"/>
    <path d="M 224 248 C 242 248, 240 278, 260 278"/>
  </g>

  <!-- Stage 1: MLP 1 -> Horizon 32 -->
  <rect x="264" y="76" width="112" height="62" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <path d="M 272 128 L 272 118 C 292 108, 306 124, 326 112 C 344 102, 354 114, 368 106 L 368 128 Z" fill="url(#s1Fill)"/>
  <path d="M 272 118 C 292 108, 306 124, 326 112 C 344 102, 354 114, 368 106" fill="none" stroke="#0EA5E9" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="368" cy="106" r="3.5" fill="#0EA5E9"/>
  <text x="274" y="94" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">MLP 1 · 32</text>

  <!-- Stage 2: MLP 2 -> Horizon 64 -->
  <rect x="264" y="158" width="224" height="64" rx="10" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
  <path d="M 272 212 L 272 200 C 296 188, 316 206, 342 192 C 368 178, 390 204, 418 190 C 444 176, 462 196, 480 184 L 480 212 Z" fill="url(#s2Fill)"/>
  <path d="M 272 200 C 296 188, 316 206, 342 192 C 368 178, 390 204, 418 190 C 444 176, 462 196, 480 184" fill="none" stroke="#0052FF" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="480" cy="184" r="3.5" fill="#0052FF"/>
  <text x="274" y="176" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">MLP 2 · 64</text>

  <!-- Stage 3: MLP 3 -> Horizon 96 (Final Output + EMA) -->
  <rect x="264" y="242" width="336" height="76" rx="10" fill="#FFFFFF" stroke="#0052FF" stroke-width="2.4"/>
  <path d="M 272 310 L 272 296 C 300 284, 326 302, 356 288 C 386 274, 414 298, 446 284 C 478 272, 506 298, 538 286 C 562 278, 578 292, 592 282 L 592 310 Z" fill="url(#s3Fill)"/>
  <path d="M 272 296 C 300 284, 326 302, 356 288 C 386 274, 414 298, 446 284 C 478 272, 506 298, 538 286 C 562 278, 578 292, 592 282" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <circle cx="592" cy="282" r="4.5" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="274" y="261" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0A1E5E">MLP 3 · 96</text>
  <rect x="504" y="247" width="88" height="20" rx="6" fill="#059669" fill-opacity="0.12"/>
  <text x="548" y="261" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#059669">EMA Output</text>

  <!-- Detached Cascade Feedback Arrows -->
  <g fill="none" stroke="#0A1E5E" stroke-width="2" stroke-dasharray="5 3.5" marker-end="url(#arrowDark)">
    <path d="M 376 107 C 414 107, 424 122, 424 153"/>
    <path d="M 488 190 C 528 190, 540 206, 540 237"/>
  </g>
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#475569">
    <text x="434" y="132">detach</text>
    <text x="550" y="216">detach</text>
  </g>

  <!-- Top-Right Supervision Pill -->
  <rect x="466" y="76" width="134" height="28" rx="8" fill="#DBEAFE" stroke="#0052FF" stroke-opacity="0.35" stroke-width="1"/>
  <text x="533" y="94" text-anchor="middle" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#0052FF">Stage-Weighted L1</text>

  <!-- Footer -->
  <line x1="28" y1="358" x2="612" y2="358" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.7"/>
  <g font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">
    <text x="28" y="379" fill="#475569">ETTh1 · 7 Channels · H = 96</text>
    <text x="612" y="379" text-anchor="end" fill="#475569">Metric: <tspan font-weight="700" fill="#0052FF">MSE ↓</tspan></text>
  </g>
</svg>
